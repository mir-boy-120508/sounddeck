<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SoundDeck v1.0 (YouTube Powered)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg-main: #e2e8f0;
      --panel-bg: rgba(255, 255, 255, 0.75);
      --panel-border: rgba(255, 255, 255, 0.8);
      --bar-glass-bg: rgba(255, 255, 255, 0.45);
      --bar-glass-border: rgba(255, 255, 255, 0.6);
      --accent-color: #ff2d55;
      --text-main: #000000;
      --text-sub: #8e8e93;
      --btn-main-bg: #1c1c1e;
      --btn-main-text: white;
      --item-hover: rgba(0, 0, 0, 0.04);
      --item-active: rgba(255, 45, 85, 0.08);
      --lyrics-dim: rgba(0, 0, 0, 0.25);
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      --glass-blur: blur(40px);
      --hotbar-height: 100px;
      --header-height: 80px;
    }

    html[data-theme="dark"] {
      --bg-main: #030712;
      --panel-bg: rgba(28, 28, 30, 0.65);
      --panel-border: rgba(255, 255, 255, 0.1);
      --bar-glass-bg: rgba(20, 20, 25, 0.4);
      --bar-glass-border: rgba(255, 255, 255, 0.08);
      --accent-color: #ff2d55;
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --btn-main-bg: #ffffff;
      --btn-main-text: #000000;
      --item-hover: rgba(255, 255, 255, 0.06);
      --item-active: rgba(255, 45, 85, 0.15);
      --lyrics-dim: rgba(255, 255, 255, 0.3);
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh; overflow: hidden; display: flex; flex-direction: column;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .bg-animate {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;
      background: radial-gradient(circle at 80% 20%, rgba(255, 45, 85, 0.12), transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(0, 122, 255, 0.08), transparent 50%);
    }

    /* 認証モーダル */
    #authModal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4); backdrop-filter: var(--glass-blur);
      display: flex; justify-content: center; align-items: center; z-index: 10000;
    }
    .auth-box {
      background: var(--panel-bg); border: 1px solid var(--panel-border);
      padding: 40px; border-radius: 28px; width: 100%; max-width: 400px; text-align: center; box-shadow: var(--shadow);
    }
    .auth-input {
      width: 100%; padding: 14px; border-radius: 14px; border: 1px solid rgba(125,125,125,0.2);
      background: rgba(125, 125, 125, 0.05); color: var(--text-main); font-size: 1rem; margin-bottom: 12px; outline: none;
    }
    .btn-primary {
      width: 100%; padding: 14px; border: none; border-radius: 14px;
      background: var(--btn-main-bg); color: var(--btn-main-text); font-size: 1.05rem; font-weight: 600; cursor: pointer;
    }

    #appWrap { display: none; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; }

    header {
      height: var(--header-height); padding: 0 40px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .brand-title { font-size: 1.4rem; font-weight: 800; }
    
    .btn-theme-circle {
      width: 50px; height: 50px; border-radius: 50%; background: var(--panel-bg);
      border: 1px solid var(--panel-border); color: var(--text-main); font-size: 1.35rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    main { flex: 1; padding: 0 40px 140px 40px; display: flex; flex-direction: column; overflow: hidden; }
    
    .view-tab { display: none; width: 100%; height: 100%; flex-direction: column; overflow: hidden; }
    .view-tab.active { display: flex; }
    #tab-home, #tab-search, #tab-settings { overflow-y: auto; }

    .section-title { font-size: 1.8rem; font-weight: 800; margin: 10px 0 24px 0; }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 20px; padding: 20px; display: flex; align-items: center; gap: 16px; cursor: pointer; }
    .card-img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; }
    .card-title { font-size: 1.1rem; font-weight: 700; }
    .card-desc { font-size: 0.85rem; color: var(--text-sub); }

    .playlist-layout-v06 { display: grid; grid-template-columns: 1.2fr 1.3fr 1fr; gap: 30px; height: 100%; width: 100%; }
    .pl-panel {
      background: var(--panel-bg); backdrop-filter: var(--glass-blur);
      border: 1px solid var(--panel-border); border-radius: 28px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; overflow: hidden; padding: 30px;
    }

    /* 📺 YouTubeプレイヤー埋め込みコンテナ */
    .yt-player-wrapper {
      width: 100%; aspect-ratio: 16/9; border-radius: 20px; overflow: hidden;
      background: #000; box-shadow: 0 10px 25px rgba(0,0,0,0.2); margin-bottom: 20px;
    }
    #ytPlayer { width: 100%; height: 100%; }

    .art-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
    .art-artist { font-size: 1.05rem; color: var(--accent-color); font-weight: 600; }

    .lyrics-box { flex: 1; overflow-y: auto; padding: 40% 0; }
    .l-line { font-size: 1.35rem; font-weight: 700; color: var(--lyrics-dim); margin-bottom: 24px; cursor: pointer; transition: all 0.3s; }
    .l-line.active { color: var(--text-main); transform: scale(1.05); }

    .track-list { list-style: none; overflow-y: auto; flex: 1; margin-top: 15px; }
    .track-row { display: flex; align-items: center; padding: 12px 16px; border-radius: 16px; cursor: pointer; margin-bottom: 6px; }
    .track-row:hover { background: var(--item-hover); }
    .track-row.active { background: var(--item-active); }
    .t-title { font-weight: 700; }
    .t-artist { font-size: 0.85rem; color: var(--text-sub); }

    /* ボトムホットバー */
    .hotbar {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 48px); max-width: 1240px; border-radius: 24px;
      border: 1px solid var(--bar-glass-border); height: var(--hotbar-height); background: var(--bar-glass-bg);
      backdrop-filter: var(--glass-blur); display: flex; align-items: center; padding: 0 40px; justify-content: space-between; z-index: 900;
    }
    .hb-left { display: flex; align-items: center; gap: 18px; min-width: 240px; }
    .hb-art { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }
    .hb-center { flex: 1; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .hb-controls { display: flex; align-items: center; gap: 12px; }
    .ctrl-btn { background: none; border: none; color: var(--text-main); font-size: 1.4rem; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    .ctrl-btn.btn-play { font-size: 3.2rem; width: 58px; height: 58px; }
    .hb-progress { width: 100%; display: flex; align-items: center; gap: 12px; }
    .slider { -webkit-appearance: none; appearance: none; width: 100%; height: 5px; border-radius: 3px; background: rgba(125,125,125,0.2); outline: none; cursor: pointer; }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--text-main); }

    .hb-right { display: flex; align-items: center; gap: 24px; }
    .nav-tabs { background: rgba(125,125,125,0.08); padding: 3px; border-radius: 100px; display: flex; gap: 8px; }
    .nav-tab { background: none; border: none; color: var(--text-sub); width: 46px; height: 40px; border-radius: 100px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .nav-tab.active { background: var(--panel-bg); color: var(--accent-color); width: 60px; }
  </style>
</head>
<body>

  <div class="bg-animate"></div>

  <div id="authModal">
    <div class="auth-box">
      <h2 style="margin-bottom:8px;">SoundDeck Auth</h2>
      <p style="font-size:0.85rem; color:var(--text-sub); margin-bottom:20px;">ID: myid / Pass: mypassword</p>
      <input type="text" id="authUsername" class="auth-input" placeholder="アカウントID">
      <input type="password" id="authPassword" class="auth-input" placeholder="パスワード">
      <button id="btnAuthSubmit" class="btn-primary" style="margin-top:10px;">ログイン</button>
    </div>
  </div>

  <div id="appWrap">
    <header>
      <span class="brand-title">SoundDeck</span>
      <button id="btnTheme" class="btn-theme-circle"><i class="fa-solid fa-moon"></i></button>
    </header>

    <main>
      <div id="tab-home" class="view-tab active">
        <h2 class="section-title">Home</h2>
        <div class="card-grid" id="homeQuickGrid"></div>
      </div>

      <div id="tab-playlist" class="view-tab">
        <div class="playlist-layout-v06">
          <div class="pl-panel">
            <div class="yt-player-wrapper">
              <div id="ytPlayer"></div>
            </div>
            <div class="art-info">
              <div class="art-title" id="panelTitle">---</div>
              <div class="art-artist" id="panelArtist">---</div>
            </div>
          </div>

          <div class="pl-panel" id="lyricsPanel">
            <span style="font-size:0.85rem; font-weight:700; color:var(--text-sub);">LYRICS SYNC</span>
            <div class="lyrics-box" id="lyricsBox"></div>
          </div>

          <div class="pl-panel">
            <span style="font-size:0.85rem; font-weight:700; color:var(--text-sub);">PLAYLIST TRACKS</span>
            <div class="track-list" id="trackList"></div>
          </div>
        </div>
      </div>

      <div id="tab-settings" class="view-tab">
        <h2 class="section-title">Settings</h2>
        <p>SoundDeck v1.0 (YouTube Integrated)</p>
      </div>
    </main>

    <div class="hotbar">
      <div class="hb-left">
        <img src="https://picsum.photos/id/145/200/200" id="barCover" class="hb-art">
        <div>
          <div class="hb-title" id="barTitle">---</div>
          <div class="hb-artist" id="barArtist">---</div>
        </div>
      </div>

      <div class="hb-center">
        <div class="hb-controls">
          <button class="ctrl-btn" id="btnPrev"><i class="fa-solid fa-backward-step"></i></button>
          <button class="ctrl-btn btn-play" id="btnPlay"><i class="fa-solid fa-circle-play"></i></button>
          <button class="ctrl-btn" id="btnNext"><i class="fa-solid fa-forward-step"></i></button>
        </div>
        <div class="hb-progress">
          <span id="timeCurrent">0:00</span>
          <input type="range" id="progressSlider" class="slider" min="0" value="0" step="0.1">
          <span id="timeDuration">0:00</span>
        </div>
      </div>

      <div class="hb-right">
        <div class="nav-tabs">
          <button class="nav-tab active" data-tab="home"><i class="fa-solid fa-house"></i></button>
          <button class="nav-tab" data-tab="playlist"><i class="fa-solid fa-music"></i></button>
          <button class="nav-tab" data-tab="settings"><i class="fa-solid fa-gear"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 🎵 YouTube動画IDを含むプレイリストデータ
    const songs = [
      {
        id: 0,
        title: "気まぐれロマンティック",
        artist: "いきものがかり",
        youtubeId: "d33S4L2jG-k", // YouTube動画ID (v=d33S4L2jG-k)
        cover: "https://img.youtube.com/vi/d33S4L2jG-k/hqdefault.jpg",
        lines: [
          { time: 0, text: "🎵 (イントロ)" },
          { time: 14, text: "ロマンティック 恋のアンテナは" },
          { time: 19, text: "嵐でどこかへ飛んでいった" }
        ]
      },
      {
        id: 1,
        title: "新時代",
        artist: "Ado",
        youtubeId: "1wAG69uN_mE",
        cover: "https://img.youtube.com/vi/1wAG69uN_mE/hqdefault.jpg",
        lines: [
          { time: 0, text: "🎵 (新時代)" }
        ]
      }
    ];

    let ytPlayer = null;
    let currentTrackIndex = 0;
    let isPlaying = false;
    let progressTimer = null;

    // YouTube API 準備完了時のイベント処理
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytPlayer', {
        height: '100%',
        width: '100%',
        videoId: songs[0].youtubeId,
        playerVars: { 'autoplay': 0, 'controls': 0, 'rel': 0 },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        updatePlayButton();
        startProgressLoop();
      } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
        isPlaying = false;
        updatePlayButton();
        stopProgressLoop();
        if(event.data === YT.PlayerState.ENDED) nextTrack();
      }
    }

    function loadTrack(index) {
      if (index < 0 || index >= songs.length) return;
      currentTrackIndex = index;
      const track = songs[currentTrackIndex];

      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(track.youtubeId);
      }

      document.getElementById('barTitle').innerText = track.title;
      document.getElementById('barArtist').innerText = track.artist;
      document.getElementById('barCover').src = track.cover;
      document.getElementById('panelTitle').innerText = track.title;
      document.getElementById('panelArtist').innerText = track.artist;

      renderTrackList();
      buildLyrics(track);
    }

    function togglePlay() {
      if (!ytPlayer) return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }

    function nextTrack() {
      let next = (currentTrackIndex + 1) % songs.length;
      loadTrack(next);
    }

    function prevTrack() {
      let prev = (currentTrackIndex - 1 + songs.length) % songs.length;
      loadTrack(prev);
    }

    function updatePlayButton() {
      const btnPlay = document.getElementById('btnPlay');
      btnPlay.innerHTML = isPlaying 
        ? '<i class="fa-solid fa-circle-pause"></i>' 
        : '<i class="fa-solid fa-circle-play"></i>';
    }

    function startProgressLoop() {
      stopProgressLoop();
      progressTimer = setInterval(() => {
        if (!ytPlayer || !ytPlayer.getCurrentTime) return;
        const current = ytPlayer.getCurrentTime();
        const duration = ytPlayer.getDuration();
        
        const slider = document.getElementById('progressSlider');
        slider.max = duration || 100;
        slider.value = current || 0;

        document.getElementById('timeCurrent').innerText = formatTime(current);
        document.getElementById('timeDuration').innerText = formatTime(duration);

        // 歌詞ハイライト
        const track = songs[currentTrackIndex];
        if (track && track.lines) {
          let activeIndex = -1;
          for (let i = 0; i < track.lines.length; i++) {
            if (current >= track.lines[i].time) activeIndex = i;
            else break;
          }
          const lines = document.querySelectorAll('.l-line');
          lines.forEach((l, i) => {
            if (i === activeIndex) {
              if(!l.classList.contains('active')) {
                l.classList.add('active');
                l.scrollIntoView({ behavior: 'smooth', block: 'center' });
              }
            } else {
              l.classList.remove('active');
            }
          });
        }
      }, 500);
    }

    function stopProgressLoop() {
      if (progressTimer) clearInterval(progressTimer);
    }

    function formatTime(secs) {
      if (!secs) return "0:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function buildLyrics(track) {
      const box = document.getElementById('lyricsBox');
      if (!track.lines || track.lines.length === 0) {
        box.innerHTML = '<div class="l-line active">歌詞データがありません</div>';
        return;
      }
      box.innerHTML = track.lines.map((l, i) => `
        <div class="l-line" onclick="ytPlayer.seekTo(${l.time})">${l.text}</div>
      `).join('');
    }

    function renderTrackList() {
      const list = document.getElementById('trackList');
      list.innerHTML = songs.map((s, i) => `
        <div class="track-row ${i === currentTrackIndex ? 'active' : ''}" onclick="selectTrack(${i})">
          <img src="${s.cover}" style="width:40px; height:40px; border-radius:8px; margin-right:12px;">
          <div>
            <div class="t-title">${s.title}</div>
            <div class="t-artist">${s.artist}</div>
          </div>
        </div>
      `).join('');
    }

    function selectTrack(i) {
      loadTrack(i);
      document.querySelector('.nav-tab[data-tab="playlist"]').click();
    }

    // イベント登録
    document.getElementById('btnPlay').addEventListener('click', togglePlay);
    document.getElementById('btnNext').addEventListener('click', nextTrack);
    document.getElementById('btnPrev').addEventListener('click', prevTrack);

    document.getElementById('progressSlider').addEventListener('input', (e) => {
      if (ytPlayer && ytPlayer.seekTo) {
        ytPlayer.seekTo(e.target.value);
      }
    });

    // 認証処理
    document.getElementById('btnAuthSubmit').addEventListener('click', () => {
      const u = document.getElementById('authUsername').value;
      const p = document.getElementById('authPassword').value;
      if (u === 'myid' && p === 'mypassword') {
        document.getElementById('authModal').style.display = 'none';
        document.getElementById('appWrap').style.display = 'flex';
        renderTrackList();
        loadTrack(0);
      }
    });

    // タブ切替
    document.querySelectorAll('.nav-tab').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.view-tab').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        document.getElementById(`tab-${b.dataset.tab}`).classList.add('active');
      });
    });

    // テーマ切り替え
    document.getElementById('btnTheme').addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', 'dark');
    });
  </script>
</body>
</html>
