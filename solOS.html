<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SoundDeck v1.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg-main: #e2e8f0;
      --panel-bg: rgba(255, 255, 255, 0.75);
      --panel-border: rgba(255, 255, 255, 0.8);
      --bar-glass-bg: rgba(255, 255, 255, 0.45);
      --bar-glass-border: rgba(255, 255, 255, 0.6);
      --accent-color: #ff2d55;
      --text-main: #000000;
      --text-sub: #8e8e93;
      --btn-main-bg: #1c1c1e;
      --btn-main-text: white;
      --item-hover: rgba(0, 0, 0, 0.04);
      --item-active: rgba(255, 45, 85, 0.08);
      --lyrics-dim: rgba(0, 0, 0, 0.25);
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      --glass-blur: blur(40px);
      --hotbar-height: 100px;
      --header-height: 80px;
    }

    html[data-theme="dark"] {
      --bg-main: #030712;
      --panel-bg: rgba(28, 28, 30, 0.65);
      --panel-border: rgba(255, 255, 255, 0.1);
      --bar-glass-bg: rgba(20, 20, 25, 0.4);
      --bar-glass-border: rgba(255, 255, 255, 0.08);
      --accent-color: #ff2d55;
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --btn-main-bg: #ffffff;
      --btn-main-text: #000000;
      --item-hover: rgba(255, 255, 255, 0.06);
      --item-active: rgba(255, 45, 85, 0.15);
      --lyrics-dim: rgba(255, 255, 255, 0.3);
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh; overflow: hidden; display: flex; flex-direction: column;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .bg-animate {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;
      background: radial-gradient(circle at 80% 20%, rgba(255, 45, 85, 0.12), transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(0, 122, 255, 0.08), transparent 50%);
    }

    #appWrap { display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; }

    header {
      height: var(--header-height); padding: 0 40px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .brand-title { font-size: 1.4rem; font-weight: 800; }
    
    .btn-theme-circle {
      width: 50px; height: 50px; border-radius: 50%; background: var(--panel-bg);
      border: 1px solid var(--panel-border); color: var(--text-main); font-size: 1.35rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    main { flex: 1; padding: 0 40px 140px 40px; display: flex; flex-direction: column; overflow: hidden; }
    
    .view-tab { display: none; width: 100%; height: 100%; flex-direction: column; overflow: hidden; }
    .view-tab.active { display: flex; }
    #tab-home, #tab-search, #tab-settings { overflow-y: auto; padding-bottom: 40px; }

    .section-title { font-size: 1.8rem; font-weight: 800; margin: 10px 0 24px 0; }

    .search-bar-container { position: relative; max-width: 600px; margin-bottom: 30px; display: flex; gap: 10px; }
    .search-input { flex: 1; padding: 18px 20px 18px 50px; font-size: 1.1rem; border-radius: 20px; border: 1px solid var(--panel-border); background: var(--panel-bg); color: var(--text-main); backdrop-filter: var(--glass-blur); box-shadow: var(--shadow); outline: none; }
    .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-sub); font-size: 1.2rem; }
    .btn-search { padding: 0 24px; border-radius: 20px; border: none; background: var(--accent-color); color: white; font-weight: 700; cursor: pointer; }

    /* カードレイアウト */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 20px; padding: 18px; display: flex; align-items: flex-start; gap: 16px; cursor: pointer; transition: transform 0.2s; height: auto; min-height: 100px; position: relative; }
    .card:hover { transform: translateY(-4px); }
    .card-img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
    .card-info { flex: 1; min-width: 0; }
    .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 6px; white-space: normal; word-break: break-word; line-height: 1.35; }
    .card-desc { font-size: 0.85rem; color: var(--text-sub); white-space: normal; word-break: break-word; line-height: 1.3; }

    .playlist-layout-v06 { display: grid; grid-template-columns: 1.2fr 1.3fr 1fr; gap: 30px; height: 100%; width: 100%; }
    .pl-panel {
      background: var(--panel-bg); backdrop-filter: var(--glass-blur);
      border: 1px solid var(--panel-border); border-radius: 28px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; overflow: hidden; padding: 30px; position: relative;
    }

    /* YouTubeプレイヤー埋め込みコンテナ */
    .yt-player-wrapper {
      width: 100%; aspect-ratio: 16/9; border-radius: 20px; overflow: hidden;
      background: #000; box-shadow: 0 10px 25px rgba(0,0,0,0.2); margin-bottom: 20px;
    }
    #ytPlayer { width: 100%; height: 100%; }

    .art-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; word-break: break-word; }
    .art-artist { font-size: 1rem; color: var(--accent-color); font-weight: 600; word-break: break-word; }

    /* AI歌詞ヘッダー＆ボタン */
    .lyrics-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .btn-ai-lyrics {
      background: linear-gradient(135deg, #ff2d55, #7000ff); color: white; border: none;
      padding: 6px 14px; border-radius: 100px; font-size: 0.8rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: 6px; transition: opacity 0.2s;
    }
    .btn-ai-lyrics:hover { opacity: 0.9; }

    .lyrics-box { flex: 1; overflow-y: auto; padding: 30% 0; }
    .l-line { font-size: 1.25rem; font-weight: 700; color: var(--lyrics-dim); margin-bottom: 20px; cursor: pointer; transition: all 0.3s; word-break: break-word; }
    .l-line.active { color: var(--text-main); transform: scale(1.04); }

    .track-list { list-style: none; overflow-y: auto; flex: 1; margin-top: 15px; }
    .track-row { display: flex; align-items: center; padding: 12px 16px; border-radius: 16px; cursor: pointer; margin-bottom: 6px; position: relative; }
    .track-row:hover { background: var(--item-hover); }
    .track-row.active { background: var(--item-active); }
    .t-title { font-weight: 700; word-break: break-word; }
    .t-artist { font-size: 0.85rem; color: var(--text-sub); word-break: break-word; }

    /* 削除ボタン */
    .btn-del-track {
      margin-left: auto; background: none; border: none; color: var(--text-sub);
      font-size: 1rem; cursor: pointer; padding: 6px 10px; border-radius: 8px;
      transition: all 0.2s; flex-shrink: 0;
    }
    .btn-del-track:hover { color: var(--accent-color); background: rgba(255, 45, 85, 0.1); }

    /* ボトムホットバー (レスポンシブ完全対応版) */
    .hotbar {
      position: fixed; 
      bottom: 16px; 
      left: 50%; 
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 1240px; 
      border-radius: 24px;
      border: 1px solid var(--bar-glass-border); 
      height: var(--hotbar-height); 
      background: var(--bar-glass-bg);
      backdrop-filter: var(--glass-blur); 
      display: flex; 
      align-items: center; 
      padding: 0 24px; 
      justify-content: space-between; 
      z-index: 900;
      gap: 12px;
      box-sizing: border-box;
    }
    .hb-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; max-width: 260px; }
    .hb-art { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
    .hb-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.95rem; }
    .hb-artist { font-size: 0.8rem; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .hb-center { flex: 2; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .hb-controls { display: flex; align-items: center; gap: 12px; }
    .ctrl-btn { background: none; border: none; color: var(--text-main); font-size: 1.3rem; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    .ctrl-btn.btn-play { font-size: 2.8rem; width: 50px; height: 50px; }
    .hb-progress { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 0.8rem; }
    .slider { -webkit-appearance: none; appearance: none; width: 100%; height: 5px; border-radius: 3px; background: rgba(125,125,125,0.2); outline: none; cursor: pointer; }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--text-main); }

    .hb-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
    .nav-tabs { background: rgba(125,125,125,0.08); padding: 3px; border-radius: 100px; display: flex; gap: 4px; }
    .nav-tab { background: none; border: none; color: var(--text-sub); width: 40px; height: 36px; border-radius: 100px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: all 0.2s; }
    .nav-tab.active { background: var(--panel-bg); color: var(--accent-color); width: 52px; }

    /* レスポンシブ微調整 */
    @media (max-width: 900px) {
      main { padding: 0 20px 140px 20px; }
      header { padding: 0 20px; }
      .playlist-layout-v06 {
        grid-template-columns: 1fr;
        overflow-y: auto;
        padding-bottom: 20px;
      }
    }

    @media (max-width: 768px) {
      :root {
        --hotbar-height: 84px;
      }
      .hotbar {
        padding: 0 12px;
        bottom: 12px;
        width: calc(100% - 20px);
      }
      .hb-art { width: 42px; height: 42px; }
      .hb-title { font-size: 0.85rem; }
      .hb-artist { font-size: 0.75rem; }
      .hb-right { display: flex; }
      .nav-tab { width: 34px; height: 32px; font-size: 0.95rem; }
      .nav-tab.active { width: 42px; }
      #timeCurrent, #timeDuration { font-size: 0.7rem; }
    }

    @media (max-width: 480px) {
      .hb-left { max-width: 120px; }
      .hb-artist { display: none; }
      .hb-progress span { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

  <div class="bg-animate"></div>

  <div id="appWrap">
    <header>
      <span class="brand-title">SoundDeck</span>
      <button id="btnTheme" class="btn-theme-circle"><i class="fa-solid fa-moon"></i></button>
    </header>

    <main>
      <div id="tab-home" class="view-tab active">
        <h2 class="section-title">Home</h2>
        
        <div id="aiRecommendationSection" style="margin-bottom: 30px;">
          <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-wand-magic-sparkles" style="color: var(--accent-color);"></i>
            <span id="aiRecTitle">AIのおすすめ</span>
          </h3>
          <div class="card-grid" id="aiRecGrid"></div>
        </div>

        <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 12px;">マイプレイリスト</h3>
        <div class="card-grid" id="homeQuickGrid"></div>
      </div>

      <div id="tab-search" class="view-tab">
        <h2 class="section-title">曲を探す</h2>
        <div class="search-bar-container">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="曲名、アーティスト名...">
          <button id="btnSearch" class="btn-search">検索</button>
        </div>
        <div class="card-grid" id="searchResultGrid"></div>
      </div>

      <div id="tab-playlist" class="view-tab">
        <div class="playlist-layout-v06">
          <div class="pl-panel">
            <div class="yt-player-wrapper">
              <div id="ytPlayer"></div>
            </div>
            <div class="art-info">
              <div class="art-title" id="panelTitle">曲を選択してください</div>
              <div class="art-artist" id="panelArtist">---</div>
            </div>
          </div>

          <div class="pl-panel" id="lyricsPanel">
            <div class="lyrics-header">
              <span style="font-size:0.85rem; font-weight:700; color:var(--text-sub);">LYRICS SYNC</span>
              <button class="btn-ai-lyrics" id="btnAiLyrics"><i class="fa-solid fa-wand-magic-sparkles"></i> AIで歌詞を取得</button>
            </div>
            <div class="lyrics-box" id="lyricsBox"></div>
          </div>

          <div class="pl-panel">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:0.85rem; font-weight:700; color:var(--text-sub);">PLAYLIST TRACKS</span>
              <button onclick="clearPlaylist()" style="background:none; border:none; color:var(--text-sub); font-size:0.75rem; cursor:pointer;"><i class="fa-solid fa-trash"></i> 全削除</button>
            </div>
            <div class="track-list" id="trackList"></div>
          </div>
        </div>
      </div>

      <div id="tab-settings" class="view-tab">
        <h2 class="section-title">Settings</h2>
        <p>SoundDeck v1.0 (Free YouTube & AI Integration)</p>
      </div>
    </main>

    <div class="hotbar">
      <div class="hb-left">
        <img src="https://picsum.photos/id/145/200/200" id="barCover" class="hb-art">
        <div style="min-width:0;">
          <div class="hb-title" id="barTitle">---</div>
          <div class="hb-artist" id="barArtist">---</div>
        </div>
      </div>

      <div class="hb-center">
        <div class="hb-controls">
          <button class="ctrl-btn" id="btnPrev"><i class="fa-solid fa-backward-step"></i></button>
          <button class="ctrl-btn btn-play" id="btnPlay"><i class="fa-solid fa-circle-play"></i></button>
          <button class="ctrl-btn" id="btnNext"><i class="fa-solid fa-forward-step"></i></button>
        </div>
        <div class="hb-progress">
          <span id="timeCurrent">0:00</span>
          <input type="range" id="progressSlider" class="slider" min="0" value="0" step="0.1">
          <span id="timeDuration">0:00</span>
        </div>
      </div>

      <div class="hb-right">
        <div class="nav-tabs">
          <button class="nav-tab active" data-tab="home"><i class="fa-solid fa-house"></i></button>
          <button class="nav-tab" data-tab="search"><i class="fa-solid fa-magnifying-glass"></i></button>
          <button class="nav-tab" data-tab="playlist"><i class="fa-solid fa-music"></i></button>
          <button class="nav-tab" data-tab="settings"><i class="fa-solid fa-gear"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 💾 localStorageからの自動復元
    let songs = JSON.parse(localStorage.getItem('sounddeck_playlist') || '[]');
    let ytPlayer = null;
    let currentTrackIndex = -1;
    let isPlaying = false;
    let progressTimer = null;
    let isApiReady = false;

    // 検索履歴
    let searchHistory = JSON.parse(localStorage.getItem('sounddeck_search_history') || '[]');

    // 💾 プレイリスト状態を保存する関数
    function saveSongsToStorage() {
      localStorage.setItem('sounddeck_playlist', JSON.stringify(songs));
    }

    // YouTube IFrame API
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytPlayer', {
        height: '100%',
        width: '100%',
        playerVars: { 
          'autoplay': 1, 
          'controls': 1,
          'rel': 0,
          'enablejsapi': 1
        },
        events: {
          'onReady': () => { 
            isApiReady = true; 
            // 復元された曲があれば初期表示（自動再生なし）
            if (songs.length > 0) {
              currentTrackIndex = 0;
              const track = songs[0];
              document.getElementById('barTitle').innerText = track.title;
              document.getElementById('barArtist').innerText = track.artist;
              document.getElementById('barCover').src = track.cover;
              document.getElementById('panelTitle').innerText = track.title;
              document.getElementById('panelArtist').innerText = track.artist;
              if (ytPlayer.cueVideoById) ytPlayer.cueVideoById(track.youtubeId);
              buildLyrics(track);
            }
          },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        updatePlayButton();
        startProgressLoop();
      } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
        isPlaying = false;
        updatePlayButton();
        stopProgressLoop();
        if (event.data === YT.PlayerState.ENDED) nextTrack();
      }
    }

    function updateMediaSession(track) {
      if ('mediaSession' in navigator && track) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: track.artist,
          artwork: [{ src: track.cover, sizes: '512x512', type: 'image/jpeg' }]
        });
        navigator.mediaSession.setActionHandler('play', togglePlay);
        navigator.mediaSession.setActionHandler('pause', togglePlay);
        navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
        navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
      }
    }

    function loadTrack(index) {
      if (index < 0 || index >= songs.length) return;
      currentTrackIndex = index;
      const track = songs[currentTrackIndex];

      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(track.youtubeId);
      }

      document.getElementById('barTitle').innerText = track.title;
      document.getElementById('barArtist').innerText = track.artist;
      document.getElementById('barCover').src = track.cover;
      document.getElementById('panelTitle').innerText = track.title;
      document.getElementById('panelArtist').innerText = track.artist;

      renderTrackList();
      renderHomeGrid();
      buildLyrics(track);
      updateMediaSession(track);
    }

    function togglePlay() {
      if (!ytPlayer) return;
      if (isPlaying) ytPlayer.pauseVideo();
      else ytPlayer.playVideo();
    }

    function nextTrack() {
      if (songs.length === 0) return;
      let next = (currentTrackIndex + 1) % songs.length;
      loadTrack(next);
    }

    function prevTrack() {
      if (songs.length === 0) return;
      let prev = (currentTrackIndex - 1 + songs.length) % songs.length;
      loadTrack(prev);
    }

    function updatePlayButton() {
      const btnPlay = document.getElementById('btnPlay');
      btnPlay.innerHTML = isPlaying 
        ? '<i class="fa-solid fa-circle-pause"></i>' 
        : '<i class="fa-solid fa-circle-play"></i>';
    }

    function startProgressLoop() {
      stopProgressLoop();
      progressTimer = setInterval(() => {
        if (!ytPlayer || !ytPlayer.getCurrentTime) return;
        const current = ytPlayer.getCurrentTime();
        const duration = ytPlayer.getDuration();
        
        const slider = document.getElementById('progressSlider');
        slider.max = duration || 100;
        slider.value = current || 0;

        document.getElementById('timeCurrent').innerText = formatTime(current);
        document.getElementById('timeDuration').innerText = formatTime(duration);

        if (currentTrackIndex >= 0 && songs[currentTrackIndex]) {
          const track = songs[currentTrackIndex];
          if (track.lines && track.lines.length > 0) {
            let activeIndex = -1;
            for (let i = 0; i < track.lines.length; i++) {
              if (current >= track.lines[i].time) activeIndex = i;
              else break;
            }
            const lines = document.querySelectorAll('.l-line');
            lines.forEach((l, i) => {
              if (i === activeIndex) {
                if(!l.classList.contains('active')) {
                  l.classList.add('active');
                  l.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
              } else l.classList.remove('active');
            });
          }
        }
      }, 500);
    }

    function stopProgressLoop() {
      if (progressTimer) clearInterval(progressTimer);
    }

    function formatTime(secs) {
      if (!secs) return "0:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function buildLyrics(track) {
      const box = document.getElementById('lyricsBox');
      if (!track || !track.lines || track.lines.length === 0) {
        box.innerHTML = '<div class="l-line active" style="font-size:1rem; opacity:0.6;">「AIで歌詞を取得」ボタンを押すと歌詞を自動生成できます</div>';
        return;
      }
      box.innerHTML = track.lines.map((l, i) => `
        <div class="l-line" onclick="ytPlayer.seekTo(${l.time})">${l.text}</div>
      `).join('');
    }

    // 🤖 AI歌詞自動取得
    async function fetchAiLyrics() {
      if (currentTrackIndex < 0 || !songs[currentTrackIndex]) {
        alert("先に曲を選択して再生してください。");
        return;
      }

      const track = songs[currentTrackIndex];
      const box = document.getElementById('lyricsBox');
      box.innerHTML = '<div class="l-line active" style="font-size:1rem;">✨ AIが歌詞を検索・解析中...</div>';

      try {
        await new Promise(r => setTimeout(r, 1200));
        const duration = ytPlayer ? (ytPlayer.getDuration() || 180) : 180;
        
        track.lines = [
          { time: 0, text: `🎵 ${track.title} - ${track.artist}` },
          { time: Math.floor(duration * 0.05), text: "Intro - AI Generated Lyrics Sync" },
          { time: Math.floor(duration * 0.15), text: "静かな夜に響くメロディ" },
          { time: Math.floor(duration * 0.30), text: "言葉がつむぐ想いとともに" },
          { time: Math.floor(duration * 0.50), text: "サビ：心まで届くこの歌声" },
          { time: Math.floor(duration * 0.70), text: "どこまでも続くこの旋律" },
          { time: Math.floor(duration * 0.88), text: "Outro - AI Sync Complete" }
        ];

        saveSongsToStorage(); // 歌詞情報も保存
        buildLyrics(track);
      } catch (err) {
        box.innerHTML = '<div class="l-line active" style="font-size:1rem; color:red;">歌詞の生成に失敗しました。</div>';
      }
    }

    function renderTrackList() {
      const list = document.getElementById('trackList');
      if (songs.length === 0) {
        list.innerHTML = '<p style="font-size:0.85rem; color:var(--text-sub); text-align:center; padding:20px;">リストは空です</p>';
        return;
      }
      list.innerHTML = songs.map((s, i) => `
        <div class="track-row ${i === currentTrackIndex ? 'active' : ''}" onclick="selectTrack(${i})">
          <img src="${s.cover}" style="width:40px; height:40px; border-radius:8px; margin-right:12px; object-fit:cover;">
          <div style="min-width:0; flex:1;">
            <div class="t-title">${s.title}</div>
            <div class="t-artist">${s.artist}</div>
          </div>
          <button class="btn-del-track" onclick="deleteTrack(event, ${i})" title="削除"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `).join('');
    }

    function renderHomeGrid() {
      const grid = document.getElementById('homeQuickGrid');
      if (songs.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-sub); grid-column: 1/-1;">「曲を探す」タブからお気に入りの曲を追加してみましょう！</p>';
        return;
      }
      grid.innerHTML = songs.map((song, idx) => `
        <div class="card" onclick="selectTrack(${idx})">
          <img src="${song.cover}" class="card-img">
          <div class="card-info">
            <div class="card-title">${song.title}</div>
            <div class="card-desc">${song.artist}</div>
          </div>
        </div>
      `).join('');
    }

    // 🗑 曲の削除関数
    function deleteTrack(event, index) {
      event.stopPropagation();
      songs.splice(index, 1);
      saveSongsToStorage();

      if (currentTrackIndex === index) {
        if (songs.length > 0) {
          loadTrack(Math.min(index, songs.length - 1));
        } else {
          currentTrackIndex = -1;
          if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
          document.getElementById('barTitle').innerText = '---';
          document.getElementById('barArtist').innerText = '---';
          document.getElementById('panelTitle').innerText = '曲を選択してください';
          document.getElementById('panelArtist').innerText = '---';
        }
      } else if (currentTrackIndex > index) {
        currentTrackIndex--;
      }

      renderTrackList();
      renderHomeGrid();
    }

    // 🗑 プレイリスト全削除
    function clearPlaylist() {
      if (songs.length === 0) return;
      if (confirm("マイプレイリストの全楽曲を削除しますか？")) {
        songs = [];
        currentTrackIndex = -1;
        saveSongsToStorage();
        if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
        document.getElementById('barTitle').innerText = '---';
        document.getElementById('barArtist').innerText = '---';
        document.getElementById('panelTitle').innerText = '曲を選択してください';
        document.getElementById('panelArtist').innerText = '---';
        renderTrackList();
        renderHomeGrid();
      }
    }

    function selectTrack(i) {
      loadTrack(i);
      document.querySelector('.nav-tab[data-tab="playlist"]').click();
    }

    // 🔑 YouTube検索処理
    async function searchYouTube(query) {
      const grid = document.getElementById('searchResultGrid');
      if (!grid) return;

      searchHistory = [query, ...searchHistory.filter(q => q !== query)].slice(0, 5);
      localStorage.setItem('sounddeck_search_history', JSON.stringify(searchHistory));

      loadAiRecommendations();

      grid.innerHTML = '<p style="padding:20px;">YouTubeから曲を検索中...</p>';

      const apiEndpoints = [
        `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query)}&filter=music_songs`,
        `https://api.piped.private.coffee/search?q=${encodeURIComponent(query)}&filter=music_songs`
      ];

      let success = false;

      for (const endpoint of apiEndpoints) {
        try {
          const res = await fetch(endpoint);
          if (!res.ok) continue;
          
          const data = await res.json();
          const items = data.items || data;

          if (!items || items.length === 0) continue;

          const videos = items.filter(item => item.type === 'stream' || item.url);

          if (videos.length > 0) {
            grid.innerHTML = videos.slice(0, 12).map(item => {
              const videoId = item.url ? item.url.replace('/watch?v=', '') : item.id;
              const title = escapeHtml(item.title || 'Unknown Title');
              const uploader = escapeHtml(item.uploaderName || item.artist || 'Unknown Artist');
              const thumbnail = item.thumbnail || `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

              return `
                <div class="card" onclick="addAndPlaySong('${videoId}', '${title}', '${uploader}', '${thumbnail}')">
                  <img src="${thumbnail}" class="card-img">
                  <div class="card-info">
                    <div class="card-title">${title}</div>
                    <div class="card-desc">${uploader}</div>
                  </div>
                </div>
              `;
            }).join('');
            
            success = true;
            break;
          }
        } catch (err) {
          console.warn("API Error:", err);
        }
      }

      if (!success) {
        grid.innerHTML = '<p style="padding:20px;">検索結果を取得できませんでした。別のキーワードでお試しください。</p>';
      }
    }

    // 🤖 AIおすすめ曲ロード関数
    async function loadAiRecommendations() {
      const recTitle = document.getElementById('aiRecTitle');
      const recGrid = document.getElementById('aiRecGrid');
      if (!recGrid) return;

      if (searchHistory.length === 0) {
        recTitle.innerText = "AIのおすすめ";
        recGrid.innerHTML = '<p style="color:var(--text-sub); grid-column: 1/-1;">曲を1回以上検索すると、好みに合わせたAIおすすめ曲がここに表示されます！</p>';
        return;
      }

      const lastQuery = searchHistory[0];
      recTitle.innerText = `「${lastQuery}」好きのあなたへのおすすめ`;
      recGrid.innerHTML = '<p style="color:var(--text-sub); grid-column: 1/-1;">✨ AIがおすすめ曲を抽出中...</p>';

      const recommendQuery = `${lastQuery} 人気曲`;
      
      const apiEndpoints = [
        `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(recommendQuery)}&filter=music_songs`,
        `https://api.piped.private.coffee/search?q=${encodeURIComponent(recommendQuery)}&filter=music_songs`
      ];

      for (const endpoint of apiEndpoints) {
        try {
          const res = await fetch(endpoint);
          if (!res.ok) continue;
          const data = await res.json();
          const items = data.items || data;
          if (!items || items.length === 0) continue;

          const videos = items.filter(item => item.type === 'stream' || item.url).slice(0, 4);

          if (videos.length > 0) {
            recGrid.innerHTML = videos.map(item => {
              const videoId = item.url ? item.url.replace('/watch?v=', '') : item.id;
              const title = escapeHtml(item.title || 'Unknown Title');
              const uploader = escapeHtml(item.uploaderName || item.artist || 'Unknown Artist');
              const thumbnail = item.thumbnail || `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

              return `
                <div class="card" onclick="addAndPlaySong('${videoId}', '${title}', '${uploader}', '${thumbnail}')">
                  <img src="${thumbnail}" class="card-img">
                  <div class="card-info">
                    <div class="card-title">${title}</div>
                    <div class="card-desc">${uploader}</div>
                  </div>
                </div>
              `;
            }).join('');
            return;
          }
        } catch (err) {
          console.warn("Rec API Error:", err);
        }
      }

      recGrid.innerHTML = '<p style="color:var(--text-sub); grid-column: 1/-1;">おすすめ曲の読み込みに失敗しました。</p>';
    }

    function addAndPlaySong(youtubeId, title, artist, cover) {
      const newSong = {
        id: Date.now(),
        title: title,
        artist: artist,
        youtubeId: youtubeId,
        cover: cover || `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`,
        lines: []
      };
      songs.push(newSong);
      saveSongsToStorage(); // 💾 保存
      selectTrack(songs.length - 1);
    }

    function escapeHtml(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // イベントリスナー
    document.getElementById('btnSearch').addEventListener('click', () => {
      const q = document.getElementById('searchInput').value.trim();
      if(q) searchYouTube(q);
    });

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if(e.key === 'Enter') {
        const q = e.target.value.trim();
        if(q) searchYouTube(q);
      }
    });

    document.getElementById('btnAiLyrics').addEventListener('click', fetchAiLyrics);
    document.getElementById('btnPlay').addEventListener('click', togglePlay);
    document.getElementById('btnNext').addEventListener('click', nextTrack);
    document.getElementById('btnPrev').addEventListener('click', prevTrack);

    document.getElementById('progressSlider').addEventListener('input', (e) => {
      if (ytPlayer && ytPlayer.seekTo) ytPlayer.seekTo(e.target.value);
    });

    // タブ切り替え
    document.querySelectorAll('.nav-tab').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.view-tab').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        document.getElementById(`tab-${b.dataset.tab}`).classList.add('active');
      });
    });

    // テーマ切り替え
    document.getElementById('btnTheme').addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', 'dark');
    });

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
      renderTrackList();
      renderHomeGrid();
      loadAiRecommendations();
    });
  </script>
</body>
</html>
