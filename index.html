<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SoundDeck v1.0 (Private)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SoundDeck">

  <style>
    /* =========================================
       🎨 Apple Style: Liquid Glass Theme
       ========================================= */
    :root {
      --bg-main: #e2e8f0; 
      --panel-bg: rgba(255, 255, 255, 0.75);
      --panel-border: rgba(255, 255, 255, 0.8);
      --accent-color: #ff2d55;
      --text-main: #000000;
      --text-muted: #1c1c1e;
      --text-sub: #8e8e93;
      --btn-main-bg: #1c1c1e;
      --btn-main-text: white;
      --item-hover: rgba(0, 0, 0, 0.04);
      --item-active: rgba(255, 45, 85, 0.08);
      --lyrics-dim: rgba(0, 0, 0, 0.25);
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      --glass-blur: blur(30px);
      --hotbar-height: 90px;
      --header-height: 80px;
    }

    html[data-theme="dark"] {
      --bg-main: #030712;
      --panel-bg: rgba(28, 28, 30, 0.65);
      --panel-border: rgba(255, 255, 255, 0.1);
      --accent-color: #ff2d55;
      --text-main: #ffffff;
      --text-muted: #f2f2f7;
      --text-sub: #8e8e93;
      --btn-main-bg: #ffffff;
      --btn-main-text: #000000;
      --item-hover: rgba(255, 255, 255, 0.06);
      --item-active: rgba(255, 45, 85, 0.15);
      --lyrics-dim: rgba(255, 255, 255, 0.3);
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box;
        font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .bg-animate {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
      background: radial-gradient(circle at 80% 20%, rgba(255, 45, 85, 0.12), transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(0, 122, 255, 0.08), transparent 50%);
      animation: ambientBg 20s infinite alternate ease-in-out;
    }
    @keyframes ambientBg { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

    /* =========================================
       🔒 認証モーダル
       ========================================= */
    #authModal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      display: flex; justify-content: center; align-items: center; z-index: 10000;
    }
    .auth-box {
      background: var(--panel-bg); border: 1px solid var(--panel-border);
      padding: 40px; border-radius: 28px; width: 100%; max-width: 400px;
      box-shadow: var(--shadow); text-align: center;
    }
    .auth-subtitle { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 24px; }
    .auth-input {
      width: 100%; padding: 14px; border-radius: 14px;
      border: 1px solid rgba(125,125,125,0.2);
      background: rgba(125, 125, 125, 0.05); color: var(--text-main); font-size: 1rem;
      margin-bottom: 12px; outline: none; text-align: center;
    }
    .auth-error { color: var(--accent-color); font-size: 0.8rem; margin-bottom: 12px; min-height: 18px; text-align: center; }
    
    .btn-primary {
      width: 100%; min-height: 48px; padding: 14px; border: none; border-radius: 14px;
      background: var(--btn-main-bg); color: var(--btn-main-text); font-size: 1.05rem; font-weight: 600;
      cursor: pointer; transition: transform 0.2s;
    }
    .btn-primary:active { transform: scale(0.98); }

    /* =========================================
       📱 アプリケーションメイン画面
       ========================================= */
    #appWrap { display: none; flex-direction: column; height: 100vh; width: 100vw; }

    header {
      height: var(--header-height); padding: 0 40px; display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0; z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 24px; }
    .brand-group { display: flex; align-items: center; gap: 10px; }
    .brand-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
    
    /* 📶 オフライン検知ステータスバッジ */
    .offline-badge {
      display: none; background: rgba(255, 45, 85, 0.15); color: var(--accent-color);
      padding: 6px 12px; border-radius: 12px; font-size: 11px; font-weight: 700;
      border: 1px solid rgba(255, 45, 85, 0.25); align-items: center; gap: 6px; letter-spacing: 0.5px;
    }

    .btn-theme-circle {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--panel-bg); border: 1px solid var(--panel-border);
      color: var(--text-main); font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.3s ease; box-shadow: var(--shadow);
    }

    main { flex: 1; padding: 0 40px 30px 40px; display: flex; flex-direction: column; overflow: hidden; }
    .view-tab { display: none; width: 100%; height: 100%; flex-direction: column; overflow-y: auto; }
    .view-tab.active { display: flex; }
    #view-playlist { overflow: hidden; } 
    
    .section-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 20px; letter-spacing: -0.5px; }
    .pl-panel {
      background: var(--panel-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--panel-border); border-radius: 28px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* =========================================
       🎼 プレイヤー：3カラム分割レイアウト
       ========================================= */
    .playlist-layout-v06 { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 30px; height: 100%; }
    
    .pl-panel-art { padding: 40px 30px; justify-content: center; align-items: center; }
    .art-mega-wrapper { width: 100%; max-width: 320px; aspect-ratio: 1; margin: 0 auto; border-radius: 24px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.15); }
    .art-mega { width: 100%; height: 100%; object-fit: cover; }
    .art-info { text-align: center; margin-top: 24px; width: 100%; }
    .art-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
    .art-artist { font-size: 1.1rem; color: var(--accent-color); font-weight: 600; }

    .pl-panel-lyrics { padding: 30px; position: relative; }
    .list-header { font-size: 0.9rem; font-weight: 700; letter-spacing: 1px; color: var(--text-sub); margin-bottom: 15px; display: block; }
    
    .lyrics-box { flex: 1; overflow-y: auto; padding: 50% 0; scroll-behavior: smooth; }
    .lyrics-box::-webkit-scrollbar { display: none; }
    .l-line { font-size: 1.3rem; font-weight: 700; color: var(--lyrics-dim); line-height: 1.6; margin-bottom: 24px; transition: all 0.3s ease; }
    .l-line.active { color: var(--text-main); transform: scale(1.03); }

    .pl-panel-list { padding: 30px; }
    .track-list { list-style: none; overflow-y: auto; flex: 1; }
    .track-list::-webkit-scrollbar { display: none; }
    .track-row { display: flex; align-items: center; padding: 12px 16px; border-radius: 16px; cursor: pointer; border: 1px solid transparent; transition: background 0.2s; margin-bottom: 6px; }
    .track-row:hover { background: var(--item-hover); }
    .track-row.active { background: var(--item-active); border: 1px solid rgba(255,45,85,0.1); }
    .track-row.active .t-title { color: var(--accent-color); }
    .t-num { width: 30px; color: var(--text-sub); font-weight: 700; }
    .t-art { width: 44px; height: 44px; border-radius: 10px; margin-right: 16px; object-fit: cover; }
    .t-info { flex: 1; overflow: hidden; }
    .t-title { font-weight: 700; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t-artist { font-size: 0.85rem; color: var(--text-sub); }

    /* =========================================
       📊 解析録（ランキング）
       ========================================= */
    .rank-card-list { display: flex; flex-direction: column; gap: 12px; }
    .rank-item {
      display: flex; align-items: center; padding: 16px 24px; background: var(--panel-bg);
      border: 1px solid var(--panel-border); box-shadow: var(--shadow); border-radius: 18px;
    }
    .rank-num { font-size: 1.5rem; font-weight: 800; color: var(--accent-color); width: 44px; }
    .rank-info { flex: 1; }
    .rank-title { font-size: 1.1rem; font-weight: 700; }
    .rank-artist { font-size: 0.9rem; color: var(--text-sub); margin-top: 2px; }
    .rank-count { font-size: 0.9rem; font-weight: 700; background: rgba(255,45,85,0.08); color: var(--accent-color); padding: 6px 14px; border-radius: 12px; }

    /* =========================================
       ⚙️ 管制室（設定画面）
       ========================================= */
    .account-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 28px; padding: 40px; max-width: 600px; box-shadow: var(--shadow); }
    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 10px; color: var(--text-sub); }
    .input-flat {
      width: 100%; max-width: 340px; padding: 14px; border-radius: 12px;
      border: 1px solid rgba(125,125,125,0.2); background: rgba(125, 125, 125, 0.04);
      color: var(--text-main); font-size: 1rem; outline: none; display: block; margin-bottom: 12px;
    }
    .acc-btn { padding: 12px 24px; border-radius: 14px; font-weight: 700; cursor: pointer; border: none; font-size: 0.95rem; }
    .btn-outline { background: transparent; border: 2px solid var(--accent-color); color: var(--accent-color); }
    .btn-danger { background: rgba(255, 59, 48, 0.1); color: #ff3b30; border: 2px solid rgba(255, 59, 48, 0.3); }
    .acc-message { font-size: 0.85rem; margin-top: 10px; color: #34c759; font-weight: 600; }

    /* =========================================
       🎛️ ボトムホットバー
       ========================================= */
    .hotbar {
      height: var(--hotbar-height); width: 100%; background: var(--panel-bg); border-top: 1px solid var(--panel-border);
      display: flex; align-items: center; padding: 0 40px; justify-content: space-between; position: relative; z-index: 100;
    }
    .hb-left { display: flex; align-items: center; gap: 16px; width: 25%; min-width: 200px; }
    .hb-art { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; }
    .hb-info { overflow: hidden; }
    .hb-title { font-weight: 700; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hb-artist { font-size: 0.85rem; color: var(--text-sub); }

    .hb-center { flex: 1; max-width: 600px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .hb-controls { display: flex; align-items: center; gap: 24px; }
    .ctrl-btn { background: none; border: none; color: var(--text-main); font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; }
    .ctrl-btn.active { color: var(--accent-color); }
    .btn-play { font-size: 2.5rem; }
    
    .hb-progress { width: 100%; display: flex; align-items: center; gap: 12px; font-size: 0.8rem; color: var(--text-sub); font-weight: 600; }
    .slider { flex: 1; -webkit-appearance: none; appearance: none; height: 6px; background: rgba(125,125,125,0.2); border-radius: 3px; outline: none; cursor: pointer; }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--text-main); cursor: pointer; }
    .slider::-webkit-slider-thumb:hover { background: var(--accent-color); }

    .hb-right { width: 25%; min-width: 250px; display: flex; justify-content: flex-end; align-items: center; }
    .nav-tabs { display: flex; background: rgba(125,125,125,0.1); border-radius: 20px; padding: 4px; }
    .nav-tab { background: none; border: none; color: var(--text-sub); padding: 8px 20px; border-radius: 16px; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
    .nav-tab.active { background: var(--panel-bg); color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

    @media (max-width: 900px) {
      .playlist-layout-v06 { grid-template-columns: 1fr; overflow-y: auto; }
      .hb-left { display: none; }
    }
  </style>
</head>
<body>

  <div class="bg-animate"></div>

  <div id="authModal">
    <div class="auth-box">
      <h2 style="font-size:1.6rem; margin-bottom:8px;">SoundDeck System</h2>
      <div class="auth-subtitle">認証資格情報を入力してください</div>
      <input type="text" id="authId" class="auth-input" placeholder="ユーザーID" autocomplete="off">
      <input type="password" id="authPass" class="auth-input" placeholder="アクセスコード">
      <div id="authError" class="auth-error"></div>
      <button id="btnLogin" class="btn-primary">システムログイン</button>
    </div>
  </div>

  <div id="appWrap">
    <header>
      <div class="header-left">
        <div class="brand-group">
          <span class="brand-title">SoundDeck</span>
        </div>
        <span class="offline-badge" id="offlineBadge">⚠️ OFFLINE MODE</span>
      </div>
      <div>
        <button id="btnTheme" class="btn-theme-circle">🌙</button>
      </div>
    </header>

    <main>
      <div id="tab-home" class="view-tab active">
        <div class="playlist-layout-v06">
          <div class="pl-panel pl-panel-art">
            <div class="art-mega-wrapper">
              <img src="jacket1.png" alt="Cover" class="art-mega" id="panelCover">
            </div>
            <div class="art-info">
              <div class="art-title" id="panelTitle">---</div>
              <div class="art-artist" id="panelArtist">---</div>
            </div>
          </div>
          <div class="pl-panel pl-panel-lyrics">
            <span class="list-header">同期リリックデータ</span>
            <div class="lyrics-box" id="lyricsBox"></div>
          </div>
          <div class="pl-panel pl-panel-list">
            <span class="list-header">プレイリスト</span>
            <div class="track-list" id="trackList"></div>
          </div>
        </div>
      </div>

      <div id="tab-analytics" class="view-tab">
        <h2 class="section-title">高頻度再生トラックランキング</h2>
        <div class="rank-card-list" id="rankingList"></div>
      </div>

      <div id="tab-settings" class="view-tab">
        <h2 class="section-title">システム環境設定</h2>
        <div class="account-card">
          <div class="form-group">
            <label>アクセスコードの変更</label>
            <input type="password" id="newPassInput" class="input-flat" placeholder="新しいコード（4文字以上）">
            <button id="btnUpdatePass" class="acc-btn btn-outline">更新</button>
            <div id="passMsg" class="acc-message" style="display:none;"></div>
          </div>

          <div style="margin-top:40px; border-top:1px solid rgba(125,125,125,0.1); padding-top:20px; display:flex; gap:14px;">
            <button id="btnLogout" class="acc-btn btn-danger">セッション終了</button>
            <button id="btnResetData" class="acc-btn btn-danger" style="background:rgba(255,45,85,0.05); border-color:rgba(255,45,85,0.2);">ストレージ初期化</button>
          </div>
        </div>
      </div>
    </main>

    <div class="hotbar">
      <div class="hb-left">
        <img src="jacket1.png" alt="Cover" class="hb-art" id="hbCover">
        <div class="hb-info">
          <div class="hb-title" id="hbTitle">---</div>
          <div class="hb-artist" id="hbArtist">---</div>
        </div>
      </div>
      <div class="hb-center">
        <div class="hb-controls">
          <button id="btnShuffle" class="ctrl-btn" title="シャッフル再生"><i class="fa-solid fa-shuffle"></i></button>
          <button id="btnPrev" class="ctrl-btn"><i class="fa-solid fa-backward-step"></i></button>
          <button id="btnPlay" class="ctrl-btn btn-play"><i class="fa-solid fa-circle-play"></i></button>
          <button id="btnNext" class="ctrl-btn"><i class="fa-solid fa-forward-step"></i></button>
          <button id="btnRepeat" class="ctrl-btn" title="リピート再生"><i class="fa-solid fa-repeat"></i></button>
        </div>
        <div class="hb-progress">
          <span id="timeCurrent">0:00</span>
          <input type="range" id="progressSlider" class="slider" min="0" value="0" step="0.1">
          <span id="timeTotal">0:00</span>
        </div>
      </div>
      <div class="hb-right">
        <div class="nav-tabs">
          <button class="nav-tab active" data-tab="home">プレイヤー</button>
          <button class="nav-tab" data-tab="analytics">解析録</button>
          <button class="nav-tab" data-tab="settings">管制室</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- 🎵 楽曲データベース (ご提示データを完全維持) ---
    let songs = [
      { id: 0, title: "気まぐれロマンティック", artist: "いきものがかり", src: "song1.mp3", cover: "jacket1.png", lines: [

      { id: 8, title: "やさしい気持ち", artist: "Chara", src: "song9.mp3", cover: "jacket9.png", lines: [{ time: 0, text: "Chara - やさしい気持ち" }]},
      { id: 9, title: "君と光", artist: "西川瑞希", src: "song10.mp3", cover: "jacket10.png", lines: [{ time: 0, text: "大原ゆい子 - 君と光" }]}
    ];

    const audio = new Audio();
    let currentTrackIndex = 0;
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false;
    let userSession = "default_user";
    let trackerTimerId = null;

    // DOM要素一式
    const authModal = document.getElementById('authModal');
    const appWrap = document.getElementById('appWrap');
    const authId = document.getElementById('authId');
    const authPass = document.getElementById('authPass');
    const btnLogin = document.getElementById('btnLogin');
    const authError = document.getElementById('authError');
    const offlineBadge = document.getElementById('offlineBadge');

    const hbCover = document.getElementById('hbCover');
    const hbTitle = document.getElementById('hbTitle');
    const hbArtist = document.getElementById('hbArtist');
    const panelCover = document.getElementById('panelCover');
    const panelTitle = document.getElementById('panelTitle');
    const panelArtist = document.getElementById('panelArtist');

    const btnPlay = document.getElementById('btnPlay');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnShuffle = document.getElementById('btnShuffle');
    const btnRepeat = document.getElementById('btnRepeat');
    const btnTheme = document.getElementById('btnTheme');

    const timeCurrent = document.getElementById('timeCurrent');
    const timeTotal = document.getElementById('timeTotal');
    const progressSlider = document.getElementById('progressSlider');
    const lyricsBox = document.getElementById('lyricsBox');
    const trackList = document.getElementById('trackList');
    const rankingList = document.getElementById('rankingList');

    const newPassInput = document.getElementById('newPassInput');
    const btnUpdatePass = document.getElementById('btnUpdatePass');
    const passMsg = document.getElementById('passMsg');
    const btnLogout = document.getElementById('btnLogout');
    const btnResetData = document.getElementById('btnResetData');

    function safeSet(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
    function safeGet(k) { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }
    function safeRemove(k) { localStorage.removeItem(k); }

    // 📡 iPad用ネットワーク状況自動監視
    function checkNetwork() {
      if (navigator.onLine) {
        offlineBadge.style.display = 'none';
      } else {
        offlineBadge.style.display = 'inline-flex';
      }
    }
    window.addEventListener('online', checkNetwork);
    window.addEventListener('offline', checkNetwork);

    // ログイン認証
    window.addEventListener('DOMContentLoaded', () => {
      checkNetwork();
      const savedUser = safeGet('sd_session_user');
      if (savedUser) {
        userSession = savedUser;
        showApp();
      }
    });

    btnLogin.onclick = () => {
      const id = authId.value.trim();
      const pass = authPass.value;
      if (!id || !pass) { authError.textContent = "IDとコードを入力してください。"; return; }
      
      const customPass = safeGet(`sd_pass_${id}`);
      const systemPass = customPass || "0000"; // 初期コードを0000に設定

      if (pass === systemPass) {
        userSession = id;
        safeSet('sd_session_user', id);
        authError.textContent = "";
        showApp();
      } else {
        authError.textContent = "アクセスコードが違います。";
      }
    };

    function showApp() {
      authModal.style.display = 'none';
      appWrap.style.display = 'flex';
      loadTrack(0);
      renderTrackList();
      renderRanking();
    }

    // 🎧 トラック読み込み＆描画基盤
    function loadTrack(index) {
      currentTrackIndex = index;
      const song = songs[index];

      hbTitle.textContent = song.title;
      hbArtist.textContent = song.artist;
      panelTitle.textContent = song.title;
      panelArtist.textContent = song.artist;
      hbCover.src = song.cover;
      panelCover.src = song.cover;

      audio.src = song.src;
      audio.load();

      // オーディオメタデータロード後に秒数を正確に割り当てる
      audio.onloadedmetadata = () => {
        timeTotal.textContent = formatTime(audio.duration);
        progressSlider.max = audio.duration;
      };

      progressSlider.value = 0;
      timeCurrent.textContent = "0:00";

      // 歌詞の初期生成
      lyricsBox.innerHTML = "";
      song.lines.forEach((l, i) => {
        const lineDiv = document.createElement('div');
        lineDiv.className = `l-line ${i === 0 ? 'active' : ''}`;
        lineDiv.id = `lyric-line-${i}`;
        lineDiv.textContent = l.text;
        lyricsBox.appendChild(lineDiv);
      });
      lyricsBox.scrollTop = 0;
    }

    function formatTime(secs) {
      if(isNaN(secs)) return "0:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // 🎛️ コントロールパネルの動作
    btnPlay.onclick = () => { if (isPlaying) { pauseTrack(); } else { playTrack(); } };
    btnPrev.onclick = () => { changeTrack(-1); };
    btnNext.onclick = () => { changeTrack(1); };

    btnShuffle.onclick = () => {
      isShuffle = !isShuffle;
      btnShuffle.classList.toggle('active', isShuffle);
    };

    btnRepeat.onclick = () => {
      isRepeat = !isRepeat;
      btnRepeat.classList.toggle('active', isRepeat);
    };

    function playTrack() {
      isPlaying = true;
      btnPlay.innerHTML = '<i class="fa-solid fa-circle-pause"></i>';
      audio.play().catch(() => {});
      startTracker();
      incrementStats(songs[currentTrackIndex].id);
    }

    function pauseTrack() {
      isPlaying = false;
      btnPlay.innerHTML = '<i class="fa-solid fa-circle-play"></i>';
      audio.pause();
      stopTracker();
    }

    function changeTrack(direction) {
      if (!isRepeat && isShuffle && direction === 1) {
        let rand;
        do { rand = Math.floor(Math.random() * songs.length); } while(rand === currentTrackIndex && songs.length > 1);
        currentTrackIndex = rand;
      } else if (!isRepeat) {
        currentTrackIndex += direction;
        if (currentTrackIndex >= songs.length) currentTrackIndex = 0;
        if (currentTrackIndex < 0) currentTrackIndex = songs.length - 1;
      }
      // リピートがON（isRepeat == true）の場合は、同じcurrentTrackIndexをそのまま再ロードする
      loadTrack(currentTrackIndex);
      if (isPlaying) playTrack();
      renderTrackList();
    }

    // スライダー操作でのシーク
    progressSlider.oninput = () => {
      audio.currentTime = progressSlider.value;
      timeCurrent.textContent = formatTime(audio.currentTime);
      syncLyrics(audio.currentTime);
    };

    // ⏱️ 自律進行タイマーシステム（等倍速駆動）
    function startTracker() {
      stopTracker();
      trackerTimerId = setInterval(() => {
        progressSlider.value = audio.currentTime;
        timeCurrent.textContent = formatTime(audio.currentTime);
        syncLyrics(audio.currentTime);

        if (audio.ended) {
          changeTrack(1);
        }
      }, 250);
    }
    function stopTracker() { if (trackerTimerId) clearInterval(trackerTimerId); }

    // 💬 歌詞の高度なスクロール＆同期
    function syncLyrics(currTime) {
      const song = songs[currentTrackIndex];
      let activeIndex = 0;
      for (let i = 0; i < song.lines.length; i++) {
        if (currTime >= song.lines[i].time) {
          activeIndex = i;
        }
      }
      document.querySelectorAll('.l-line').forEach((el, idx) => {
        if (idx === activeIndex) {
          if (!el.classList.contains('active')) {
            el.classList.add('active');
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        } else {
          el.classList.remove('active');
        }
      });
    }

    // 再生履歴解析のカウントアップ
    function incrementStats(songId) {
      let stats = safeGet(`sd_stats_${userSession}`) || {};
      stats[songId] = (stats[songId] || 0) + 1;
      safeSet(`sd_stats_${userSession}`, stats);
      renderRanking();
    }

    // リスト描画関連
    function renderTrackList() {
      trackList.innerHTML = "";
      songs.forEach((s, idx) => {
        const row = document.createElement('div');
        row.className = `track-row ${idx === currentTrackIndex ? 'active' : ''}`;
        row.onclick = () => { loadTrack(idx); playTrack(); renderTrackList(); };
        row.innerHTML = `
          <span class="t-num">${idx + 1}</span>
          <img src="${s.cover}" class="t-art">
          <div class="t-info">
            <div class="t-title">${s.title}</div>
            <div class="t-artist">${s.artist}</div>
          </div>
        `;
        trackList.appendChild(row);
      });
    }

    function renderRanking() {
      rankingList.innerHTML = "";
      let stats = safeGet(`sd_stats_${userSession}`) || {};
      const sorted = [...songs]
        .map(s => ({ ...s, count: stats[s.id] || 0 }))
        .sort((a, b) => b.count - a.count);

      sorted.forEach((s, idx) => {
        const row = document.createElement('div');
        row.className = "rank-item";
        row.innerHTML = `
          <div class="rank-num">${idx + 1}</div>
          <div class="rank-info">
            <div class="rank-title">${s.title}</div>
            <div class="rank-artist">${s.artist}</div>
          </div>
          <div class="rank-count">${s.count}回再生</div>
        `;
        rankingList.appendChild(row);
      });
    }

    // タブナビゲーション
    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.view-tab').forEach(v => v.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`tab-${tab.getAttribute('data-tab')}`).classList.add('active');
        if (tab.getAttribute('data-tab') === 'home') renderTrackList();
      };
    });

    // テーマ切替
    let darkTheme = false;
    btnTheme.onclick = () => {
      darkTheme = !darkTheme;
      document.documentElement.setAttribute('data-theme', darkTheme ? 'dark' : 'light');
      btnTheme.textContent = darkTheme ? '☀️' : '🌙';
    };

    // 管制室：パスワード・リセット処理
    btnUpdatePass.onclick = () => {
      const np = newPassInput.value.trim();
      if (np.length < 4) { alert("パスワードは4文字以上で入力してください。"); return; }
      safeSet(`sd_pass_${userSession}`, np);
      passMsg.style.display = "block";
      passMsg.textContent = "アクセスコードを更新しました。";
      newPassInput.value = "";
      setTimeout(() => passMsg.style.display = "none", 3000);
    };

    btnLogout.onclick = () => {
      safeRemove('sd_session_user'); pauseTrack();
      appWrap.style.display = 'none'; authModal.style.display = 'flex';
      authId.value = ""; authPass.value = "";
    };

    btnResetData.onclick = () => {
      if (confirm('すべての再生履歴、カスタムパスワードが完全に初期化されます。よろしいですか？')) {
        safeRemove(`sd_stats_${userSession}`); safeRemove(`sd_pass_${userSession}`);
        alert('データを初期化しました。セッションを終了します。'); btnLogout.click();
      }
    };
  </script>
</body>
</html>
