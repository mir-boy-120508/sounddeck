<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SoundDeck vb1.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* =========================================
       🎨 Apple Style: Liquid Glass Theme
       ========================================= */
    :root {
      --bg-main: #e2e8f0;
      --panel-bg: rgba(255, 255, 255, 0.75);
      --panel-border: rgba(255, 255, 255, 0.8);
      --accent-color: #ff2d55;
      --text-main: #000000;
      --text-muted: #1c1c1e;
      --text-sub: #8e8e93;
      --btn-main-bg: #1c1c1e;
      --btn-main-text: white;
      --item-hover: rgba(0, 0, 0, 0.04);
      --item-active: rgba(255, 45, 85, 0.08);
      --lyrics-dim: rgba(0, 0, 0, 0.25);
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      --glass-blur: blur(30px);
      --hotbar-height: 90px;
      --header-height: 80px;
    }
    html[data-theme="dark"] {
      --bg-main: #030712;
      --panel-bg: rgba(28, 28, 30, 0.65);
      --panel-border: rgba(255, 255, 255, 0.1);
      --accent-color: #ff2d55;
      --text-main: #ffffff;
      --text-muted: #f2f2f7;
      --text-sub: #8e8e93;
      --btn-main-bg: #ffffff;
      --btn-main-text: #000000;
      --item-hover: rgba(255, 255, 255, 0.06);
      --item-active: rgba(255, 45, 85, 0.15);
      --lyrics-dim: rgba(255, 255, 255, 0.3);
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    .bg-animate {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle at 80% 20%, rgba(255, 45, 85, 0.12), transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(0, 122, 255, 0.08), transparent 50%);
      animation: ambientBg 20s infinite alternate ease-in-out;
    }
    @keyframes ambientBg {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }

    /* 🔒 認証ゲート */
    #authModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }
    .auth-box {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 40px;
      border-radius: 28px;
      width: 90%;
      max-width: 400px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .auth-box h2 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .auth-subtitle {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 24px;
    }
    .auth-input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }
    .auth-input {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(125,125,125,0.2);
      background: rgba(125, 125, 125, 0.05);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .auth-input:focus {
      border-color: var(--accent-color);
    }
    .auth-error {
      color: var(--accent-color);
      font-size: 0.8rem;
      margin-bottom: 12px;
      min-height: 18px;
      text-align: left;
    }
    .btn-primary {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: var(--btn-main-bg);
      color: var(--btn-main-text);
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }

    /* 📱 メインアプリケーション */
    #appWrap {
      display: none;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    header {
      height: var(--header-height);
      padding: 0 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 100;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .network-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 12px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-online {
      background: rgba(52, 199, 89, 0.15);
      color: #34c759;
    }
    .badge-offline {
      background: rgba(142, 142, 147, 0.15);
      color: var(--text-sub);
    }

    .btn-theme-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--shadow);
    }

    main {
      flex: 1;
      padding: 0 40px 30px 40px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .view-tab {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      overflow-y: auto;
      animation: fadeIn 0.3s ease;
    }
    .view-tab.active {
      display: flex;
    }
    #view-playlist {
      overflow: hidden;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    /* 🏠 ホーム画面 */
    .ranking-section {
      margin-bottom: 30px;
    }
    .ranking-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .ranking-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      backdrop-filter: var(--glass-blur);
      transition: transform 0.2s, background 0.2s;
      box-shadow: var(--shadow);
      position: relative;
    }
    .ranking-card:hover {
      transform: translateY(-4px);
      background: var(--item-hover);
    }
    .rank-badge {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--accent-color);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.9rem;
      box-shadow: 0 4px 10px rgba(255,45,85,0.3);
    }
    .card-img {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      object-fit: cover;
    }
    .card-info {
      flex: 1;
      overflow: hidden;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-desc {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    /* 🔍 検索画面 */
    .search-bar-container {
      position: relative;
      max-width: 600px;
      margin-bottom: 30px;
    }
    .search-input {
      width: 100%;
      padding: 18px 20px 18px 50px;
      font-size: 1.2rem;
      border-radius: 20px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      color: var(--text-main);
      backdrop-filter: var(--glass-blur);
      box-shadow: var(--shadow);
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent-color);
    }
    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      font-size: 1.2rem;
    }

    /* 🎵 プレイリスト画面 (3カラムレイアウト) */
    .playlist-layout-v06 {
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap: 30px;
      height: 100%;
    }
    .playlist-layout-v06.lyrics-off {
      grid-template-columns: 1fr 1fr;
      max-width: 1000px;
      margin: 0 auto;
    }
    .pl-panel {
      background: var(--panel-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pl-panel-art {
      padding: 40px 30px;
      justify-content: center;
      align-items: center;
    }
    .art-mega-wrapper {
      width: 100%;
      max-width: 340px;
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      transition: transform 0.4s ease;
    }
    .playing .art-mega-wrapper {
      transform: scale(1.04);
    }
    .art-mega {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .art-info {
      text-align: center;
      margin-top: 30px;
      width: 100%;
    }
    .art-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .art-artist {
      font-size: 1.1rem;
      color: var(--accent-color);
      font-weight: 600;
    }

    .pl-panel-lyrics {
      padding: 30px;
      position: relative;
    }
    .playlist-layout-v06.lyrics-off .pl-panel-lyrics {
      display: none;
    }
    .lyrics-header-zone {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .btn-hide-lyrics {
      background: var(--item-active);
      border: none;
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lyrics-box {
      flex: 1;
      overflow-y: auto;
      padding: 50% 0;
      scroll-behavior: smooth;
      margin-right: -15px;
      padding-right: 15px;
    }
    .lyrics-box::-webkit-scrollbar {
      display: none;
    }
    .l-line {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--lyrics-dim);
      line-height: 1.6;
      margin-bottom: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      transform-origin: left center;
    }
    .l-line.active {
      color: var(--text-main);
      transform: scale(1.05);
      filter: drop-shadow(0 0 10px rgba(255,45,85,0.15));
    }

    .pl-panel-list {
      padding: 30px;
    }
    .list-header {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-sub);
      text-transform: uppercase;
    }
    .track-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      margin-top: 10px;
      margin-right: -10px;
      padding-right: 10px;
    }
    .track-list::-webkit-scrollbar {
      display: none;
    }
    .track-row {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-radius: 16px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.2s, border 0.2s;
      margin-bottom: 6px;
    }
    .track-row:hover {
      background: var(--item-hover);
      border: 1px solid rgba(125,125,125,0.1);
    }
    .track-row.active {
      background: var(--item-active);
      border: 1px solid rgba(255,45,85,0.1);
    }
    .track-row.active .t-title {
      color: var(--accent-color);
    }
    .t-num {
      width: 36px;
      color: var(--text-sub);
      font-weight: 700;
      font-size: 0.95rem;
    }
    .t-art {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      margin-right: 16px;
      object-fit: cover;
    }
    .t-info {
      flex: 1;
      overflow: hidden;
    }
    .t-title {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .t-artist {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* 👤 アカウント画面 */
    .account-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      padding: 40px;
      max-width: 600px;
      margin-bottom: 30px;
      backdrop-filter: var(--glass-blur);
      box-shadow: var(--shadow);
    }
    .acc-header {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 30px;
    }
    .acc-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid var(--accent-color);
      object-fit: cover;
    }
    .acc-name {
      font-size: 1.8rem;
      font-weight: 800;
    }
    .acc-id {
      font-size: 0.9rem;
      color: var(--text-sub);
      font-weight: 600;
    }
    .acc-edit-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 30px;
    }
    .acc-btn-group {
      display: flex;
      gap: 12px;
    }
    .acc-btn {
      padding: 12px 24px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    /* 🎛️ ボトムホットバー (固定コントロール) */
    .hotbar {
      height: var(--hotbar-height);
      width: 100%;
      background: var(--panel-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-top: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      padding: 0 40px;
      justify-content: space-between;
      position: relative;
      z-index: 100;
      flex-shrink: 0;
    }
    .hb-left {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 25%;
      min-width: 200px;
    }
    .hb-art {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      object-fit: cover;
    }
    .hb-info {
      overflow: hidden;
    }
    .hb-title {
      font-weight: 700;
      font-size: 1.05rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hb-artist {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    .hb-center {
      flex: 1;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .hb-controls {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.3rem;
      cursor: pointer;
      transition: color 0.2s;
    }
    .ctrl-btn:hover {
      color: var(--accent-color);
    }
    .ctrl-btn.active {
      color: var(--accent-color);
    }
    .btn-play {
      font-size: 2.8rem;
    }

    .hb-progress {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
    }
    .slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: rgba(125,125,125,0.2);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--text-main);
      cursor: pointer;
    }

    .hb-right {
      width: 25%;
      min-width: 280px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 24px;
    }
    .nav-tabs {
      display: flex;
      background: rgba(125,125,125,0.1);
      border-radius: 20px;
      padding: 4px;
    }
    .nav-tab {
      background: none;
      border: none;
      color: var(--text-sub);
      padding: 8px 18px;
      border-radius: 16px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-tab.active {
      background: var(--panel-bg);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .toggle-lyrics-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.2rem;
      cursor: pointer;
    }
    .toggle-lyrics-btn.active {
      color: var(--accent-color);
    }

    /* =========================================
       📱 スマートフォン・タブレット完全対応レスポンシブ
       ========================================= */
    @media (max-width: 900px) {
      header {
        height: 60px;
        padding: 0 20px;
      }
      .brand-title {
        font-size: 1.1rem;
      }
      .btn-theme-circle {
        width: 38px;
        height: 38px;
        font-size: 1rem;
      }
      main {
        padding: 15px 15px 95px 15px;
        overflow-y: auto;
      }
      .section-title {
        font-size: 1.4rem;
        margin-bottom: 16px;
      }
      .playlist-layout-v06, .playlist-layout-v06.lyrics-off {
        grid-template-columns: 1fr;
        gap: 15px;
        height: auto;
      }
      .pl-panel-art {
        padding: 20px !important;
        flex-direction: row !important;
        align-items: center !important;
        gap: 16px;
      }
      .art-mega-wrapper {
        width: 70px !important;
        height: 70px !important;
        margin: 0 !important;
        border-radius: 14px !important;
      }
      .art-info {
        text-align: left !important;
        margin-top: 0 !important;
        flex: 1;
      }
      .art-title {
        font-size: 1.2rem !important;
        margin-bottom: 2px !important;
      }
      .art-artist {
        font-size: 0.9rem !important;
      }
      .pl-panel-lyrics, .pl-panel-list {
        padding: 20px !important;
        min-height: 250px;
      }
      .lyrics-box {
        padding: 30% 0 !important;
      }
      .l-line {
        font-size: 1.15rem;
        margin-bottom: 16px;
      }
      .hotbar {
        position: fixed;
        bottom: 0;
        left: 0;
        height: 80px;
        padding: 0 16px;
        border-radius: 0;
        background: var(--panel-bg);
        border-top: 1px solid var(--panel-border);
        box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
      }
      .hb-left {
        width: auto;
        min-width: auto;
      }
      .hb-center {
        max-width: 100%;
      }
      .hb-progress {
        display: none;
      }
      .hb-controls {
        gap: 16px;
      }
      .btn-play {
        font-size: 2.3rem;
      }
      .ctrl-btn {
        font-size: 1.1rem;
      }
      .hb-right {
        width: auto;
        min-width: auto;
        gap: 12px;
      }
      .nav-tab {
        padding: 8px 12px;
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-animate"></div>

  <!-- 🔒 認証ゲート -->
  <div id="authModal">
    <div class="auth-box">
      <h2>SoundDeck</h2>
      <div class="auth-subtitle">ベータテスト版（サーバー自動同期）</div>
      <div class="auth-input-group">
        <input type="text" id="authId" class="auth-input" placeholder="ユーザーID (モニターID)" autocomplete="off">
        <input type="password" id="authPass" class="auth-input" placeholder="パスワード">
      </div>
      <div id="authError" class="auth-error"></div>
      <button id="authBtn" class="btn-primary">ログイン ＆ 曲データを同期</button>
    </div>
  </div>

  <div id="appWrap">
    <header>
      <div class="header-left">
        <div class="brand-group">
          <span class="brand-title">SoundDeck</span>
        </div>
        <div id="networkBadge" class="network-badge badge-online">
          <i class="fa-solid fa-cloud-arrow-down"></i> ON-DEVICE CACHED
        </div>
      </div>
      <button class="btn-theme-circle" id="themeToggleBtn"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
    </header>

    <main id="mainContent">
      <!-- 🏠 ホーム画面 -->
      <div id="view-home" class="view-tab active">
        <div class="ranking-section">
          <h2 class="section-title">よく聴く曲ランキング</h2>
          <div class="ranking-grid" id="rankingGrid"></div>
        </div>
        
        <div class="ranking-section" style="margin-top: 40px;">
          <h2 class="section-title">AIおすすめの曲</h2>
          <div class="ranking-grid" id="aiRecommendGrid"></div>
        </div>
      </div>

      <!-- 🔍 検索画面 -->
      <div id="view-search" class="view-tab">
        <h2 class="section-title">全文・歌詞検索</h2>
        <div class="search-bar-container">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="曲名、アーティスト、または歌詞のフレーズ...">
        </div>
        <ul class="track-list" id="searchResultList"></ul>
      </div>

      <!-- 🎵 プレイリスト画面 -->
      <div id="view-playlist" class="view-tab">
        <div class="playlist-layout-v06" id="plLayout">
          <div class="pl-panel pl-panel-art">
            <div class="art-mega-wrapper" id="artWrapper">
              <img src="" alt="Jacket" class="art-mega" id="plJacket">
            </div>
            <div class="art-info">
              <div class="art-title" id="mainTitle">No Track</div>
              <div class="art-artist" id="mainArtist">---</div>
            </div>
          </div>
          
          <div class="pl-panel pl-panel-lyrics">
            <div class="lyrics-header-zone">
              <div class="list-header">LYRICS</div>
              <button class="btn-hide-lyrics" id="btnCloseLyrics">歌詞を非表示</button>
            </div>
            <div class="lyrics-box" id="lyricsBox"></div>
          </div>
          
          <div class="pl-panel pl-panel-list">
            <div class="list-header" id="trackCountLabel">TRACKS</div>
            <ul class="track-list" id="plList"></ul>
          </div>
        </div>
      </div>

      <!-- 👤 アカウント画面 -->
      <div id="view-account" class="view-tab">
        <h2 class="section-title">マイアカウント</h2>
        <div class="account-card pl-panel">
          <div class="acc-header">
            <img src="" alt="Avatar" class="acc-avatar" id="accAvatar">
            <div>
              <div class="acc-name" id="accName">Guest User</div>
              <div class="acc-id" id="accDisplayId">Monitor ID: ---</div>
            </div>
          </div>
          
          <div class="acc-edit-group">
            <input type="text" id="editUsername" class="auth-input" placeholder="表示名の変更">
            <input type="text" id="editThemeColor" class="auth-input" placeholder="テーマカラーの変更 (例: #ff2d55)">
          </div>

          <div class="acc-btn-group">
            <button id="btnSaveProfile" class="acc-btn btn-primary" style="width: auto; padding: 12px 24px;">設定を保存</button>
            <button id="btnResetData" class="acc-btn" style="background: rgba(255,45,85,0.1); color: var(--accent-color);">再生履歴をリセット</button>
            <button id="btnLogout" class="acc-btn" style="background: var(--item-hover); color: var(--text-main);">ログアウト</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="hotbar">
      <div class="hb-left">
        <img src="" alt="Art" class="hb-art" id="hbArt">
        <div class="hb-info">
          <div class="hb-title" id="hbTitle">No Track</div>
          <div class="hb-artist" id="hbArtist">---</div>
        </div>
      </div>

      <div class="hb-center">
        <div class="hb-controls">
          <button class="ctrl-btn" id="btnShuffle"><i class="fa-solid fa-shuffle"></i></button>
          <button class="ctrl-btn" id="btnPrev"><i class="fa-solid fa-backward-step"></i></button>
          <button class="ctrl-btn btn-play" id="btnPlay"><i class="fa-solid fa-circle-play"></i></button>
          <button class="ctrl-btn" id="btnNext"><i class="fa-solid fa-forward-step"></i></button>
          <button class="ctrl-btn" id="btnRepeat"><i class="fa-solid fa-repeat"></i></button>
        </div>
        <div class="hb-progress">
          <span id="txtCur">0:00</span>
          <input type="range" class="slider" id="progress" min="0" max="100" value="0" step="0.1">
          <span id="txtDur">0:00</span>
        </div>
      </div>

      <div class="hb-right">
        <button class="toggle-lyrics-btn active" id="btnToggleLyrics"><i class="fa-solid fa-quote-left"></i></button>
        <nav class="nav-tabs">
          <button class="nav-tab active" data-target="view-home"><i class="fa-solid fa-house"></i></button>
          <button class="nav-tab" data-target="view-search"><i class="fa-solid fa-magnifying-glass"></i></button>
          <button class="nav-tab" data-target="view-playlist"><i class="fa-solid fa-music"></i></button>
          <button class="nav-tab" data-target="view-account"><i class="fa-solid fa-user"></i></button>
        </nav>
      </div>
    </footer>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    // =========================================================================
    // 🌐 管理者設定：あなたのサーバーまたはJSONホスティングのURLをここに！
    // =========================================================================
    // ※ベータ版配布時は、管理者のJSON配信サーバーのURLに書き換えてください。
    const DATA_SYNC_URL = "https://your-api-server.com/api/songs"; 

    // デフォルトの画像アセット
    const defaultCover = "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300";

    // 楽曲データ（最初は空、同期後に格納される）
    let songs = [];

    // ユーザー状態
    let currentUser = null;
    let playHistory = {}; // 端末保存の再生カウント
    let curIdx = 0, isPlay = false, isShuff = false, isRep = false, isDrag = false;
    let isFb = true, fkCur = 0, fkDur = 180, fkTimer = null, isLyOn = true;
    let countedThisTrack = false;

    // DOM要素の取得
    const audio = document.getElementById('audioPlayer');
    const authModal = document.getElementById('authModal'), authId = document.getElementById('authId'), authPass = document.getElementById('authPass'), authBtn = document.getElementById('authBtn'), authError = document.getElementById('authError');
    const appWrap = document.getElementById('appWrap'), viewTabs = document.querySelectorAll('.view-tab'), navTabs = document.querySelectorAll('.nav-tab');
    const rankingGrid = document.getElementById('rankingGrid'), aiRecommendGrid = document.getElementById('aiRecommendGrid');
    const searchInput = document.getElementById('searchInput'), searchResultList = document.getElementById('searchResultList');
    const plList = document.getElementById('plList'), plJacket = document.getElementById('plJacket');
    const mainTitle = document.getElementById('mainTitle'), mainArtist = document.getElementById('mainArtist');
    const lyricsBox = document.getElementById('lyricsBox'), plLayout = document.getElementById('plLayout');
    const hbArt = document.getElementById('hbArt'), hbTitle = document.getElementById('hbTitle'), hbArtist = document.getElementById('hbArtist');
    const btnPlay = document.getElementById('btnPlay'), btnNext = document.getElementById('btnNext'), btnPrev = document.getElementById('btnPrev'), btnShuffle = document.getElementById('btnShuffle'), btnRepeat = document.getElementById('btnRepeat');
    const progress = document.getElementById('progress'), txtCur = document.getElementById('txtCur'), txtDur = document.getElementById('txtDur');
    const btnToggleLyrics = document.getElementById('btnToggleLyrics'), btnCloseLyrics = document.getElementById('btnCloseLyrics');
    const accAvatar = document.getElementById('accAvatar'), accName = document.getElementById('accName'), accDisplayId = document.getElementById('accDisplayId');
    const networkBadge = document.getElementById('networkBadge');

    window.onload = () => {
      const savedUser = localStorage.getItem('sounddeck_current_user');
      if (savedUser) {
        loginSuccess(savedUser);
      } else {
        authModal.style.display = 'flex';
      }
    };

    // 🔒 ログインとサーバーデータ同期
    authBtn.addEventListener('click', async () => {
      const id = authId.value.trim();
      const pass = authPass.value;

      if (!id) return authError.textContent = "モニターIDを入力してください。";
      if (!pass) return authError.textContent = "パスワードを入力してください。";

      authBtn.disabled = true;
      authBtn.textContent = "接続中 ＆ 音楽同期中...";

      try {
        // --- 📥 テスト/本番用の楽曲自動フォールバック同期 ---
        let fetchedSongs = [];
        
        if (navigator.onLine) {
          try {
            // あなたの配信サーバーからデータをFetch
            const response = await fetch(`${DATA_SYNC_URL}?user=${id}&pass=${pass}`);
            if (response.ok) {
              fetchedSongs = await response.json();
            }
          } catch (e) {
            console.log("サーバーに接続できません。テスト用デフォルト曲を生成します。");
          }
        }

        // サーバーがまだ未稼働、またはオフライン時のためのテスト用デモデータ生成（10曲自動生成）
        if (!fetchedSongs || fetchedSongs.length === 0) {
          fetchedSongs = generateDemoTracks();
        }

        // 端末のLocalStorageにガチッとキャッシュ保存！
        localStorage.setItem(`sounddeck_songs_${id}`, JSON.stringify(fetchedSongs));
        loginSuccess(id);

      } catch (err) {
        authError.textContent = "同期エラーが発生しました。Wi-Fiを確認してください。";
      } finally {
        authBtn.disabled = false;
        authBtn.textContent = "ログイン ＆ 曲データを同期";
      }
    });

    function loginSuccess(id) {
      currentUser = id;
      localStorage.setItem('sounddeck_current_user', id);

      // キャッシュから同期された曲をロード
      const cachedSongs = localStorage.getItem(`sounddeck_songs_${id}`);
      if (cachedSongs) {
        songs = JSON.parse(cachedSongs);
      } else {
        songs = generateDemoTracks();
        localStorage.setItem(`sounddeck_songs_${id}`, JSON.stringify(songs));
      }

      playHistory = JSON.parse(localStorage.getItem('sounddeck_history_' + id)) || {};

      authModal.style.display = 'none';
      appWrap.style.display = 'flex';

      // ユーザー情報の反映
      accName.textContent = id;
      accDisplayId.textContent = `Monitor ID: ${id}`;
      accAvatar.src = `https://ui-avatars.com/api/?name=${id}&background=ff2d55&color=fff`;
      
      initApp();
    }

    document.getElementById('btnLogout').addEventListener('click', () => {
      localStorage.removeItem('sounddeck_current_user');
      location.reload();
    });

    // アプリ機能の初期化
    function initApp() {
      // タブ切り替え
      navTabs.forEach(btn => {
        btn.addEventListener('click', (e) => {
          navTabs.forEach(b => b.classList.remove('active'));
          viewTabs.forEach(v => v.classList.remove('active'));
          const target = e.currentTarget;
          target.classList.add('active');
          document.getElementById(target.dataset.target).classList.add('active');
          if (target.dataset.target === 'view-home') renderHome();
        });
      });

      // オンライン状態バッジの監視
      updateNetworkStatus();
      window.addEventListener('online', updateNetworkStatus);
      window.addEventListener('offline', updateNetworkStatus);

      // 検索機能
      searchInput.addEventListener('input', (e) => performSearch(e.target.value));

      // 歌詞表示トグル
      const toggleLyrics = () => {
        isLyOn = !isLyOn;
        btnToggleLyrics.classList.toggle('active', isLyOn);
        if (isLyOn) {
          plLayout.classList.remove('lyrics-off');
          setTimeout(() => syncLyrics(isFb ? fkCur : audio.currentTime), 50);
        } else {
          plLayout.classList.add('lyrics-off');
        }
      };
      btnToggleLyrics.addEventListener('click', toggleLyrics);
      btnCloseLyrics.addEventListener('click', () => { if(isLyOn) toggleLyrics(); });

      // オーディオイベントの紐付け
      audio.addEventListener('timeupdate', onTimeUpdate);
      audio.addEventListener('ended', onEnded);
      audio.addEventListener('loadedmetadata', () => {
        isFb = false;
        clearInterval(fkTimer);
        txtDur.textContent = formatTime(audio.duration);
        progress.max = audio.duration;
      });
      audio.addEventListener('error', () => { isFb = true; });

      // 各種コントロール
      btnPlay.addEventListener('click', togglePlay);
      btnNext.addEventListener('click', nextTrack);
      btnPrev.addEventListener('click', prevTrack);
      btnShuffle.addEventListener('click', () => { isShuff = !isShuff; btnShuffle.classList.toggle('active', isShuff); });
      btnRepeat.addEventListener('click', () => { isRep = !isRep; btnRepeat.classList.toggle('active', isRep); });

      progress.addEventListener('input', () => {
        isDrag = true;
        txtCur.textContent = formatTime(progress.value);
        syncLyrics(progress.value);
      });
      progress.addEventListener('change', () => {
        isDrag = false;
        if (!isFb) audio.currentTime = progress.value;
        else fkCur = parseFloat(progress.value);
      });

      // ダーク・ライトテーマ切り替え
      document.getElementById('themeToggleBtn').addEventListener('click', () => {
        const isD = document.documentElement.hasAttribute('data-theme');
        if(isD) {
          document.documentElement.removeAttribute('data-theme');
          document.getElementById('themeIcon').className = "fa-solid fa-moon";
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.getElementById('themeIcon').className = "fa-solid fa-sun";
        }
      });

      // プロフィール編集の保存
      document.getElementById('btnSaveProfile').addEventListener('click', () => {
        const newName = document.getElementById('editUsername').value.trim();
        const customColor = document.getElementById('editThemeColor').value.trim();
        
        if (newName) {
          accName.textContent = newName;
          localStorage.setItem(`sounddeck_username_${currentUser}`, newName);
        }
        if (customColor && customColor.startsWith('#')) {
          document.documentElement.style.setProperty('--accent-color', customColor);
          localStorage.setItem(`sounddeck_accent_${currentUser}`, customColor);
        }
      });

      // 再生履歴リセット
      document.getElementById('btnResetData').addEventListener('click', () => {
        if(confirm("再生履歴とランキングを完全にリセットしますか？")) {
          playHistory = {};
          localStorage.setItem('sounddeck_history_' + currentUser, JSON.stringify(playHistory));
          renderHome();
        }
      });

      // カスタム表示名の呼び出し
      const savedName = localStorage.getItem(`sounddeck_username_${currentUser}`);
      if (savedName) accName.textContent = savedName;
      const savedAccent = localStorage.getItem(`sounddeck_accent_${currentUser}`);
      if (savedAccent) document.documentElement.style.setProperty('--accent-color', savedAccent);

      buildPlaylist();
      renderHome();
      loadTrack(0);
    }

    // ネットワーク状態の更新
    function updateNetworkStatus() {
      if (navigator.onLine) {
        networkBadge.className = "network-badge badge-online";
        networkBadge.innerHTML = `<i class="fa-solid fa-wifi"></i> ONLINE SYNCED`;
      } else {
        networkBadge.className = "network-badge badge-offline";
        networkBadge.innerHTML = `<i class="fa-solid fa-plane"></i> OFFLINE MODE`;
      }
    }

    // 🏠 ホーム画面の生成
    function renderHome() {
      rankingGrid.innerHTML = '';
      
      // 1. 再生ランキング上位3曲
      let sorted = Object.keys(playHistory)
        .map(id => ({ id: parseInt(id), count: playHistory[id] }))
        .sort((a,b) => b.count - a.count)
        .slice(0, 3);

      if (sorted.length === 0) {
        rankingGrid.innerHTML = '<p style="color:var(--text-sub); grid-column: 1/-1;">まだ曲を再生していません。プレイリストから再生してみましょう！</p>';
      } else {
        sorted.forEach((item, index) => {
          const s = songs.find(track => track.id === item.id);
          if (s) {
            const card = document.createElement('div');
            card.className = 'ranking-card';
            card.innerHTML = `
              <div class="rank-badge">${index+1}</div>
              <img src="${s.cover}" class="card-img" onerror="this.src='${defaultCover}'">
              <div class="card-info">
                <div class="card-title">${s.title}</div>
                <div class="card-desc">${s.artist} (${item.count}回再生)</div>
              </div>
            `;
            card.onclick = () => selectTrack(songs.indexOf(s));
            rankingGrid.appendChild(card);
          }
        });
      }

      // 2. AIおすすめ（Wi-Fi接続時は上位曲の傾向、オフライン時はメッセージ表示）
      aiRecommendGrid.innerHTML = '';
      if (!navigator.onLine) {
        aiRecommendGrid.innerHTML = '<p style="color:var(--text-sub); grid-column: 1/-1;"><i class="fa-solid fa-triangle-exclamation"></i> オンライン（Wi-Fi接続）になるとAIの提案が表示されます</p>';
      } else {
        // デモおすすめ曲（まだ再生していない中からランダムで提案）
        const playedIds = Object.keys(playHistory).map(id => parseInt(id));
        const unplayed = songs.filter(s => !playedIds.includes(s.id));
        const recommended = unplayed.length > 0 ? unplayed.slice(0, 3) : songs.slice(0, 3);
        
        recommended.forEach(s => {
          const card = document.createElement('div');
          card.className = 'ranking-card';
          card.innerHTML = `
            <img src="${s.cover}" class="card-img" onerror="this.src='${defaultCover}'">
            <div class="card-info">
              <div class="card-title">${s.title}</div>
              <div class="card-desc">${s.artist}</div>
            </div>
          `;
          card.onclick = () => selectTrack(songs.indexOf(s));
          aiRecommendGrid.appendChild(card);
        });
      }
    }

    // 🔍 検索（曲名・アーティスト・歌詞全文検索）
    function performSearch(query) {
      const q = query.toLowerCase();
      searchResultList.innerHTML = '';
      if (!q) return;

      const hits = songs.filter(s => {
        const lyricText = s.lines ? s.lines.map(l => l.text).join(' ').toLowerCase() : '';
        return s.title.toLowerCase().includes(q) || 
               s.artist.toLowerCase().includes(q) || 
               lyricText.includes(q);
      });

      if (hits.length === 0) {
        searchResultList.innerHTML = '<li style="padding:16px; color:var(--text-sub);">一致する楽曲、または歌詞が見つかりません。</li>';
        return;
      }

      hits.forEach(s => {
        const li = document.createElement('li');
        li.className = 'track-row';
        li.innerHTML = `
          <img src="${s.cover}" class="t-art" onerror="this.src='${defaultCover}'">
          <div class="t-info">
            <div class="t-title">${s.title}</div>
            <div class="t-artist">${s.artist}</div>
          </div>
        `;
        li.onclick = () => selectTrack(songs.indexOf(s));
        searchResultList.appendChild(li);
      });
    }

    // 🎵 プレイリスト構築（最大30曲に対応）
    function buildPlaylist() {
      plList.innerHTML = '';
      document.getElementById('trackCountLabel').textContent = `TRACKS (${songs.length} / 30)`;

      songs.forEach((s, i) => {
        const li = document.createElement('li');
        li.className = `track-row ${i === curIdx ? 'active' : ''}`;
        li.innerHTML = `
          <div class="t-num">${i + 1}</div>
          <img src="${s.cover}" class="t-art" onerror="this.src='${defaultCover}'">
          <div class="t-info">
            <div class="t-title">${s.title}</div>
            <div class="t-artist">${s.artist}</div>
          </div>
        `;
        li.onclick = () => selectTrack(i);
        plList.appendChild(li);
      });
    }

    // トラックロード
    function loadTrack(idx) {
      pauseTrack();
      curIdx = idx;
      const trk = songs[idx];
      countedThisTrack = false; // 再生回数のカウントフラグをリセット

      audio.src = trk.src || "";
      audio.load();

      // UI更新
      hbTitle.textContent = trk.title;
      hbArtist.textContent = trk.artist;
      mainTitle.textContent = trk.title;
      mainArtist.textContent = trk.artist;

      plJacket.onerror = function() { this.src = defaultCover; };
      hbArt.onerror = function() { this.src = defaultCover; };
      plJacket.src = trk.cover || defaultCover;
      hbArt.src = trk.cover || defaultCover;

      document.querySelectorAll('#plList .track-row').forEach((el, i) => {
        el.classList.toggle('active', i === curIdx);
      });

      // 曲が再生できない（空の）場合の仮時間
      fkDur = (trk.lines && trk.lines.length) ? trk.lines[trk.lines.length - 1].time + 8 : 180;
      isFb = !trk.src || trk.src === "";
      
      progress.max = isFb ? fkDur : (audio.duration || 100);
      progress.value = 0;
      fkCur = 0;
      txtCur.textContent = "0:00";
      txtDur.textContent = formatTime(isFb ? fkDur : audio.duration || 180);

      buildLyrics(trk);
      syncLyrics(0);

      // iOSのロックスクリーン連携 (Media Session API)
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: trk.title,
          artist: trk.artist,
          artwork: [{ src: trk.cover || defaultCover, sizes: '512x512', type: 'image/png' }]
        });
      }
    }

    function selectTrack(idx) {
      loadTrack(idx);
      playTrack();
    }

    function togglePlay() {
      isPlay ? pauseTrack() : playTrack();
    }

    function playTrack() {
      isPlay = true;
      btnPlay.innerHTML = '<i class="fa-solid fa-circle-pause"></i>';
      document.getElementById('artWrapper').parentElement.classList.add('playing');

      if (!isFb) {
        audio.play().catch(() => {
          // メディアエラーがあった場合は自動的にデモプレイヤー(擬似再生)にフォールバック
          startFakePlayback();
        });
      } else {
        startFakePlayback();
      }
    }

    function startFakePlayback() {
      isFb = true;
      clearInterval(fkTimer);
      let st = Date.now() - (fkCur * 1000);
      fkTimer = setInterval(() => {
        if (!isDrag) {
          fkCur = (Date.now() - st) / 1000;
          if (fkCur >= fkDur) {
            isRep ? (fkCur = 0, st = Date.now()) : (pauseTrack(), nextTrack());
            return;
          }
          progress.value = fkCur;
          txtCur.textContent = formatTime(fkCur);
          syncLyrics(fkCur);
          checkPlayCount(fkCur, fkDur);
        } else {
          st = Date.now() - (fkCur * 1000);
        }
      }, 100);
    }

    function pauseTrack() {
      isPlay = false;
      btnPlay.innerHTML = '<i class="fa-solid fa-circle-play"></i>';
      document.getElementById('artWrapper').parentElement.classList.remove('playing');
      audio.pause();
      clearInterval(fkTimer);
    }

    function nextTrack() {
      curIdx = isShuff ? Math.floor(Math.random() * songs.length) : (curIdx + 1) % songs.length;
      loadTrack(curIdx);
      playTrack();
    }

    function prevTrack() {
      curIdx = (curIdx - 1 + songs.length) % songs.length;
      loadTrack(curIdx);
      playTrack();
    }

    function onEnded() {
      isRep ? (audio.currentTime = 0, playTrack()) : nextTrack();
    }

    function onTimeUpdate() {
      if (!isDrag && !isFb) {
        progress.value = audio.currentTime;
        txtCur.textContent = formatTime(audio.currentTime);
        syncLyrics(audio.currentTime);
        checkPlayCount(audio.currentTime, audio.duration);
      }
    }

    // 🎵 再生カウント判定：曲の終わり10秒前まで聴いたらカウントアップ！
    function checkPlayCount(current, duration) {
      if (!countedThisTrack && duration > 20 && current >= (duration - 10)) {
        countedThisTrack = true;
        const tid = songs[curIdx].id;
        playHistory[tid] = (playHistory[tid] || 0) + 1;
        localStorage.setItem('sounddeck_history_' + currentUser, JSON.stringify(playHistory));
        if (document.getElementById('view-home').classList.contains('active')) renderHome();
      }
    }

    // 歌詞表示のビルド
    function buildLyrics(song) {
      lyricsBox.innerHTML = '';
      if (!song.lines || song.lines.length === 0) {
        return lyricsBox.innerHTML = '<div class="l-line">歌詞情報はありません</div>';
      }
      song.lines.forEach(l => {
        const d = document.createElement('div');
        d.className = 'l-line';
        d.textContent = l.text;
        d.onclick = () => {
          if (isFb) fkCur = l.time;
          else audio.currentTime = l.time;
        };
        lyricsBox.appendChild(d);
      });
    }

    // 歌詞の滑らかなスクロール連動
    function syncLyrics(time) {
      if (!isLyOn) return;
      const s = songs[curIdx];
      if (!s || !s.lines) return;

      let aIdx = -1;
      for (let i = 0; i < s.lines.length; i++) {
        if (time >= s.lines[i].time) aIdx = i;
        else break;
      }

      const els = lyricsBox.querySelectorAll('.l-line');
      els.forEach((el, i) => {
        if (i === aIdx) {
          if (!el.classList.contains('active')) {
            el.classList.add('active');
            lyricsBox.scrollTo({
              top: el.offsetTop - (lyricsBox.clientHeight / 2) + (el.clientHeight / 2),
              behavior: 'smooth'
            });
          }
        } else {
          el.classList.remove('active');
        }
      });
    }

    function formatTime(s) {
      if (isNaN(s)) return "0:00";
      const m = Math.floor(s / 60), sc = Math.floor(s % 60);
      return `${m}:${sc < 10 ? '0' : ''}${sc}`;
    }
