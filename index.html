<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SoundDeck v1.0 (Private)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SoundDeck">

  <style>
    /* =========================================
       🎨 Apple Style: Liquid Glass Theme
       ========================================= */
    :root {
      --bg-main: #e2e8f0; 
      --panel-bg: rgba(255, 255, 255, 0.75);
      --panel-border: rgba(255, 255, 255, 0.8);
      --accent-color: #ff2d55;
      --text-main: #000000;
      --text-muted: #1c1c1e;
      --text-sub: #8e8e93;
      --btn-main-bg: #1c1c1e;
      --btn-main-text: white;
      --item-hover: rgba(0, 0, 0, 0.04);
      --item-active: rgba(255, 45, 85, 0.08);
      --lyrics-dim: rgba(0, 0, 0, 0.25);
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      --glass-blur: blur(30px);
      --hotbar-height: 90px;
      --header-height: 80px;
    }

    html[data-theme="dark"] {
      --bg-main: #030712;
      --panel-bg: rgba(28, 28, 30, 0.65);
      --panel-border: rgba(255, 255, 255, 0.1);
      --accent-color: #ff2d55;
      --text-main: #ffffff;
      --text-muted: #f2f2f7;
      --text-sub: #8e8e93;
      --btn-main-bg: #ffffff;
      --btn-main-text: #000000;
      --item-hover: rgba(255, 255, 255, 0.06);
      --item-active: rgba(255, 45, 85, 0.15);
      --lyrics-dim: rgba(255, 255, 255, 0.3);
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box;
        font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .bg-animate {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
      background: radial-gradient(circle at 80% 20%, rgba(255, 45, 85, 0.12), transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(0, 122, 255, 0.08), transparent 50%);
      animation: ambientBg 20s infinite alternate ease-in-out;
    }
    @keyframes ambientBg { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

    /* =========================================
       🛡️ Auth Modal
       ========================================= */
    .auth-modal {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    .auth-card {
      background: var(--panel-bg); border: 1px solid var(--panel-border);
      box-shadow: var(--shadow); border-radius: 24px; padding: 32px; width: 90%; max-width: 400px;
      text-align: center; backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    }
    .auth-logo { font-size: 48px; margin-bottom: 16px; }
    .auth-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .auth-subtitle { font-size: 14px; color: var(--text-sub); margin-bottom: 24px; }
    .auth-input {
      width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1);
      margin-bottom: 12px; font-size: 16px; background: rgba(255,255,255,0.5); text-align: center;
    }
    html[data-theme="dark"] .auth-input {
      border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white;
    }
    .btn-login {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: var(--btn-main-bg); color: var(--btn-main-text); font-size: 16px; font-weight: 600;
      cursor: pointer; transition: transform 0.2s;
    }
    .btn-login:active { transform: scale(0.98); }
    .auth-error { color: var(--accent-color); font-size: 13px; margin-top: 12px; font-weight: 500; }

    /* =========================================
       📱 App Layout
       ========================================= */
    .app-wrap { display: flex; flex-direction: column; height: 100vh; width: 100%; }
    
    header {
      height: var(--header-height); width: 100%; display: flex; align-items: center;
      justify-content: space-between; padding: 0 24px; z-index: 100; position: relative;
    }
    .header-left h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
    
    /* 📶 オフラインステータスバッジ */
    .offline-badge {
      display: none; background: rgba(255, 45, 85, 0.15); color: var(--accent-color);
      padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
      border: 1px solid rgba(255, 45, 85, 0.25); align-items: center; gap: 4px;
    }
    
    .header-right { display: flex; align-items: center; gap: 12px; }
    .btn-icon-nav {
      background: none; border: none; font-size: 20px; color: var(--text-main);
      cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    }

    main { flex: 1; width: 100%; overflow: hidden; position: relative; }
    .view-tab { display: none; width: 100%; height: 100%; padding: 0 24px; flex-direction: column; }
    .view-tab.active { display: flex; }

    /* =========================================
       🎼 Home View (2 Column Layout)
       ========================================= */
    .split-layout { display: flex; gap: 24px; height: calc(100vh - var(--header-height) - var(--hotbar-height) - 20px); width: 100%; }
    .layout-left { flex: 1.2; display: flex; flex-direction: column; height: 100%; }
    .layout-right { flex: 1.8; display: flex; flex-direction: column; height: 100%; }

    .section-title { font-size: 15px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    
    .pl-panel {
      background: var(--panel-bg); border: 1px solid var(--panel-border); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--shadow); border-radius: 24px; flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }
    .scroll-box { flex: 1; overflow-y: auto; padding: 12px; }

    /* List Cards */
    .card {
      display: flex; align-items: center; padding: 12px; border-radius: 16px; margin-bottom: 8px;
      cursor: pointer; transition: background 0.2s, transform 0.2s;
    }
    .card:hover { background: var(--item-hover); }
    .card.active { background: var(--item-active); border-left: 4px solid var(--accent-color); padding-left: 8px; }
    .card-art { width: 48px; height: 48px; border-radius: 10px; background: #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 14px; overflow: hidden; }
    .card-art img { width: 100%; height: 100%; object-fit: cover; }
    html[data-theme="dark"] .card-art { background: #3a3a3c; }
    .card-info { flex: 1; min-width: 0; }
    .card-title { font-size: 15px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-artist { font-size: 13px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    /* Lyrics Display */
    .lyrics-container { display: flex; flex-direction: column; height: 100%; padding: 10px 0; }
    .lyrics-window {
      flex: 1; overflow-y: auto; padding: 40px 20px; text-align: center;
      mask-image: linear-gradient(to bottom, transparent 0%, white 15%, white 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, white 15%, white 85%, transparent 100%);
    }
    .lyrics-list { list-style: none; display: flex; flex-direction: column; gap: 28px; padding: 60px 0; }
    .lyrics-item {
      font-size: 22px; font-weight: 700; color: var(--lyrics-dim); line-height: 1.4;
      transition: color 0.3s, transform 0.3s, filter 0.3s; transform: scale(0.95); filter: blur(0.5px);
    }
    .lyrics-item.active { color: var(--text-main); transform: scale(1.05); font-weight: 800; filter: blur(0px); }

    /* =========================================
       📊 Analytics & Settings Views
       ========================================= */
    .rank-item {
      display: flex; align-items: center; padding: 14px 16px; background: var(--panel-bg);
      border: 1px solid var(--panel-border); box-shadow: var(--shadow); border-radius: 16px; margin-bottom: 10px;
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    }
    .rank-num { font-size: 18px; font-weight: 800; color: var(--accent-color); width: 36px; }
    .rank-info { flex: 1; }
    .rank-title { font-size: 15px; font-weight: 600; }
    .rank-artist { font-size: 13px; color: var(--text-sub); margin-top: 1px; }
    .rank-count { font-size: 13px; font-weight: 700; color: var(--text-main); background: rgba(0,0,0,0.05); padding: 4px 10px; border-radius: 10px; }
    html[data-theme="dark"] .rank-count { background: rgba(255,255,255,0.1); }

    .setting-group {
      background: var(--panel-bg); border: 1px solid var(--panel-border); box-shadow: var(--shadow);
      border-radius: 20px; padding: 20px; margin-bottom: 16px; backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    }
    .setting-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .setting-row:last-child { margin-bottom: 0; }
    .setting-label { font-size: 15px; font-weight: 600; }
    .setting-desc { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
    .btn-danger { background: rgba(255,45,85,0.1); color: var(--accent-color); border: 1px solid rgba(255,45,85,0.2); padding: 10px 16px; border-radius: 12px; font-weight: 600; cursor: pointer; }
    .btn-danger:active { background: rgba(255,45,85,0.2); }

    /* =========================================
       🎛️ Bottom Deck Hotbar (Music Controls)
       ========================================= */
    .hotbar {
      height: var(--hotbar-height); width: calc(100% - 48px); margin: 0 auto 16px auto;
      background: var(--panel-bg); border: 1px solid var(--panel-border); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--shadow); border-radius: 24px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 1000;
    }
    .hb-left { display: flex; align-items: center; width: 25%; min-width: 150px; }
    .hb-meta { min-width: 0; margin-left: 12px; }
    .hb-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hb-artist { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

    .hb-center { display: flex; flex-direction: column; align-items: center; flex: 1; max-width: 500px; padding: 0 16px; }
    .controls { display: flex; align-items: center; gap: 24px; margin-bottom: 6px; }
    .btn-ctrl { background: none; border: none; color: var(--text-main); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; transition: color 0.2s, opacity 0.2s; }
    .btn-ctrl:active { opacity: 0.6; }
    .btn-ctrl.primary { font-size: 24px; background: var(--text-main); color: var(--bg-main); width: 44px; height: 44px; border-radius: 50%; }
    
    /* リピート＆シャッフル用スタイル */
    .btn-ctrl.toggle { color: var(--text-sub); font-size: 14px; position: relative; }
    .btn-ctrl.toggle.active { color: var(--accent-color); }
    .btn-ctrl.toggle.active::after {
      content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px; background: var(--accent-color); border-radius: 50%;
    }

    .timeline { width: 100%; display: flex; align-items: center; gap: 10px; }
    .time-lbl { font-size: 11px; color: var(--text-sub); font-weight: 600; width: 32px; }
    .time-lbl.end { text-align: right; }
    .progress-bar { flex: 1; height: 5px; border-radius: 3px; background: rgba(0,0,0,0.08); appearance: none; outline: none; cursor: pointer; }
    html[data-theme="dark"] .progress-bar { background: rgba(255,255,255,0.15); }
    .progress-bar::-webkit-slider-thumb { appearance: none; width: 0; height: 0; border-radius: 50%; background: var(--accent-color); transition: width 0.1s, height 0.1s; }
    .progress-bar:hover::-webkit-slider-thumb { width: 12px; height: 12px; }

    .hb-right { display: flex; align-items: center; justify-content: flex-end; width: 25%; gap: 8px; }

    /* =========================================
       🗺️ Bottom Navigation Tabs
       ========================================= */
    .nav-tabs { display: flex; background: rgba(0,0,0,0.03); padding: 4px; border-radius: 14px; gap: 4px; }
    html[data-theme="dark"] .nav-tabs { background: rgba(255,255,255,0.05); }
    .nav-tab { padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--text-sub); cursor: pointer; transition: background 0.2s, color 0.2s; }
    .nav-tab.active { background: var(--panel-bg); color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  </style>
</head>
<body>

  <div class="bg-animate"></div>

  <div class="auth-modal" id="authModal">
    <div class="auth-card">
      <div class="auth-logo">🛸</div>
      <div class="auth-title">SoundDeck System</div>
      <div class="auth-subtitle">認証資格情報を入力してください</div>
      <input type="text" class="auth-input" id="authId" placeholder="ユーザーID" autocomplete="off">
      <input type="password" class="auth-input" id="authPass" placeholder="アクセスコード">
      <button class="btn-login" id="btnLogin">システムログイン</button>
      <div class="auth-error" id="loginError"></div>
    </div>
  </div>

  <div class="app-wrap" id="appWrap" style="display: none;">
    <header>
      <div class="header-left">
        <h1>SoundDeck <span class="offline-badge" id="offlineBadge">⚠️ OFFLINE</span></h1>
      </div>
      <div class="header-right">
        <div class="nav-tabs">
          <div class="nav-tab active" data-tab="home">プレイヤー</div>
          <div class="nav-tab" data-tab="analytics">解析録</div>
          <div class="nav-tab" data-tab="settings">管制室</div>
        </div>
        <button class="btn-icon-nav" id="btnTheme">☀️</button>
      </div>
    </header>

    <main>
      <div class="view-tab active" id="tab-home">
        <div class="split-layout">
          <div class="layout-left">
            <div class="section-title">プレイリスト</div>
            <div class="pl-panel">
              <div class="scroll-box" id="homeTrackList"></div>
            </div>
          </div>
          <div class="layout-right">
            <div class="section-title">同期リリックデータ</div>
            <div class="pl-panel">
              <div class="lyrics-container">
                <div class="lyrics-window" id="lyricsWindow">
                  <ul class="lyrics-list" id="lyricsList"></ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="view-tab" id="tab-analytics">
        <div class="section-title">高頻度再生トラックランキング</div>
        <div style="flex:1; overflow-y:auto;" id="rankingList"></div>
      </div>

      <div class="view-tab" id="tab-settings">
        <div class="section-title">システム環境設定</div>
        
        <div class="setting-group">
          <h3 style="font-size:16px; margin-bottom:12px;">セキュリティ設定</h3>
          <div class="setting-row">
            <div>
              <div class="setting-label">アクセスコードの変更</div>
              <div class="setting-desc">次回のセッションログイン時から有効になります</div>
            </div>
            <div style="display:flex; gap:8px;">
              <input type="password" id="newPassInput" placeholder="新しいコード" class="auth-input" style="margin-bottom:0; width:150px; padding:8px 12px; font-size:14px;">
              <button class="btn-login" id="btnUpdatePass" style="width:auto; padding:8px 16px; font-size:14px;">更新</button>
            </div>
          </div>
          <div id="passMsg" style="font-size:13px; font-weight:600; margin-top:10px; display:none;"></div>
        </div>

        <div class="setting-group">
          <h3 style="font-size:16px; margin-bottom:12px; color:var(--accent-color);">システムメンテナンス</h3>
          <div class="setting-row">
            <div>
              <div class="setting-label">ローカルストレージのパージ</div>
              <div class="setting-desc">再生履歴、カスタムパスワード等のローカルキャッシュを完全に削除します</div>
            </div>
            <button class="btn-danger" id="btnResetData">ストレージ初期化</button>
          </div>
        </div>

        <div class="setting-group" style="text-align: center; background: none; border: none; box-shadow: none;">
          <button class="btn-danger" id="btnLogout" style="background:rgba(0,0,0,0.05); color:var(--text-main); border:1px solid rgba(0,0,0,0.1); width:200px;">セッションを終了</button>
        </div>
      </div>
    </main>

    <div class="hotbar">
      <div class="hb-left">
        <div class="card-art" id="hbArt">🎵</div>
        <div class="hb-meta">
          <div class="hb-title" id="trackTitle">---</div>
          <div class="hb-artist" id="trackArtist">---</div>
        </div>
      </div>

      <div class="hb-center">
        <div class="controls">
          <button class="btn-ctrl toggle" id="btnShuffle" title="シャッフル再生"><i class="fa-solid fa-shuffle"></i></button>
          <button class="btn-ctrl" id="btnPrev"><i class="fa-solid fa-backward-step"></i></button>
          <button class="btn-ctrl primary" id="btnPlay"><i class="fa-solid fa-play"></i></button>
          <button class="btn-ctrl" id="btnNext"><i class="fa-solid fa-forward-step"></i></button>
          <button class="btn-ctrl toggle" id="btnRepeat" title="リピート再生"><i class="fa-solid fa-repeat"></i></button>
        </div>
        <div class="timeline">
          <div class="time-lbl" id="timeCurrent">0:00</div>
          <input type="range" class="progress-bar" id="progress" min="0" max="100" value="0">
          <div class="time-lbl end" id="timeTotal">0:00</div>
        </div>
      </div>

      <div class="hb-right">
        </div>
    </div>
  </div>

  <script>
    // 元ファイルに記述されていた正しい10曲のデータをそのまま引き継ぎ
    const tracks = [
      { id: "tr01", title: "プロローグ: 終わりの始まり", artist: "SoundDeck Core", album: "System Soundtracks", duration: 124, file: "song1.mp3", jacket: "jacket1.png" },
      { id: "tr02", title: "真夜中のゲートキーパー", artist: "Cyber Security Team", album: "Security Protocol", duration: 185, file: "song2.mp3", jacket: "jacket2.png" },
      { id: "tr03", title: "暗号化された約束", artist: "Crypto Walker", album: "Web3 Nostalgia", duration: 210, file: "song3.mp3", jacket: "jacket3.png" },
      { id: "tr04", title: "セッション・タイムアウト", artist: "Token Expired", album: "State Management", duration: 142, file: "song4.mp3", jacket: "jacket4.png" },
      { id: "tr05", title: "ローカルストレージの追憶", artist: "Cache Memory", album: "Persistent Data", duration: 198, file: "song5.mp3", jacket: "jacket5.png" },
      { id: "tr06", title: "サービスワーカーの遁走曲", artist: "Offline Worker", album: "PWA Masterpiece", duration: 245, file: "song6.mp3", jacket: "jacket6.png" },
      { id: "tr07", title: "同期バグの鎮魂歌", artist: "Asynchronous", album: "Race Condition", duration: 167, file: "song7.mp3", jacket: "jacket7.png" },
      { id: "tr08", title: "リファクタリング・ハイ", artist: "Clean Code", album: "Production Ready", duration: 312, file: "song8.mp3", jacket: "jacket8.png" },
      { id: "tr09", title: "ダークモードの深淵", artist: "CSS Variables", album: "Liquid Glass UI", duration: 222, file: "song9.mp3", jacket: "jacket9.png" },
      { id: "tr10", title: "エピローグ: 次のセッションへ", artist: "SoundDeck Core", album: "System Soundtracks", duration: 155, file: "song10.mp3", jacket: "jacket10.png" }
    ];

    // ダミー歌詞生成システム
    function getLyricsForTrack(title) {
      return [
        { time: 0, text: `（♪ ${title} - イントロダクション）` },
        { time: 10, text: "静かに始まる旋律が 部屋の空気を満たしていく" },
        { time: 25, text: "目を閉じれば浮かび上がる あの日の記憶と遠い約束" },
        { time: 40, text: "加速する時間の波に 僕らは流されてしまわないように" },
        { time: 55, text: "（♪ メインサビ - 感情のクレッシェンド）" },
        { time: 56, text: "どこまでも響けこのメロディ 君の心へと届くまで" },
        { time: 75, text: "失った季節の欠片を数えても 光は前を向いている" },
        { time: 95, text: "（♪ インタールード - 間奏セクション）" },
        { time: 115, text: "街のノイズが遠ざかる 二人だけの周波数を合わせて" },
        { time: 135, text: "間違いだらけの地図でも 歩んだ足跡は嘘をつかない" },
        { time: 155, text: "（♪ ラストサビ - 最高潮のアンサンブル）" },
        { time: 156, text: "どこまでも響けこのメロディ 君の心へと届くまで" },
        { time: 180, text: "（♪ アウトロ - 静かな余韻とともにフェードアウト）" },
        { time: 190, text: "（楽曲終了）" }
      ];
    }

    let userSession = "default_user";
    let currentTrackIndex = 0;
    let isPlaying = false;
    
    let isShuffle = false;
    let isRepeat = false; 

    let fkCur = 0; 
    let fkTimerId = null;
    const audio = new Audio();
    audio.loop = true;

    // DOM要素
    const appWrap = document.getElementById('appWrap');
    const authModal = document.getElementById('authModal');
    const authId = document.getElementById('authId');
    const authPass = document.getElementById('authPass');
    const btnLogin = document.getElementById('btnLogin');
    const loginError = document.getElementById('loginError');

    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const hbArt = document.getElementById('hbArt');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeTotal = document.getElementById('timeTotal');
    const progress = document.getElementById('progress');
    const btnPlay = document.getElementById('btnPlay');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnShuffle = document.getElementById('btnShuffle');
    const btnRepeat = document.getElementById('btnRepeat');
    const lyricsList = document.getElementById('lyricsList');
    const offlineBadge = document.getElementById('offlineBadge');

    const btnTheme = document.getElementById('btnTheme');
    const btnLogout = document.getElementById('btnLogout');
    const btnUpdatePass = document.getElementById('btnUpdatePass');
    const btnResetData = document.getElementById('btnResetData');
    const newPassInput = document.getElementById('newPassInput');
    const passMsg = document.getElementById('passMsg');

    function safeGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
    function safeSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
    function safeRemove(k) { try { localStorage.removeItem(k); } catch(e) {} }

    // 📡 ネットワーク検知
    function updateOnlineStatus() {
      if (navigator.onLine) {
        offlineBadge.style.display = 'none';
      } else {
        offlineBadge.style.display = 'inline-flex';
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    window.addEventListener('DOMContentLoaded', () => {
      updateOnlineStatus();
      const savedUser = safeGet('sd_session_user');
      if (savedUser) {
        userSession = savedUser;
        showApp();
      } else {
        authModal.style.display = 'flex';
        appWrap.style.display = 'none';
      }
    });

    btnLogin.onclick = () => {
      const id = authId.value.trim();
      const ps = authPass.value.trim();
      if(!id || !ps) { loginError.textContent = "IDとパスワードを入力してください。"; return; }
      
      const customPass = safeGet(`sd_pass_${id}`);
      if ((customPass && ps === customPass) || (!customPass && ps === "0000")) {
        userSession = id;
        safeSet('sd_session_user', id);
        loginError.textContent = "";
        showApp();
      } else {
        loginError.textContent = "認証情報が正しくありません。";
      }
    };

    function showApp() {
      authModal.style.display = 'none';
      appWrap.style.display = 'flex';
      initPlayer();
    }

    function initPlayer() {
      loadTrack(currentTrackIndex);
      renderHome();
      renderRanking();
    }

    btnTheme.onclick = () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nextTheme);
      btnTheme.innerHTML = nextTheme === 'dark' ? '☀️' : '🌙';
    };

    document.querySelectorAll('.nav-tabs .nav-tab').forEach(item => {
      item.onclick = () => {
        document.querySelectorAll('.nav-tabs .nav-tab').forEach(i => i.classList.remove('active'));
        document.querySelectorAll('.view-tab').forEach(v => v.classList.remove('active'));
        item.classList.add('active');
        const target = `tab-${item.getAttribute('data-tab')}`;
        document.getElementById(target).classList.add('active');
        if(item.getAttribute('data-tab') === 'home') renderHome();
      };
    });

    function loadTrack(index) {
      currentTrackIndex = index;
      const track = tracks[index];
      trackTitle.textContent = track.title;
      trackArtist.textContent = track.artist;
      timeTotal.textContent = formatTime(track.duration);
      progress.max = track.duration;
      progress.value = 0;
      fkCur = 0;
      timeCurrent.textContent = "0:00";
      
      hbArt.innerHTML = `<img src="${track.jacket}" alt="jacket" onerror="this.parentNode.innerHTML='🎵'">`;

      audio.src = track.file;
      audio.load();

      const lyricsData = getLyricsForTrack(track.title);
      lyricsList.innerHTML = "";
      lyricsData.forEach((l, i) => {
        const li = document.createElement('li');
        li.className = `lyrics-item ${i === 0 ? 'active' : ''}`;
        li.id = `lyric-${i}`;
        li.textContent = l.text;
        lyricsList.appendChild(li);
      });
      document.getElementById('lyricsWindow').scrollTop = 0;
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    btnPlay.onclick = () => { if(isPlaying) { pauseTrack(); } else { playTrack(); } };
    btnPrev.onclick = () => { prevTrack(); };
    btnNext.onclick = () => { nextTrack(); };

    btnShuffle.onclick = () => {
      isShuffle = !isShuffle;
      btnShuffle.classList.toggle('active', isShuffle);
    };

    btnRepeat.onclick = () => {
      isRepeat = !isRepeat;
      btnRepeat.classList.toggle('active', isRepeat);
    };

    function playTrack() {
      isPlaying = true;
      btnPlay.innerHTML = '<i class="fa-solid fa-pause"></i>';
      audio.play().catch(() => {});
      startEngineTimer();
      incrementStats(tracks[currentTrackIndex].id);
    }

    function pauseTrack() {
      isPlaying = false;
      btnPlay.innerHTML = '<i class="fa-solid fa-play"></i>';
      audio.pause();
      stopEngineTimer();
    }

    function prevTrack() {
      let idx = currentTrackIndex - 1;
      if(idx < 0) idx = tracks.length - 1;
      loadTrack(idx);
      if(isPlaying) playTrack();
      renderHome();
    }

    function nextTrack() {
      if (isRepeat) {
        loadTrack(currentTrackIndex);
        if(isPlaying) playTrack();
        return;
      }

      if (isShuffle) {
        let randIdx;
        do {
          randIdx = Math.floor(Math.random() * tracks.length);
        } while (randIdx === currentTrackIndex && tracks.length > 1);
        loadTrack(randIdx);
        if(isPlaying) playTrack();
        renderHome();
        return;
      }

      let idx = currentTrackIndex + 1;
      if(idx >= tracks.length) idx = 0;
      loadTrack(idx);
      if(isPlaying) playTrack();
      renderHome();
    }

    progress.oninput = () => {
      fkCur = parseFloat(progress.value);
      timeCurrent.textContent = formatTime(fkCur);
      syncLyrics(fkCur);
    };

    function syncLyrics(currentTime) {
      const track = tracks[currentTrackIndex];
      const lyricsData = getLyricsForTrack(track.title);
      let activeIndex = 0;
      for(let i=0; i<lyricsData.length; i++) {
        if(currentTime >= lyricsData[i].time) { activeIndex = i; }
      }
      document.querySelectorAll('.lyrics-item').forEach((item, idx) => {
        if(idx === activeIndex) {
          if(!item.classList.contains('active')) {
            item.classList.add('active');
            item.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        } else {
          item.classList.remove('active');
        }
      });
    }

    function startEngineTimer() {
      stopEngineTimer();
      fkTimerId = setInterval(() => {
        const track = tracks[currentTrackIndex];
        fkCur += 0.1;
        
        if(fkCur >= track.duration) {
          fkCur = track.duration;
          progress.value = fkCur;
          timeCurrent.textContent = formatTime(fkCur);
          nextTrack();
        } else {
          progress.value = fkCur;
          timeCurrent.textContent = formatTime(fkCur);
        }
        syncLyrics(fkCur);
      }, 100);
    }

    function stopEngineTimer() { if(fkTimerId) { clearInterval(fkTimerId); fkTimerId = null; } }

    function incrementStats(trackId) {
      let stats = JSON.parse(safeGet(`sd_stats_${userSession}`) || "{}");
      stats[trackId] = (stats[trackId] || 0) + 1;
      safeSet(`sd_stats_${userSession}`, JSON.stringify(stats));
      renderRanking();
    }

    function renderHome() {
      const container = document.getElementById('homeTrackList');
      container.innerHTML = "";
      tracks.forEach((t, i) => {
        const card = document.createElement('div');
        card.className = `card ${i === currentTrackIndex ? 'active' : ''}`;
        card.onclick = () => { loadTrack(i); playTrack(); renderHome(); };
        card.innerHTML = `
          <div class="card-art"><img src="${t.jacket}" alt="art" onerror="this.parentNode.innerHTML='🎵'"></div>
          <div class="card-info">
            <div class="card-title">${t.title}</div>
            <div class="card-artist">${t.artist} • ${t.album}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderRanking() {
      const container = document.getElementById('rankingList');
      container.innerHTML = "";
      let stats = JSON.parse(safeGet(`sd_stats_${userSession}`) || "{}");
      
      const sorted = tracks
        .map(t => ({ ...t, count: stats[t.id] || 0 }))
        .sort((a,b) => b.count - a.count);

      sorted.forEach((t, i) => {
        const item = document.createElement('div');
        item.className = "rank-item";
        item.innerHTML = `
          <div class="rank-num">${i + 1}</div>
          <div class="rank-info">
            <div class="rank-title">${t.title}</div>
            <div class="rank-artist">${t.artist}</div>
          </div>
          <div class="rank-count">${t.count}回再生</div>
        `;
        container.appendChild(item);
      });
    }

    btnUpdatePass.onclick = () => {
      const np = newPassInput.value.trim();
      if(np.length < 4) { alert("アクセスコードは4文字以上で入力してください。"); return; }
      safeSet(`sd_pass_${userSession}`, np);
      passMsg.style.color = "#34c759";
      passMsg.style.display = "block";
      passMsg.textContent = "アクセスコードを更新しました。";
      newPassInput.value = "";
      setTimeout(() => passMsg.style.display="none", 3000);
    };

    btnLogout.onclick = () => {
      safeRemove('sd_session_user'); audio.pause(); stopEngineTimer(); isPlaying = false;
      btnPlay.innerHTML = '<i class="fa-solid fa-play"></i>';
      appWrap.style.display = 'none'; authModal.style.display = 'flex';
      authId.value = ""; authPass.value = "";
    };

    btnResetData.onclick = () => {
      if(confirm('これまでの再生履歴、ランキング、カスタムパスワードがすべて初期化されます。よろしいですか？')) {
        safeRemove(`sd_stats_${userSession}`); safeRemove(`sd_pass_${userSession}`);
        alert('データをリセットしました。セッションを終了します。'); btnLogout.click();
      }
    };

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', playTrack);
      navigator.mediaSession.setActionHandler('pause', pauseTrack);
      navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
      navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(()=>{});
      });
    }
  </script>
</body>
</html>
