<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SoundDeck v1.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SoundDeck">

<style>
    /* =========================================
       🎨 Apple Style: Liquid Glass Theme
       ========================================= */
    :root {
      --bg-main: #e2e8f0; 
      --panel-bg: rgba(255, 255, 255, 0.75);
      --panel-border: rgba(255, 255, 255, 0.8);
      /* 🌟 ボトムホットバー用：より透明度を高く、ガラス感を強化 */
      --bar-glass-bg: rgba(255, 255, 255, 0.45);
      --bar-glass-border: rgba(255, 255, 255, 0.6);
      --accent-color: #ff2d55;
      --text-main: #000000;
      --text-muted: #1c1c1e;
      --text-sub: #8e8e93;
      --btn-main-bg: #1c1c1e;
      --btn-main-text: white;
      --item-hover: rgba(0, 0, 0, 0.04);
      --item-active: rgba(255, 45, 85, 0.08);
      --lyrics-dim: rgba(0, 0, 0, 0.25);
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      --glass-blur: blur(40px);
      /* ブラーを少し強めて高級感アップ */
      --hotbar-height: 100px; /* バー自体を少し高めに */
      --header-height: 80px;
    }

    html[data-theme="dark"] {
      --bg-main: #030712;
      --panel-bg: rgba(28, 28, 30, 0.65);
      --panel-border: rgba(255, 255, 255, 0.1);
      /* 🌟 ダークモード用：より透明度の高い漆黒の硝子 */
      --bar-glass-bg: rgba(20, 20, 25, 0.4);
      --bar-glass-border: rgba(255, 255, 255, 0.08);
      
      --accent-color: #ff2d55;
      --text-main: #ffffff;
      --text-muted: #f2f2f7;
      --text-sub: #8e8e93;
      --btn-main-bg: #ffffff;
      --btn-main-text: #000000;
      --item-hover: rgba(255, 255, 255, 0.06);
      --item-active: rgba(255, 45, 85, 0.15);
      --lyrics-dim: rgba(255, 255, 255, 0.3);
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .bg-animate {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
      pointer-events: none;
      background: radial-gradient(circle at 80% 20%, rgba(255, 45, 85, 0.12), transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(0, 122, 255, 0.08), transparent 50%);
      animation: ambientBg 20s infinite alternate ease-in-out;
    }
    @keyframes ambientBg { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

    /* =========================================
       🔒 認証モーダル
       ========================================= */
    #authModal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      display: none;
      justify-content: center; align-items: center; z-index: 10000;
    }
    .auth-box {
      background: var(--panel-bg); border: 1px solid var(--panel-border);
      padding: 40px; border-radius: 28px; width: 100%; max-width: 400px;
      box-shadow: var(--shadow); text-align: center;
    }
    .auth-box img.logo-lg { height: 48px; margin-bottom: 20px; object-fit: contain; }
    .auth-subtitle { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 24px; }
    .auth-input {
      width: 100%; padding: 14px; border-radius: 14px; border: 1px solid rgba(125,125,125,0.2);
      background: rgba(125, 125, 125, 0.05); color: var(--text-main); font-size: 1rem;
      margin-bottom: 12px; outline: none; transition: border-color 0.2s;
    }
    .auth-input:focus { border-color: var(--accent-color); }
    .auth-error { color: var(--accent-color); font-size: 0.8rem; margin-bottom: 12px; min-height: 18px; text-align: left; }
    
    .btn-primary {
      width: 100%; min-height: 48px; padding: 14px; border: none; border-radius: 14px;
      background: var(--btn-main-bg); color: var(--btn-main-text); font-size: 1.05rem; font-weight: 600;
      cursor: pointer; transition: transform 0.2s;
    }
    .btn-primary:active { transform: scale(0.98); }

    /* =========================================
       🍏 メインアプリケーションレイアウト
       ========================================= */
    #appWrap { display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; }

    header {
      height: var(--header-height); padding: 0 40px; display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0; z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 24px; }
    .brand-group { display: flex; align-items: center; gap: 10px; }
    .header-logo { height: 36px; object-fit: contain; }
    .brand-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
    
    .network-badge { font-size: 0.75rem; font-weight: 700; padding: 6px 12px; border-radius: 12px; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
    .badge-online { background: rgba(52, 199, 89, 0.15); color: #34c759; }
    .badge-offline { background: rgba(255, 149, 0, 0.15); color: #ff9500; }
    .fk-badge { font-size: 0.75rem; font-weight: 800; background: #ff9500; color: white; padding: 4px 8px; border-radius: 8px; display: none; }

    .btn-theme-circle {
      width: 50px; height: 50px; border-radius: 50%; background: var(--panel-bg); border: 1px solid var(--panel-border);
      color: var(--text-main); font-size: 1.35rem; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.3s ease; backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); box-shadow: var(--shadow);
    }
    .btn-theme-circle:hover { transform: scale(1.08); color: var(--accent-color); }

    /* 🌟 メイン領域：画面からはみ出さないよう高さをガッチリ固定 */
    main { 
      flex: 1; 
      padding: 0 40px 140px 40px; /* 下部ホットバー用の余白 */
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
    }
    
    /* 🌟 各タブコンテンツ：親要素の高さ100%を維持してはみ出しを防ぐ */
    .view-tab { display: none; width: 100%; height: 100%; flex-direction: column; overflow: hidden; }
    .view-tab.active { display: flex; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    
    /* ホームと検索は縦スクロール可能に */
    #tab-home, #tab-search, #tab-settings { overflow-y: auto; padding-right: 4px; }
    
    @keyframes slideUp { 
      from { opacity: 0; transform: translateY(30px); } 
      to { opacity: 1; transform: translateY(0); } 
    }
    
    .section-title { font-size: 1.8rem; font-weight: 800; margin-top: 10px; margin-bottom: 24px; letter-spacing: -0.5px; }

    .pl-panel {
      background: var(--panel-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--panel-border); border-radius: 28px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; overflow: hidden; height: 100%;
    }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 20px; padding: 20px; display: flex; align-items: center; gap: 16px; cursor: pointer; backdrop-filter: var(--glass-blur); transition: transform 0.2s, background 0.2s; box-shadow: var(--shadow); }
    .card:hover { transform: translateY(-4px); background: var(--item-hover); }
    .card-img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; }
    .card-info { flex: 1; overflow: hidden; }
    .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-desc { font-size: 0.85rem; color: var(--text-sub); }
    .rank-badge { font-size: 1.5rem; font-weight: 800; color: var(--accent-color); opacity: 0.5; width: 30px; text-align: center; }

    .search-bar-container { position: relative; max-width: 600px; margin-bottom: 30px; }
    .search-input { width: 100%; padding: 18px 20px 18px 50px; font-size: 1.2rem; border-radius: 20px; border: 1px solid var(--panel-border); background: var(--panel-bg); color: var(--text-main); backdrop-filter: var(--glass-blur); box-shadow: var(--shadow); outline: none; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--accent-color); }
    .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-sub); font-size: 1.2rem; }

    /* =========================================
       🎵 プレイリストビュー (3カラム独立スクロール対応)
       ========================================= */
    .playlist-layout-v06 {
      display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 30px; height: 100%; width: 100%; overflow: hidden;
    }
    
    .pl-panel-art { padding: 40px 30px; justify-content: center; align-items: center; }
    .art-mega-wrapper { width: 100%; max-width: 300px; aspect-ratio: 1; margin: 0 auto; border-radius: 24px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.15); transition: transform 0.4s ease; }
    .playing .art-mega-wrapper { transform: scale(1.04); }
    .art-mega { width: 100%; height: 100%; object-fit: cover; }
    .art-info { text-align: center; margin-top: 24px; width: 100%; }
    .art-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .art-artist { font-size: 1.05rem; color: var(--accent-color); font-weight: 600; }

    .pl-panel-lyrics { padding: 30px; display: flex; flex-direction: column; }
    .lyrics-header-zone { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
    .list-header { font-size: 0.9rem; font-weight: 700; letter-spacing: 1px; color: var(--text-sub); }
    .btn-hide-lyrics { background: var(--item-active); border: none; color: var(--text-main); padding: 6px 14px; border-radius: 12px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    
    /* 🌟 歌詞ボックス：ここが独立して綺麗にスクロールします */
    .lyrics-box { 
      flex: 1; 
      overflow-y: scroll; 
      padding: 60% 0; /* 上下に余白を持たせて中央ハイライトしやすく */
      scroll-behavior: smooth;
    }
    .lyrics-box::-webkit-scrollbar { display: none; }
    .l-line { font-size: 1.35rem; font-weight: 700; color: var(--lyrics-dim); line-height: 1.6; margin-bottom: 24px; cursor: pointer; transition: all 0.3s ease; transform-origin: left center; }
    .l-line.active { color: var(--text-main); transform: scale(1.05); filter: drop-shadow(0 0 10px rgba(255,45,85,0.15)); }

    .pl-panel-list { padding: 30px; display: flex; flex-direction: column; }
    
    /* 🌟 トラックリスト：ここも独立してスクロールします */
    .track-list { 
      list-style: none; 
      overflow-y: auto; 
      flex: 1; 
      margin-top: 15px;
      padding-right: 4px;
    }
    .track-list::-webkit-scrollbar { width: 4px; }
    .track-list::-webkit-scrollbar-thumb { background: rgba(125,125,125,0.2); border-radius: 4px; }
    
    .track-row { display: flex; align-items: center; padding: 12px 16px; border-radius: 16px; cursor: pointer; border: 1px solid transparent; transition: background 0.2s, border 0.2s; margin-bottom: 6px; }
    .track-row:hover { background: var(--item-hover); border: 1px solid rgba(125,125,125,0.1); }
    .track-row.active { background: var(--item-active); border: 1px solid rgba(255,45,85,0.1); }
    .track-row.active .t-title { color: var(--accent-color); }
    .t-num { width: 36px; color: var(--text-sub); font-weight: 700; font-size: 0.95rem; }
    .t-art { width: 44px; height: 44px; border-radius: 10px; margin-right: 16px; object-fit: cover; }
    .t-info { flex: 1; overflow: hidden; }
    .t-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t-artist { font-size: 0.85rem; color: var(--text-sub); font-weight: 500; }

    /* =========================================
       ⚙️ 設定画面
       ========================================= */
    .account-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 28px; padding: 40px; max-width: 600px; margin-bottom: 30px; backdrop-filter: var(--glass-blur); box-shadow: var(--shadow); }
    .acc-header { display: flex; align-items: center; gap: 24px; margin-bottom: 30px; }
    .acc-avatar { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--accent-color); object-fit: cover; }
    .acc-name { font-size: 1.8rem; font-weight: 800; }
    .acc-id { font-size: 0.9rem; color: var(--text-sub); font-weight: 600; }
    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 10px; color: var(--text-sub); }
    .input-flat { width: 100%; max-width: 340px; padding: 14px; border-radius: 12px; border: 1px solid rgba(125,125,125,0.2); background: rgba(125, 125, 125, 0.04); color: var(--text-main); font-size: 1rem; outline: none; transition: border-color 0.2s; margin-bottom: 12px; display: block; }
    .acc-btn { min-height: 44px; padding: 12px 24px; border-radius: 14px; font-weight: 700; cursor: pointer; border: none; font-size: 0.95rem; transition: background 0.2s, transform 0.1s; display: inline-flex; align-items: center; justify-content: center; }
    .acc-btn:active { transform: scale(0.98); }
    .btn-outline { background: transparent; border: 2px solid var(--accent-color); color: var(--accent-color); }
    .btn-outline:hover { background: rgba(255,45,85,0.1); }
    .btn-danger { background: rgba(255, 59, 48, 0.1); color: #ff3b30; border: 2px solid rgba(255, 59, 48, 0.3); }
    .btn-danger:hover { background: rgba(255, 59, 48, 0.2); }

    /* =========================================
       🎵 ボトムホットバー
       ========================================= */
    .hotbar {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 48px); max-width: 1240px; border-radius: 24px;
      border: 1px solid var(--bar-glass-border); height: var(--hotbar-height); background: var(--bar-glass-bg);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      display: flex; align-items: center; padding: 0 40px; justify-content: space-between; z-index: 900; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15); 
    }
    .hb-left { display: flex; align-items: center; gap: 18px; min-width: 260px; }
    .hb-art { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }
    .hb-info { overflow: hidden; }
    .hb-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hb-artist { font-size: 0.9rem; color: var(--text-sub); font-weight: 500; }
    .hb-center { flex: 1; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .hb-controls { display: flex; align-items: center; gap: 12px; }
    .ctrl-btn { background: none; border: none; color: var(--text-main); font-size: 1.4rem; cursor: pointer; transition: all 0.2s; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; } 
    .ctrl-btn:hover { background: var(--item-hover); color: var(--accent-color); }
    .ctrl-btn.btn-play { font-size: 3.2rem; width: 58px; height: 58px; color: var(--text-main); }
    .ctrl-btn.btn-play:hover { transform: scale(1.06); color: var(--accent-color); background: none; }
    .hb-progress { width: 100%; display: flex; align-items: center; gap: 12px; }
    .hb-progress span { font-size: 0.75rem; font-weight: 700; color: var(--text-sub); min-width: 35px; }
    #timeCurrent { text-align: right; }
    .slider { -webkit-appearance: none; appearance: none; width: 100%; height: 5px; border-radius: 3px; background: rgba(125,125,125,0.2); outline: none; cursor: pointer; }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--text-main); cursor: pointer; transition: transform 0.1s; }
    .slider::-webkit-slider-thumb:hover { transform: scale(1.3); background: var(--accent-color); }

    .hb-right { display: flex; align-items: center; gap: 24px; min-width: 260px; justify-content: flex-end; }
    .toggle-lyrics-btn { background: none; border: none; color: var(--text-sub); font-size: 1.35rem; cursor: pointer; transition: color 0.2s; }
    .toggle-lyrics-btn.active { color: var(--accent-color); }
    .nav-tabs { background: rgba(125,125,125,0.08); padding: 3px 3px; border-radius: 100px; display: flex; gap: 12px; }
    .nav-tab { background: none; border: none; color: var(--text-sub); width: 46px; height: 40px; border-radius: 100px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: all 0.2s; }
    .nav-tab:hover { color: var(--text-main); }
    .nav-tab.active { background: var(--panel-bg); color: var(--accent-color); box-shadow: 0 3px 5px rgba(0,0,0,0.06); width: 60px; }

    @media (max-width: 1000px) {
      .hotbar { padding: 0 20px; height: auto; padding-top: 12px; padding-bottom: 12px; flex-direction: column; gap: 10px; bottom: 10px; width: calc(100% - 20px); }
      .hb-left { display: none; }
      .hb-right { min-width: auto; width: 100%; justify-content: center; }
      .hb-center { width: 100%; }
      .playlist-layout-v06 { grid-template-columns: 1fr; overflow-y: auto; }
      .pl-panel { height: auto; min-height: 350px; }
      .lyrics-box { padding: 30px 0; }
      main { padding: 0 20px 180px 20px; }
    }
  /* スクロールバーを完全に非表示にする（スクロール機能は維持） */
::-webkit-scrollbar {
  display: none;
}
* {
  scrollbar-width: none; /* Firefox用 */
}
  </style>
</head>
<body>

  <div class="bg-animate"></div>

  <div id="appWrap">
    <header>
      <div class="header-left">
        <div class="brand-group">
          <img src="logo.png" alt="Logo" class="header-logo" onerror="this.src='https://unpkg.com/lucide@latest/dist/esm/icons/music.js'">
          <span class="brand-title">SoundDeck</span>
        </div>
        <div id="networkBadge" class="network-badge badge-online">
          <i class="fa-solid fa-circle"></i> <span>ONLINE</span>
        </div>
        <div id="fkBadge" class="fk-badge">FAKETIME ON</div>
      </div>
      <div style="display: flex; align-items: center; gap: 14px;">
        <button id="btnSpeed" class="speed-btn" style="display:none;">1.0x</button>
        <button id="btnTheme" class="btn-theme-circle"><i class="fa-solid fa-moon"></i></button>
      </div>
    </header>

    <main>
      <div id="tab-home" class="view-tab active">
        <h2 class="section-title">Home</h2>
        <div class="card-grid" id="homeQuickGrid"></div>
        <h2 class="section-title">再生回数ランキング</h2>
        <div class="card-grid" id="homeRankGrid"></div>
      </div>

      <div id="tab-search" class="view-tab">
        <h2 class="section-title">曲を探す</h2>
        <div class="search-bar-container">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="曲名、アーティスト名で検索...">
        </div>
        <div class="card-grid" id="searchResultGrid"></div>
      </div>

      <div id="tab-playlist" class="view-tab">
         <div class="playlist-layout-v06" id="playlistLayout">
          
          <div class="pl-panel pl-panel-art">
            <div class="art-mega-wrapper">
              <img src="jacket1.png" alt="Cover" class="art-mega" id="panelCover" onerror="this.src='logo.png'">
            </div>
            <div class="art-info">
              <div class="art-title" id="panelTitle">---</div>
              <div class="art-artist" id="panelArtist">---</div>
            </div>
          </div>

          <div class="pl-panel pl-panel-lyrics" id="lyricsPanel">
            <div class="lyrics-header-zone">
              <span class="list-header">LYRICS SYNC</span>
              <button class="btn-hide-lyrics" id="btnHideLyrics" style="display:none;">歌詞を隠す</button>
            </div>
            <div class="lyrics-box" id="lyricsBox"></div>
          </div>

          <div class="pl-panel pl-panel-list">
            <span class="list-header" style="padding: 20px 20px 0 20px;">PLAYLIST TRACKS</span>
            <div class="track-list" id="trackList"></div>
          </div>

        </div>
      </div>

      <div id="tab-settings" class="view-tab">
        <h2 class="section-title">Settings</h2>
        <div class="account-card">
          <div class="acc-header">
            <img src="avatar.png" alt="Avatar" class="acc-avatar" onerror="this.src='logo.png'">
            <div>
              <div class="acc-name" id="profileName">User</div>
              <div class="acc-id" id="profileId">ID: Deck_5532</div>
            </div>
          </div>
          <p style="color:var(--text-sub);">SoundDeck v1.0 - Normal Mode</p>
        </div>
      </div>
    </main>

    <div class="hotbar">
      <div class="hb-left">
        <img src="jacket1.png" alt="Cover" class="hb-art" id="barCover" onerror="this.src='logo.png'">
        <div class="hb-info">
          <div class="hb-title" id="barTitle">---</div>
          <div class="hb-artist" id="barArtist">---</div>
        </div>
      </div>

      <div class="hb-center">
        <div class="hb-controls">
          <button class="ctrl-btn" id="btnShuffle" title="シャッフル"><i class="fa-solid fa-shuffle"></i></button>
          <button class="ctrl-btn" id="btnPrev"><i class="fa-solid fa-backward-step"></i></button>
          <button class="ctrl-btn btn-play" id="btnPlay"><i class="fa-solid fa-circle-play"></i></button>
          <button class="ctrl-btn" id="btnNext"><i class="fa-solid fa-forward-step"></i></button>
          <button class="ctrl-btn" id="btnRepeat" title="リピート"><i class="fa-solid fa-repeat"></i></button>
        </div>
        <div class="hb-progress">
          <span id="timeCurrent">0:00</span>
          <input type="range" id="progressSlider" class="slider" min="0" value="0" step="0.1">
          <span id="timeDuration">0:00</span>
        </div>
      </div>

      <div class="hb-right">
        <button class="toggle-lyrics-btn active" id="btnToggleLyrics"><i class="fa-solid fa-quote-right"></i></button>
        <div class="nav-tabs">
          <button class="nav-tab active" data-tab="home"><i class="fa-solid fa-house"></i></button>
          <button class="nav-tab" data-tab="search"><i class="fa-solid fa-magnifying-glass"></i></button>
          <button class="nav-tab" data-tab="playlist"><i class="fa-solid fa-music"></i></button>
          <button class="nav-tab" data-tab="settings"><i class="fa-solid fa-gear"></i></button>
        </div>
      </div>
    </div>
  </div>

  <audio id="mainAudio"></audio>

<script>
    // --- 状態管理変数 ---
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false; 
    let currentTrackIndex = 0;
    
    // 🌟 ご提示いただいた12曲のオリジナルリストを（エラーを修正して）完全に復活させました！
    let songs = [
      { id: 0, title: "気まぐれロマンティック", artist: "いきものがかり", src: "song1.mp3", cover: "jacket1.png", lines: [
        { time: 0.0, text: "🎵 (イントロ)" },
        { time: 1.0, text: "ロマンティック 恋のアンテナは" },
        { time: 5.0, text: "嵐で何処かへ飛んでいった" },
        { time: 9.0, text: "嘘でしょう 冷たく遇った" },
        { time: 13.0, text: "こしゃくなエクボに ちょっと心が揺れてる" },
        { time: 19.0, text: "ホントは本気であたしを叱ってくれる大事なひと" },
        { time: 27.0, text: "なんて言ったらアイツは得意気になるから" },
        { time: 33.0, text: "もう褒めたりしない" },
        { time: 36.0, text: "タイクツな運命に飽き飽きしたの" },
        { time: 41.0, text: "知らない台詞で解き放してね" },
        { time: 46.0, text: "ダーリン ダーリン 心の扉を壊してよ" },
        { time: 52.0, text: "たいせつなことは瞳を見て云って" },
        { time: 57.0, text: "あなたとならばこの街を抜け出せる" },
        { time: 63.0, text: "今すぐ連れ出して My Sweet Sweet Darling" }
      ]},
      { id: 1, title: "AM11:00", artist: "HY", src: "song2.mp3", cover: "jacket2.png", lines: [
        { time: 0.0, text: "🎵 (イントロ)" },
        { time: 14.0, text: "『目を覚ましてよ』君の声が僕を包み Yeah" },
        { time: 22.0, text: "窓を開けてそよ風が君の髪をなびく" },
        { time: 29.0, text: "部屋から出る 僕の腕をつかみながら 君は" },
        { time: 36.0, text: "『もう少しだけ』『もう少しだけ』と僕に君はつぶやく" },
        { time: 44.0, text: "この世界が闇に染まる前にこの思いを" },
        { time: 51.0, text: "だからお願い 僕のそばにいてくれないか" },
        { time: 56.0, text: "君が好きだから" },
        { time: 58.0, text: "この思いが君に届くように 願いが届きますように" }
      ]},
      { id: 2, title: "自転車", artist: "JUDY AND MARY", src: "song3.mp3", cover: "jacket3.png", lines: [{ time: 0, text: "JUDY AND MARY - 自転車" }]},
      { id: 3, title: "風吹けば恋", artist: "チャットモンチー", src: "song4.mp3", cover: "jacket4.png", lines: [{ time: 0, text: "チャットモンチー - 風吹けば恋" }]},
      { id: 4, title: "愛唄", artist: "GReeeeN", src: "song5.mp3", cover: "jacket5.png", lines: [{ time: 0, text: "GReeeeN - 愛唄" }]},
      { id: 5, title: "出逢った頃のように", artist: "Every Little Thing", src: "song6.mp3", cover: "jacket6.png", lines: [{ time: 0, text: "Every Little Thing - 出逢った頃のように" }]},
      { id: 6, title: "STARS", artist: "中島美嘉", src: "song7.mp3", cover: "jacket7.png", lines: [{ time: 0, text: "中島美嘉 - STARS" }]},
      { id: 7, title: "言わないけどね", artist: "大原ゆい子", src: "song8.mp3", cover: "jacket8.png", lines: [{ time: 0, text: "大原ゆい子 - 言わないけどね" }]},
      { id: 8, title: "やさしい気持ち", artist: "Chara", src: "song9.mp3", cover: "jacket9.png", lines: [{ time: 0, text: "Chara - やさしい気持ち" }]},
      { id: 9, title: "君と光", artist: "大原ゆい子", src: "song10.mp3", cover: "jacket10.png", lines: [{ time: 0, text: "大原ゆい子 - 君と光" }]},
      { id: 10, title: "ゼロセンチメートル", artist: "大原ゆい子", src: "song11.mp3", cover: "jacket10.png", lines: [{ time: 0, text: "大原ゆい子 - ゼロセンチメートル" }]},
      { id: 11, title: "まっすぐ", artist: "大原ゆい子", src: "song12.mp3", cover: "logo.png", lines: [{ time: 0, text: "大原ゆい子 - まっすぐ" }]}
    ];

    // --- DOM要素取得 ---
    const audio = document.getElementById('mainAudio');
    const btnPlay = document.getElementById('btnPlay');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnShuffle = document.getElementById('btnShuffle');
    const btnRepeat = document.getElementById('btnRepeat');
    const playIcon = btnPlay ? btnPlay.querySelector('i') : null;
    
    const barTitle = document.getElementById('barTitle');
    const barArtist = document.getElementById('barArtist');
    const barCover = document.getElementById('barCover');
    const panelTitle = document.getElementById('panelTitle');
    const panelArtist = document.getElementById('panelArtist');
    const panelCover = document.getElementById('panelCover');

    const timeCurrent = document.getElementById('timeCurrent');
    const timeDuration = document.getElementById('timeDuration');
    const progressSlider = document.getElementById('progressSlider');
    const themeToggle = document.getElementById('btnTheme');
    const btnToggleLyrics = document.getElementById('btnToggleLyrics');
    const lyricsPanel = document.getElementById('lyricsPanel');
    const playlistLayout = document.getElementById('playlistLayout');

    const homeQuickGrid = document.getElementById('homeQuickGrid');
    const homeRankGrid = document.getElementById('homeRankGrid');
    const trackListContainer = document.getElementById('trackList');
    const searchInput = document.getElementById('searchInput');
    const searchResultGrid = document.getElementById('searchResultGrid');

    // --- 初期化処理 ---
    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
      
      renderLists();
      loadTrack(currentTrackIndex);
      
      // タブ切り替え機能
      const tabButtons = document.querySelectorAll('.nav-tab');
      const views = document.querySelectorAll('.view-tab');
      tabButtons.forEach(button => {
        button.addEventListener('click', () => {
          tabButtons.forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');
          const targetTabId = button.getAttribute('data-tab');
          views.forEach(view => view.classList.remove('active'));
          const targetView = document.getElementById(`tab-${targetTabId}`);
          if (targetView) targetView.classList.add('active');
        });
      });
    });

    // --- 各画面に曲リストを表示 ---
    function renderLists() {
      if (homeQuickGrid) {
        homeQuickGrid.innerHTML = songs.map((song, idx) => `
          <div class="card" onclick="selectTrack(${idx})">
            <img src="${song.cover}" class="card-img" onerror="this.src='logo.png'">
            <div class="card-info">
              <div class="card-title">${song.title}</div>
              <div class="card-desc">${song.artist}</div>
            </div>
          </div>
        `).join('');
      }
      if (homeRankGrid) {
        homeRankGrid.innerHTML = songs.slice(0, 5).map((song, idx) => `
          <div class="card" onclick="selectTrack(${idx})">
            <span class="rank-badge">${idx + 1}</span>
            <img src="${song.cover}" class="card-img" onerror="this.src='logo.png'">
            <div class="card-info">
              <div class="card-title">${song.title}</div>
              <div class="card-desc">${song.artist}</div>
            </div>
          </div>
        `).join('');
      }
      updateTrackListHighlight();
    }

    function updateTrackListHighlight() {
      if (!trackListContainer) return;
      trackListContainer.innerHTML = songs.map((song, idx) => `
        <div class="track-row ${idx === currentTrackIndex ? 'active' : ''}" onclick="selectTrack(${idx})">
          <span class="t-num">${String(idx + 1).padStart(2, '0')}</span>
          <img src="${song.cover}" class="t-art" onerror="this.src='logo.png'">
          <div class="t-info">
            <div class="t-title">${song.title}</div>
            <div class="t-artist">${song.artist}</div>
          </div>
        </div>
      `).join('');
    }

    // --- 曲の選択再生 ---
    window.selectTrack = function(index) {
      currentTrackIndex = index;
      loadTrack(currentTrackIndex);
      playAudio();
    };

    // --- トラック読み込み ---
    function loadTrack(index) {
      const track = songs[index];
      if (!track) return;

      audio.src = track.src; // あなたのローカルファイル（song1.mp3など）を読み込みます
      audio.load();

      if (barTitle) barTitle.textContent = track.title;
      if (barArtist) barArtist.textContent = track.artist;
      if (barCover) barCover.src = track.cover;
      if (panelTitle) panelTitle.textContent = track.title;
      if (panelArtist) panelArtist.textContent = track.artist;
      if (panelCover) panelCover.src = track.cover;

      // 歌詞生成
      const lyricsBox = document.getElementById('lyricsBox');
      if (lyricsBox) {
        if (track.lines && track.lines.length > 0) {
          lyricsBox.innerHTML = track.lines.map(line => `
            <div class="l-line" data-time="${line.time}">${line.text}</div>
          `).join('');
        } else {
          lyricsBox.innerHTML = '<div class="l-line active">歌詞情報がありません</div>';
        }
      }
      updateTrackListHighlight();
    }

    // --- 再生・一時停止の制御ロジック ---
    function playAudio() {
      audio.play().then(() => {
        isPlaying = true;
        document.getElementById('appWrap').classList.add('playing');
        if (playIcon) {
          playIcon.classList.remove('fa-circle-play');
          playIcon.classList.add('fa-circle-pause');
        }
      }).catch(err => {
        console.log("再生エラー（ファイルが正しい場所にあるか確認してください）:", err);
      });
    }

    function pauseAudio() {
      audio.pause();
      isPlaying = false;
      document.getElementById('appWrap').classList.remove('playing');
      if (playIcon) {
        playIcon.classList.remove('fa-circle-pause');
        playIcon.classList.add('fa-circle-play');
      }
    }

    if (btnPlay) {
      btnPlay.addEventListener('click', () => {
        if (isPlaying) pauseAudio(); else playAudio();
      });
    }

    if (btnNext) {
      btnNext.addEventListener('click', () => {
        currentTrackIndex = (currentTrackIndex + 1) % songs.length;
        loadTrack(currentTrackIndex);
        if (isPlaying) playAudio();
      });
    }

    if (btnPrev) {
      btnPrev.addEventListener('click', () => {
        currentTrackIndex = (currentTrackIndex - 1 + songs.length) % songs.length;
        loadTrack(currentTrackIndex);
        if (isPlaying) playAudio();
      });
    }

    // --- オーディオイベント (時間更新・スライダー同期・自動歌詞スクロール) ---
    audio.addEventListener('timeupdate', () => {
      const curr = audio.currentTime;
      const dur = audio.duration || 0;
      
      if (timeCurrent) timeCurrent.textContent = formatTime(curr);
      if (progressSlider) progressSlider.value = curr;

      // 歌詞の自動ジャストスクロール・ハイライト
      const lines = document.querySelectorAll('.l-line');
      let activeLine = null;

      lines.forEach(line => {
        const t = parseFloat(line.getAttribute('data-time'));
        if (curr >= t) {
          activeLine = line;
        }
      });

      if (activeLine) {
        lines.forEach(l => l.classList.remove('active'));
        activeLine.classList.add('active');
        
        const box = document.getElementById('lyricsBox');
        if (box) {
          const activeOffset = activeLine.offsetTop;
          const boxHeight = box.clientHeight;
          box.scrollTop = activeOffset - (boxHeight / 2);
        }
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      if (timeDuration) timeDuration.textContent = formatTime(audio.duration);
      if (progressSlider) progressSlider.max = audio.duration;
    });

    audio.addEventListener('ended', () => {
      if (isRepeat) {
        audio.currentTime = 0;
        playAudio();
      } else {
        currentTrackIndex = (currentTrackIndex + 1) % songs.length;
        loadTrack(currentTrackIndex);
        playAudio();
      }
    });

    if (progressSlider) {
      progressSlider.addEventListener('input', (e) => {
        audio.currentTime = e.target.value;
      });
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // --- 歌詞パネルの表示切り替え（右下のクォーテーションボタン） ---
    if (btnToggleLyrics && lyricsPanel) {
      btnToggleLyrics.addEventListener('click', () => {
        btnToggleLyrics.classList.toggle('active');
        if (lyricsPanel.style.display === 'none') {
          lyricsPanel.style.display = 'flex';
          playlistLayout.style.gridTemplateColumns = "1fr 1.3fr 1fr";
        } else {
          lyricsPanel.style.display = 'none';
          playlistLayout.style.gridTemplateColumns = "1fr 1fr";
        }
      });
    }

    // リピート & シャッフルの見た目
    if (btnRepeat) {
      btnRepeat.addEventListener('click', () => {
        isRepeat = !isRepeat;
        btnRepeat.style.color = isRepeat ? "var(--accent-color)" : "";
      });
    }
    if (btnShuffle) {
      btnShuffle.addEventListener('click', () => {
        isShuffle = !isShuffle;
        btnShuffle.style.color = isShuffle ? "var(--accent-color)" : "";
      });
    }

    // テーマ切り替え
    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
          document.documentElement.removeAttribute('data-theme');
          themeToggle.innerHTML = '<i class="fa-solid fa-moon"></i>';
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          themeToggle.innerHTML = '<i class="fa-solid fa-sun"></i>';
        }
      });
    }

    // 検索機能
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        if (!query) {
          if (searchResultGrid) searchResultGrid.innerHTML = '';
          return;
        }
        const filtered = songs.filter(s => s.title.toLowerCase().includes(query) || s.artist.toLowerCase().includes(query));
        if (searchResultGrid) {
          searchResultGrid.innerHTML = filtered.map(song => {
            const origIdx = songs.findIndex(s => s.id === song.id);
            return `
              <div class="card" onclick="selectTrack(${origIdx})">
                <img src="${song.cover}" class="card-img" onerror="this.src='logo.png'">
                <div class="card-info">
                  <div class="card-title">${song.title}</div>
                  <div class="card-desc">${song.artist}</div>
                </div>
              </div>
            `;
          }).join('');
        }
      });
    }
  </script>
</body>
</html>
