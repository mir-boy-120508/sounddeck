<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SoundDeck v1.0 (Private)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css\">\n  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SoundDeck">

  <style>
    /* =========================================
       🎨 Apple Style: Liquid Glass Theme
       ========================================= */
    :root {
      --bg-main: #e2e8f0; 
      --panel-bg: rgba(255, 255, 255, 0.45);
      --panel-border: rgba(255, 255, 255, 0.4);
      --text-main: #1e293b;
      --text-sub: #64748b;
      --accent-color: #ff2d55; 
      --accent-grad: linear-gradient(135deg, #ff2d55, #ff375f);
      --glass-blur: 30px;
      --hotbar-height: 88px;
    }

    [data-theme="dark"] {
      --bg-main: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.45);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-color: #ff375f;
      --accent-grad: linear-gradient(135deg, #ff375f, #ff456e);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; transition: background 0.5s ease; }

    /* 背景アニメーショングラデーション */
    .bg-animate {
      position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(255,45,85,0.12), transparent 40%),
                  radial-gradient(circle at 70% 70%, rgba(0,122,255,0.08), transparent 40%),
                  radial-gradient(circle at 50% 20%, rgba(90,200,250,0.08), transparent 35%);
      z-index: -1; animation: bgRotate 25s infinite linear; pointer-events: none;
    }
    @keyframes bgRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* 🔐 認証用モダール画面 */
    .auth-container {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      z-index: 9999; background: rgba(15,23,42,0.15); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    }
    .auth-card {
      background: var(--panel-bg); border: 1px solid var(--panel-border);
      padding: 40px; border-radius: 28px; width: 100%; max-width: 420px; text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    }
    .auth-logo { font-size: 3.5rem; margin-bottom: 12px; display: inline-block; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .auth-title { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
    .auth-subtitle { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 32px; font-weight: 500; }
    .auth-group { position: relative; margin-bottom: 20px; text-align: left; }
    .auth-group label { font-size: 0.75rem; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; margin-left: 6px; margin-bottom: 6px; display: block; }
    .auth-input-wrapper { position: relative; display: flex; align-items: center; }
    .auth-input-wrapper i { position: absolute; left: 16px; color: var(--text-sub); font-size: 1.1rem; }
    .auth-input { width: 100%; padding: 14px 16px 14px 46px; border-radius: 14px; border: 1px solid var(--panel-border); background: rgba(125,125,125,0.06); color: var(--text-main); font-size: 1rem; font-weight: 600; transition: all 0.2s; outline: none; }
    .auth-input:focus { border-color: var(--accent-color); background: rgba(125,125,125,0.1); box-shadow: 0 0 0 4px rgba(255,45,85,0.15); }
    .auth-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--accent-grad); color: white; font-size: 1.05rem; font-weight: 700; cursor: pointer; margin-top: 12px; box-shadow: 0 8px 20px rgba(255,45,85,0.25); transition: all 0.2s; }
    .auth-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(255,45,85,0.35); }
    .auth-btn:active { transform: translateY(1px); }

    /* 📱 メインアプリケーションレイアウト */
    #appWrap { display: none; flex-direction: column; height: 100vh; width: 100%; position: relative; }
    
    /* 🏛️ トップグローバルナビゲーション */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 40px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--panel-border); z-index: 80; flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo { font-size: 1.8rem; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-title { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.5px; }
    .header-actions { display: flex; align-items: center; gap: 16px; }
    .hd-btn { background: var(--panel-bg); border: 1px solid var(--panel-border); width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-main); font-size: 1.1rem; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .hd-btn:hover { background: var(--text-main); color: var(--bg-main); transform: translateY(-1px); }

    /* メインコンテンツエリア */
    main { flex: 1; overflow: hidden; padding: 30px 40px; position: relative; }

    /* 📜 画面切り替えコンテナ */
    .view-panel { display: none; width: 100%; height: 100%; }
    .view-panel.active { display: block; }

    /* 🎶 プレイリスト＆歌詞 2カラム構成 */
    .playlist-layout-v06 { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; height: 100%; }
    .playlist-layout-v06.lyrics-off { grid-template-columns: 1fr; }
    
    .pl-panel {
      background: var(--panel-bg); border: 1px solid var(--panel-border);
      border-radius: 24px; padding: 24px; display: flex; flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      height: 100%; overflow: hidden;
    }
    .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-shrink: 0; }
    .panel-title { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .panel-subtitle { font-size: 0.85rem; color: var(--text-sub); font-weight: 600; background: rgba(125,125,125,0.1); padding: 4px 10px; border-radius: 20px; }

    /* 🎵 楽曲リストスクロールエリア */
    .track-list-scroll { flex: 1; overflow-y: auto; padding-right: 4px; }
    .track-list-scroll::-webkit-scrollbar { width: 6px; }
    .track-list-scroll::-webkit-scrollbar-thumb { background: rgba(125,125,125,0.2); border-radius: 3px; }
    
    .track-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-radius: 16px; margin-bottom: 8px; cursor: pointer;
      transition: all 0.2s ease; border: 1px solid transparent;
    }
    .track-item:hover { background: rgba(125,125,125,0.06); }
    .track-item.active { background: rgba(255,45,85,0.08); border-color: rgba(255,45,85,0.15); }
    
    .ti-left { display: flex; align-items: center; gap: 14px; overflow: hidden; flex: 1; }
    .ti-index { font-size: 0.85rem; font-weight: 700; color: var(--text-sub); width: 24px; text-align: center; font-variant-numeric: tabular-nums; }
    .track-item.active .ti-index { color: var(--accent-color); }
    .ti-meta { overflow: hidden; }
    .ti-title { font-weight: 600; font-size: 0.98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .track-item.active .ti-title { color: var(--accent-color); font-weight: 700; }
    .ti-artist { font-size: 0.82rem; color: var(--text-sub); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .ti-right { display: flex; align-items: center; gap: 16px; }
    .ti-badge { font-size: 0.75rem; font-weight: 700; color: var(--accent-color); background: rgba(255,45,85,0.1); padding: 2px 8px; border-radius: 6px; opacity: 0; transition: opacity 0.2s; }
    .track-item.active .ti-badge { opacity: 1; }
    .ti-duration { font-size: 0.82rem; color: var(--text-sub); font-weight: 600; font-variant-numeric: tabular-nums; }

    /* 🎤 歌詞表示システム */
    .lyrics-container { flex: 1; overflow-y: auto; position: relative; padding: 20px 10px; scroll-behavior: smooth; }
    .lyrics-container::-webkit-scrollbar { width: 0px; }
    .lyric-line {
      font-size: 1.45rem; font-weight: 700; padding: 12px 0; color: var(--text-sub);
      transition: all 0.3s ease; transform-origin: left center; cursor: pointer; opacity: 0.4;
      letter-spacing: -0.3px;
    }
    .lyric-line:hover { opacity: 0.8; }
    .lyric-line.active { color: var(--text-main); opacity: 1; transform: scale(1.03); }
    .lyrics-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-sub); gap: 12px; }
    .lyrics-empty i { font-size: 2.5rem; opacity: 0.5; }
    .lyrics-empty p { font-size: 0.95rem; font-weight: 600; }

    /* 📊 再生統計・設定ビュー */
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; height: 100%; }
    .db-panel { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 24px; padding: 28px; backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); box-shadow: 0 10px 30px rgba(0,0,0,0.03); display: flex; flex-direction: column; overflow: hidden; }
    .stats-list { flex: 1; overflow-y: auto; margin-top: 10px; }
    .stats-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid rgba(125,125,125,0.1); }
    .stats-item:last-child { border-bottom: none; }
    .si-info { display: flex; align-items: center; gap: 14px; }
    .si-rank { font-weight: 800; font-size: 1.1rem; color: var(--accent-color); width: 28px; }
    .si-title { font-weight: 600; font-size: 0.95rem; }
    .si-count { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.95rem; background: rgba(125,125,125,0.08); padding: 4px 12px; border-radius: 12px; }

    .setting-row { margin-bottom: 24px; }
    .setting-label { font-size: 0.85rem; font-weight: 700; color: var(--text-sub); text-transform: uppercase; margin-bottom: 8px; display: block; }
    .setting-input-grp { display: flex; gap: 12px; }
    .setting-input { flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--panel-border); background: rgba(125,125,125,0.05); color: var(--text-main); font-size: 0.95rem; font-weight: 600; outline: none; }
    .setting-input:focus { border-color: var(--accent-color); }
    
    .acc-btn { min-height: 44px; padding: 12px 24px; border-radius: 14px; font-weight: 700; cursor: pointer; border: none; font-size: 0.95rem;
               transition: background 0.2s, transform 0.1s; display: inline-flex; align-items: center; justify-content: center; }
    .acc-btn:active { transform: scale(0.98); }
    .acc-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 2px solid var(--accent-color); color: var(--accent-color); }
    .btn-outline:hover { background: rgba(255,45,85,0.1); }
    .btn-danger { background: rgba(255, 59, 48, 0.1); color: #ff3b30; border: 2px solid rgba(255, 59, 48, 0.3); }
    .btn-danger:hover { background: rgba(255, 59, 48, 0.2); }
    .acc-message { font-size: 0.85rem; margin-top: 10px; color: #34c759; font-weight: 600; }

    /* =========================================
       🎵 ボトムホットバー（ベース設定）
       ========================================= */
    .hotbar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 960px;
      border-radius: 24px;
      height: var(--hotbar-height);
      background: var(--panel-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      padding: 0 40px;
      justify-content: space-between;
      z-index: 900;
      flex-shrink: 0;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      transition: all 0.3s ease;
    }
    
    .hb-left { display: flex; align-items: center; gap: 16px; width: 25%; min-width: 200px; }
    .hb-art { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .hb-info { overflow: hidden; }
    .hb-title { font-weight: 700; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hb-artist { font-size: 0.85rem; color: var(--text-sub); font-weight: 500; }

    .hb-center { flex: 1; max-width: 600px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .hb-controls { display: flex; align-items: center; gap: 24px; }
    .ctrl-btn { background: none; border: none; color: var(--text-main); font-size: 1.3rem; cursor: pointer; transition: color 0.2s, transform 0.1s; }
    .ctrl-btn:hover { color: var(--accent-color); }
    .ctrl-btn.active { color: var(--accent-color); }
    .btn-play { font-size: 2.8rem; }
    .btn-play:hover { transform: scale(1.05); }
    
    .hb-progress { width: 100%; display: flex; align-items: center; gap: 12px; font-size: 0.8rem;
                   color: var(--text-sub); font-variant-numeric: tabular-nums; font-weight: 600; }
    .slider { flex: 1; -webkit-appearance: none; appearance: none; height: 6px;
              background: rgba(125,125,125,0.2); border-radius: 3px; outline: none; cursor: pointer; }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px;
                                    border-radius: 50%; background: var(--text-main); cursor: pointer; transition: transform 0.1s; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .slider::-webkit-slider-thumb:hover { transform: scale(1.2); background: var(--accent-color); }

    .hb-right { width: 25%; min-width: 280px; display: flex; justify-content: flex-end; align-items: center; gap: 24px; }
    
    .nav-tabs { display: flex; background: rgba(125,125,125,0.1); border-radius: 20px; padding: 4px; }
    .nav-tab { background: none; border: none; color: var(--text-sub);
               padding: 8px 18px; border-radius: 16px; font-size: 1.2rem; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; }
    .nav-tab:hover { color: var(--text-main); }
    .nav-tab.active { background: var(--panel-bg); color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    
    .toggle-lyrics-btn { background: none; border: none; color: var(--text-sub); font-size: 1.2rem; cursor: pointer; transition: color 0.2s; }
    .toggle-lyrics-btn.active { color: var(--accent-color); }

    /* 🏎️ 倍速・フェイクコントローラースタイル */
    .speed-btn { font-size: 0.85rem; font-weight: 800; background: rgba(125,125,125,0.15); padding: 5px 10px; border-radius: 10px; border: none; color: var(--text-main); cursor: pointer; }
    .speed-btn.active { background: var(--accent-color); color: white; }
    .fk-badge { font-size: 0.75rem; font-weight: 800; background: #ff9500; color: white; padding: 4px 8px; border-radius: 8px; display: none; }

    /* =========================================
       📱 画面が小さい時（iPad・スマホ）の設定
       ========================================= */
    @media (max-width: 1000px) {
      .hotbar { 
        padding: 0 20px; 
        bottom: 16px; 
        width: calc(100% - 24px); 
        border-radius: 20px; 
      }
      .hb-left { display: none; }
      .hb-right { min-width: auto; }
      .playlist-layout-v06, .playlist-layout-v06.lyrics-off { 
        grid-template-columns: 1fr; 
        overflow-y: auto; 
        height: auto; 
        padding-bottom: 140px; 
      }
      .pl-panel { min-height: 400px; margin-bottom: 20px; }
      main { padding: 20px; }
    }
  </style>
</head>
<body>

  <div class="bg-animate"></div>

  <div class="auth-container" id="authModal">
    <div class="auth-card">
      <div class="auth-logo"><i class="fa-solid fa-deck"></i><i class="fa-solid fa-music"></i></div>
      <h1 class="auth-title">SoundDeck</h1>
      <p class="auth-subtitle">Private Music Streaming Node</p>
      
      <div class="auth-group">
        <label>Access Key Identifier</label>
        <div class="auth-input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" class="auth-input" id="authId" placeholder="User ID" autocomplete="off">
        </div>
      </div>
      
      <div class="auth-group">
        <label>Passphrase</label>
        <div class="auth-input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" class="auth-input" id="authPass" placeholder="••••••••">
        </div>
      </div>
      
      <button class="auth-btn" id="btnAuth">Connect System</button>
    </div>
  </div>

  <div id="appWrap">
    <header>
      <div class="brand">
        <span class="brand-logo"><i class="fa-solid fa-compact-disc fa-spin" style="animation-duration: 4s;"></i></span>
        <h2 class="brand-title">SoundDeck</h2>
      </div>
      <div class="header-actions">
        <button class="hd-btn" id="btnThemeToggle" title="テーマ切り替え"><i class="fa-solid fa-moon"></i></button>
        <button class="hd-btn" id="btnLogout" title="ログアウト" style="color: #ff3b30;"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </header>

    <main>
      <div class="view-panel active" id="viewPlayer">
        <div class="playlist-layout-v06" id="playlistLayout">
          
          <div class="pl-panel">
            <div class="panel-header">
              <h3 class="panel-title"><i class="fa-solid fa-list-ul"></i> TRACKS</h3>
              <span class="panel-subtitle" id="trackCount">0 Songs Loaded</span>
            </div>
            <div class="track-list-scroll" id="trackContainer">
              </div>
          </div>

          <div class="pl-panel" id="lyricsPanel">
            <div class="panel-header">
              <h3 class="panel-title"><i class="fa-solid fa-microphone-lines"></i> TIME-SYNCED LYRICS</h3>
            </div>
            <div class="lyrics-container" id="lyricsContainer">
              <div class="lyrics-empty">
                <i class="fa-solid fa-quote-right"></i>
                <p>再生中の楽曲に歌詞データがありません</p>
              </div>
            </div>
          </div>

        </div>
      </div>

      <div class="view-panel" id="viewDashboard">
        <div class="dashboard-grid">
          
          <div class="db-panel">
            <div class="panel-header">
              <h3 class="panel-title"><i class="fa-solid fa-chart-line"></i> MOST PLAYED</h3>
            </div>
            <div class="stats-list" id="statsContainer">
              </div>
          </div>

          <div class="db-panel">
            <div class="panel-header">
              <h3 class="panel-title"><i class="fa-solid fa-sliders"></i> SETTINGS & SECURITY</h3>
            </div>
            
            <div class="setting-row">
              <label class="setting-label">パスワード変更</label>
              <div class="setting-input-grp">
                <input type="password" class="setting-input" id="newPassInput" placeholder="新しいパスワード（4文字以上）">
                <button class="acc-btn btn-outline" id="btnUpdatePass">更新</button>
              </div>
              <p class="acc-message" id="passMsg" style="display:none;"></p>
            </div>

            <div class="setting-row" style="margin-top: auto;">
              <label class="setting-label">ローカルストレージ</label>
              <button class="acc-btn btn-danger" id="btnResetData" style="width: 100%;">
                <i class="fa-solid fa-trash-can" style="margin-right: 8px;"></i> アプリデータの初期化
              </button>
            </div>
          </div>

        </div>
      </div>
    </main>

    <div class="hotbar">
      <div class="hb-left">
        <img src="logo.png" class="hb-art" id="hbArt" alt="Artwork">
        <div class="hb-info">
          <div class="hb-title" id="hbTitle">No Track</div>
          <div class="hb-artist" id="hbArtist">Standby Node</div>
        </div>
      </div>

      <div class="hb-center">
        <div class="hb-controls">
          <button class="ctrl-btn" id="btnShuffle" title="シャッフル"><i class="fa-solid fa-shuffle"></i></button>
          
          <button class="ctrl-btn" id="btnPrev"><i class="fa-solid fa-backward-step"></i></button>
          <button class="ctrl-btn btn-play" id="btnPlay"><i class="fa-solid fa-circle-play"></i></button>
          <button class="ctrl-btn" id="btnNext"><i class="fa-solid fa-forward-step"></i></button>
          
          <button class="ctrl-btn" id="btnRepeat" title="リピート"><i class="fa-solid fa-repeat"></i></button>
        </div>
        <div class="hb-progress">
          <span id="timeCurrent">0:00</span>
          <input type="range" class="slider" id="progressSlider" min="0" max="100" value="0">
          <span id="timeTotal">0:00</span>
        </div>
      </div>

      <div class="hb-right">
        <button class="speed-btn" id="btnSpeed" title="再生速度">1.0x</button>
        <span class="fk-badge" id="fkBadge">FAKE STREAMING</span>
        <button class="toggle-lyrics-btn active" id="btnToggleLyrics" title="歌詞表示トグル"><i class="fa-solid fa-comment-dots"></i></button>
        <div class="nav-tabs">
          <button class="nav-tab active" id="tabPlayer" title="Player"><i class="fa-solid fa-music"></i></button>
          <button class="nav-tab" id="tabDashboard" title="Dashboard"><i class="fa-solid fa-circle-user"></i></button>
        </div>
      </div>
    </div>
  </div>

  <audio id="mainAudio"></audio>

  <script>
    // ➕ 【サービスワーカーの登録処理】
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('サービスワーカーの登録に成功しました！', reg))
          .catch(err => console.log('サービスワーカーの登録に失敗しました...', err));
      });
    }

    // --- 🎵 楽曲データベース ---
    let songs = [
      { id: 0, title: "気まぐれロマンティック", artist: "いきものがかり", file: "song1.mp3", lyrics: "[00:00.00]気まぐれロマンティック\n[00:02.00]いきものがかり\n[00:13.00]ロマンティック 恋のアンテナは\n[00:16.20]嵐で折れてしまったの\n[00:19.50]見失ったあなたの街の灯を探すよ\n[00:26.00]ディスコミュニケーション 気がつけばほら\n[00:29.30]独りよがりのロンリネス\n[00:32.50]嘘でもいいから「愛してる」って言ってよ\n[00:39.00]ダーリン ダーリン 出逢った頃の\n[00:42.50]純情なハートに戻してよ\n[00:45.80]冷たいフリしてほんとはね 焦ってる\n[00:52.00]ダーリン ダーリン はぐらかさないで\n[00:55.50]ちゃんとあたしと向き合って\n[00:58.80]タカをくくったそのツラを 拝みたいのよ" },
      { id: 1, title: "1/3の純情な感情", artist: "SIAM SHADE", file: "song2.mp3", lyrics: "[00:00.00]1/3の純情な感情\n[00:04.00]SIAM SHADE\n[00:22.00]壊れるほど愛しても 1/3も伝わらない\n[00:28.00]純情な感情は空回り I love youさえ言えないでいる My heart" },
      { id: 2, title: "恋", artist: "星野源", file: "song3.mp3", lyrics: "[00:00.00]恋\n[00:03.00]星野 源\n[00:13.50]営みの 街が暮れたら色めき\n[00:19.00]風の街ろ 誰もいない気配だ\n[00:24.50]胸の中に あるもの\n[00:27.50]いつか見えなくなるもの\n[00:30.30]それは側にいること\n[00:33.20]いつも思い出せること\n[00:36.00]物心ついた時から\n[00:39.00]見むきもされない感情が\n[00:41.80]体の奥底で ずっと\n[00:44.80]跳ねているのを知っていた\n[00:47.30]距離のその先にあるものを\n[00:52.50]掲げた手を繋ぎ合おう\n[00:57.30]胸の中にあるもの\n[01:00.20]いつか見えなくなるもの\n[01:03.00]それは側にいること\n[01:05.80]いつも思い出せること" },
      { id: 3, title: "天体観測", artist: "BUMP OF CHICKEN", file: "song4.mp3", lyrics: "[00:00.00]天体観測\n[00:03.00]BUMP OF CHICKEN\n[00:17.50]午前二時 フミキリに 望遠鏡を担いでった\n[00:23.00]ベルトに結んだラジオ 雨は降らないらしい" },
      { id: 4, title: "シュガーソングとビターステップ", artist: "UNISON SQUARE GARDEN", file: "song5.mp3", lyrics: "[00:00.00]シュガーソングとビターステップ\n[00:02.50]UNISON SQUARE GARDEN\n[00:15.00]超天変地異みたいな狂騒にも慣れて\n[00:18.00]こんな日常を平和と見なす\n[00:20.50]ランブリングコースター 揺さぶられながら\n[00:23.50]見失えないものは何だ？" },
      { id: 5, title: "怪獣の花唄", artist: "Vaundy", file: "song6.mp3", lyrics: "[00:00.00]怪獣の花唄\n[00:03.00]Vaundy\n[00:16.00]思い出すのは君の歌\n[00:21.00]会話なんかは覚えちゃいないよ\n[00:26.50]思い出すのは君の顔\n[00:31.50]気付いた時にはもう遅いんだよ" },
      { id: 6, title: "新時代", artist: "Ado", file: "song7.mp3", lyrics: "[00:00.00]新時代 (ウタ from ONE PIECE FILM RED)\n[00:03.00]Ado\n[00:05.00]新時代はこの未来だ\n[00:09.50]世界中変えてしまえば 変えてしまえば" },
      { id: 7, title: "残酷な天使のテーゼ", artist: "高橋洋子", file: "song8.mp3", lyrics: "[00:00.00]残酷な天使のテーゼ\n[00:02.50]高橋洋子\n[00:04.00]残酷な天使のように 少年よ 神話になれ" },
      { id: 8, title: "ファンファーレ", artist: "sumika", file: "song9.mp3", lyrics: "[00:00.00]ファンファーレ\n[00:03.00]sumika\n[00:11.00]夜を越えて 闇を抜けて 迎えにゆくよ\n[00:16.50]心が叫ぶ先へ 向かうファンファーレ" },
      { id: 9, title: "青と夏", artist: "Mrs. GREEN APPLE", file: "song10.mp3", lyrics: "[00:00.00]青と夏\n[00:03.00]Mrs. GREEN APPLE\n[00:14.00]涼しい風が吹く 青空の匂い\n[00:19.50]今日も陽が昇る 終わらない夏の始まり" }
    ];

    // --- ⚙️ システムコア状態管理 ---
    let curIdx = 0;
    let isPlaying = false;
    let isLyOn = true;
    let userSession = "";
    let playSpeeds = [1.0, 1.5, 2.0];
    let curSpeedIdx = 0;
    let currentLyrics = [];

    // ➕ シャッフルとリピートの状態管理
    let isShuffle = false;
    let repeatMode = 0; // 0: オフ, 1: 全曲ループ, 2: 1曲リピート
    let shuffledIndices = [];

    // 🕵️ フェイクストリーミング（無音再生ダミー）システム
    let isFb = false; 
    let fkDuration = 240; 
    let fkCur = 0;
    let fkTimerId = null;

    // DOM要素群
    const authModal = document.getElementById('authModal');
    const authId = document.getElementById('authId');
    const authPass = document.getElementById('authPass');
    const btnAuth = document.getElementById('btnAuth');
    const appWrap = document.getElementById('appWrap');
    
    const trackContainer = document.getElementById('trackContainer');
    const trackCount = document.getElementById('trackCount');
    const audio = document.getElementById('mainAudio');
    
    const btnPlay = document.getElementById('btnPlay');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    
    // ➕ ボタン要素の追加
    const btnShuffle = document.getElementById('btnShuffle');
    const btnRepeat = document.getElementById('btnRepeat');
    
    const progressSlider = document.getElementById('progressSlider');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeTotal = document.getElementById('timeTotal');
    
    const hbArt = document.getElementById('hbArt');
    const hbTitle = document.getElementById('hbTitle');
    const hbArtist = document.getElementById('hbArtist');
    
    const btnSpeed = document.getElementById('btnSpeed');
    const fkBadge = document.getElementById('fkBadge');
    const btnToggleLyrics = document.getElementById('btnToggleLyrics');
    const lyricsPanel = document.getElementById('lyricsPanel');
    const playlistLayout = document.getElementById('playlistLayout');
    const lyricsContainer = document.getElementById('lyricsContainer');
    
    const tabPlayer = document.getElementById('tabPlayer');
    const tabDashboard = document.getElementById('tabDashboard');
    const viewPlayer = document.getElementById('viewPlayer');
    const viewDashboard = document.getElementById('viewDashboard');
    
    const statsContainer = document.getElementById('statsContainer');
    const newPassInput = document.getElementById('newPassInput');
    const btnUpdatePass = document.getElementById('btnUpdatePass');
    const passMsg = document.getElementById('passMsg');
    const btnResetData = document.getElementById('btnResetData');
    const btnLogout = document.getElementById('btnLogout');
    const btnThemeToggle = document.getElementById('btnThemeToggle');

    // 暗号化ダミー用セーフストレージ
    function safeGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
    function safeSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
    function safeRemove(k) { try { localStorage.removeItem(k); } catch(e) {} }

    // 🔒 暗号セッション認証認証ゲートウェイ
    btnAuth.onclick = () => {
      const id = authId.value.trim();
      const pass = authPass.value.trim();
      if(!id || !pass) { alert("IDとパスワードを入力してください。"); return; }
      
      const savedPass = safeGet(`sd_pass_${id}`);
      const validPass = savedPass ? savedPass : "1234";

      if(id === "admin" && pass === validPass) {
        userSession = id;
        safeSet('sd_session_user', id);
        initializeSystem();
      } else {
        alert("認証エラー: クレデンシャルが一致しません。");
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      const activeSession = safeGet('sd_session_user');
      if(activeSession) {
        userSession = activeSession;
        initializeSystem();
      }
    });

    function initializeSystem() {
      authModal.style.display = 'none';
      appWrap.style.display = 'flex';
      
      // 暗号化テーマ読み込み
      const t = safeGet('sd_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
      btnThemeToggle.innerHTML = t === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';

      buildPlaylist();
      loadTrack(0, false);
      renderStats();
    }

    // ⚡ テーマ切り替え
    btnThemeToggle.onclick = () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      safeSet('sd_theme', next);
      btnThemeToggle.innerHTML = next === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    };

    // 🎶 プレイリストファクトリ構築
    function buildPlaylist() {
      trackContainer.innerHTML = "";
      trackCount.textContent = `${songs.length} Songs Connected`;
      
      songs.forEach((song, index) => {
        const item = document.createElement('div');
        item.className = `track-item ${index === curIdx ? 'active' : ''}`;
        item.id = `track-${index}`;
        item.onclick = () => loadTrack(index, true);
        
        item.innerHTML = `
          <div class="ti-left">
            <div class="ti-index">${index + 1}</div>
            <div class="ti-meta">
              <div class="ti-title">${song.title}</div>
              <div class="ti-artist">${song.artist}</div>
            </div>
          </div>
          <div class="ti-right">
            <span class="ti-badge">ONLINE</span>
            <span class="ti-duration" id="dur-load-${index}">--:--</span>
          </div>
        `;
        trackContainer.appendChild(item);
        fetchDuration(song.file, index);
      });
    }

    function fetchDuration(url, idx) {
      const dAudio = new Audio();
      dAudio.src = url;
      dAudio.onloadedmetadata = () => {
        const target = document.getElementById(`dur-load-${idx}`);
        if(target) target.textContent = formatTime(dAudio.duration);
      };
      dAudio.onerror = () => {
        const target = document.getElementById(`dur-load-${idx}`);
        if(target) target.textContent = "4:00"; // フェイク用フォールバック固定値
      };
    }

    // 🔀 シャッフル機能の実装
    btnShuffle.onclick = () => {
      isShuffle = !isShuffle;
      btnShuffle.classList.toggle('active', isShuffle);
      
      if (isShuffle) {
        shuffledIndices = songs.map((_, i) => i);
        shuffledIndices = shuffledIndices.filter(i => i !== curIdx);
        for (let i = shuffledIndices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffledIndices[i], shuffledIndices[j]] = [shuffledIndices[j], shuffledIndices[i]];
        }
        shuffledIndices.unshift(curIdx);
      }
    };

    // 🔁 リピート機能の実装（3パターン切り替え）
    btnRepeat.onclick = () => {
      repeatMode = (repeatMode + 1) % 3;
      if (repeatMode === 0) {
        btnRepeat.className = "ctrl-btn";
        btnRepeat.innerHTML = '<i class="fa-solid fa-repeat"></i>';
      } else if (repeatMode === 1) {
        btnRepeat.className = "ctrl-btn active";
        btnRepeat.innerHTML = '<i class="fa-solid fa-repeat"></i>';
      } else if (repeatMode === 2) {
        btnRepeat.className = "ctrl-btn active";
        btnRepeat.innerHTML = '<i class="fa-solid fa-repeat-1"></i>';
      }
    };

    // 🚀 コアプレイヤーローディング制御
    function loadTrack(index, autoPlay) {
      stopFkTimer();
      document.querySelectorAll('.track-item').forEach(el => el.classList.remove('active'));
      
      curIdx = index;
      const activeItem = document.getElementById(`track-${curIdx}`);
      if(activeItem) {
        activeItem.classList.add('active');
        activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      const track = songs[curIdx];
      hbTitle.textContent = track.title;
      hbArtist.textContent = track.artist;
      
      parseLyrics(track.lyrics);

      isFb = false;
      fkBadge.style.display = "none";
      audio.src = track.file;
      audio.playbackRate = playSpeeds[curSpeedIdx];
      
      audio.load();

      audio.oncanplaythrough = () => {
        if(autoPlay) playTrack();
      };

      // 🛑 セキュリティ制限・サンドボックス環境下でのフェイクストリーミングモードへの自動フォールバック
      audio.onerror = () => {
        console.warn("Audio stream sandbox restricted. Entering Fake Streaming Engine.");
        isFb = true;
        fkBadge.style.display = "inline-block";
        fkCur = 0;
        
        const durEl = document.getElementById(`dur-load-${curIdx}`);
        if(durEl && durEl.textContent !== "--:--") {
          const parts = durEl.textContent.split(':');
          fkDuration = parseInt(parts[0]) * 60 + parseInt(parts[1]);
        } else {
          fkDuration = 240; 
        }
        
        timeTotal.textContent = formatTime(fkDuration);
        progressSlider.max = fkDuration;
        progressSlider.value = 0;
        
        if(autoPlay) playTrack();
      };

      if(autoPlay) incrementStats(track.title);
    }

    function playTrack() {
      isPlaying = true;
      setPlayingState(true);
      if(!isFb) {
        audio.play().catch(() => {
          isPlaying = false;
          setPlayingState(false);
        });
      } else {
        startFkTimer();
      }
    }

    function pauseTrack() {
      isPlaying = false;
      setPlayingState(false);
      if(!isFb) {
        audio.pause();
      } else {
        stopFkTimer();
      }
    }

    function setPlayingState(playing) {
      if(playing) {
        btnPlay.innerHTML = '<i class="fa-solid fa-circle-pause"></i>';
      } else {
        btnPlay.innerHTML = '<i class="fa-solid fa-circle-play"></i>';
      }
    }

    // ➕ 次の曲・前の曲・曲終了時のロジック修正（シャッフル・ループ対応版）
    function prevTrack() {
      if (isShuffle && shuffledIndices.length > 0) {
        let sIdx = shuffledIndices.indexOf(curIdx);
        sIdx = sIdx - 1;
        if (sIdx < 0) sIdx = shuffledIndices.length - 1;
        loadTrack(shuffledIndices[sIdx], true);
      } else {
        let i = curIdx - 1;
        if(i < 0) i = songs.length - 1; 
        loadTrack(i, true);
      }
    }

    function nextTrack() {
      if (isShuffle && shuffledIndices.length > 0) {
        let sIdx = shuffledIndices.indexOf(curIdx);
        sIdx = sIdx + 1;
        if (sIdx >= shuffledIndices.length) {
          btnShuffle.click(); btnShuffle.click(); 
          sIdx = 0;
        }
        loadTrack(shuffledIndices[sIdx], true);
      } else {
        let i = curIdx + 1; 
        if(i >= songs.length) i = 0;
        loadTrack(i, true);
      }
    }
    
    audio.onended = () => {
      if (!isFb) {
        if (repeatMode === 2) {
          loadTrack(curIdx, true);
        } else if (repeatMode === 1) {
          nextTrack();
        } else {
          if (isShuffle) {
            let sIdx = shuffledIndices.indexOf(curIdx);
            if (sIdx === shuffledIndices.length - 1) {
              setPlayingState(false);
            } else {
              nextTrack();
            }
          } else {
            if (curIdx === songs.length - 1) {
              setPlayingState(false);
            } else {
              nextTrack();
            }
          }
        }
      }
    };

    btnPlay.onclick = () => { if(isPlaying) pauseTrack(); else playTrack(); };
    btnPrev.onclick = () => prevTrack();
    btnNext.onclick = () => nextTrack();

    // 再生速度制御
    btnSpeed.onclick = () => {
      curSpeedIdx = (curSpeedIdx + 1) % playSpeeds.length;
      const sp = playSpeeds[curSpeedIdx];
      btnSpeed.textContent = `${sp.toFixed(1)}x`;
      if(!isFb) audio.playbackRate = sp;
    };

    // タイムアプデ
    audio.ontimeupdate = () => {
      if(!isFb && !progressSlider.matches(':active')) {
        progressSlider.max = audio.duration || 100;
        progressSlider.value = audio.currentTime;
        timeCurrent.textContent = formatTime(audio.currentTime);
        timeTotal.textContent = formatTime(audio.duration || 0);
        syncLyrics(audio.currentTime);
      }
    };

    progressSlider.oninput = () => {
      const targetTime = parseFloat(progressSlider.value);
      if(!isFb) {
        audio.currentTime = targetTime;
        timeCurrent.textContent = formatTime(targetTime);
      } else {
        fkCur = targetTime;
        timeCurrent.textContent = formatTime(fkCur);
        syncLyrics(fkCur);
      }
    };

    function formatTime(secs) {
      if(isNaN(secs)) return "0:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // 🎤 LRCリリックアナライザー解析・同期
    function parseLyrics(lrcText) {
      currentLyrics = [];
      lyricsContainer.innerHTML = "";
      if(!lrcText) {
        lyricsContainer.innerHTML = '<div class="lyrics-empty"><i class="fa-solid fa-quote-right"></i><p>再生中の楽曲に歌詞データがありません</p></div>';
        return;
      }
      
      const lines = lrcText.split('\n');
      const timeReg = /\[(\d{2}):(\d{2})\.(\d{2})\]/;
      
      lines.forEach(line => {
        const match = timeReg.exec(line);
        if(match) {
          const min = parseInt(match[1]);
          const sec = parseInt(match[2]);
          const ms = parseInt(match[3]);
          const time = min * 60 + sec + ms / 100;
          const text = line.replace(timeReg, '').trim();
          if(text) currentLyrics.push({ time, text });
        }
      });

      if(currentLyrics.length === 0) {
        lyricsContainer.innerHTML = '<div class="lyrics-empty"><i class="fa-solid fa-quote-right"></i><p>歌詞の解析フォーマットが正しくありません</p></div>';
        return;
      }

      currentLyrics.forEach((ly, i) => {
        const lineEl = document.createElement('div');
        lineEl.className = 'lyric-line';
        lineEl.id = `lyric-line-${i}`;
        lineEl.textContent = ly.text;
        lineEl.onclick = () => {
          if(!isFb) audio.currentTime = ly.time;
          else { fkCur = ly.time; progressSlider.value = fkCur; timeCurrent.textContent = formatTime(fkCur); }
        };
        lyricsContainer.appendChild(lineEl);
      });
    }

    function syncLyrics(time) {
      if(currentLyrics.length === 0) return;
      let activeIdx = -1;
      for(let i = 0; i < currentLyrics.length; i++) {
        if(time >= currentLyrics[i].time) {
          activeIdx = i;
        } else {
          break;
        }
      }
      
      if(activeIdx !== -1) {
        document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
        const curLine = document.getElementById(`lyric-line-${activeIdx}`);
        if(curLine && !curLine.classList.contains('active')) {
          curLine.classList.add('active');
          const containerHeight = lyricsContainer.clientHeight;
          const lineOffset = curLine.offsetTop;
          const lineHeight = curLine.clientHeight;
          lyricsContainer.scrollTop = lineOffset - (containerHeight / 2) + (lineHeight / 2);
        }
      }
    }

    // 歌詞ビュー表示トグル切替
    btnToggleLyrics.onclick = () => {
      isLyOn = !isLyOn;
      btnToggleLyrics.classList.toggle('active', isLyOn);
      if(isLyOn) {
        lyricsPanel.style.display = "flex";
        playlistLayout.classList.remove('lyrics-off');
      } else {
        lyricsPanel.style.display = "none";
        playlistLayout.classList.add('lyrics-off');
      }
    };

    // 🗺️ グローバルビュー切り替えナビゲーション
    tabPlayer.onclick = () => {
      tabDashboard.classList.remove('active'); tabPlayer.classList.add('active');
      viewDashboard.style.display = 'none'; viewPlayer.style.display = 'block';
    };
    tabDashboard.onclick = () => {
      tabPlayer.classList.remove('active'); tabDashboard.classList.add('active');
      viewPlayer.style.display = 'none'; viewDashboard.style.display = 'block';
      renderStats();
    };

    // 📊 再生統計エンジン
    function incrementStats(title) {
      let stats = JSON.parse(safeGet(`sd_stats_${userSession}`)) || {};
      stats[title] = (stats[title] || 0) + 1;
      safeSet(`sd_stats_${userSession}`, JSON.stringify(stats));
    }

    function renderStats() {
      statsContainer.innerHTML = "";
      let stats = JSON.parse(safeGet(`sd_stats_${userSession}`)) || {};
      
      let sorted = Object.entries(stats).sort((a,b) => b[1] - a[1]);
      if(sorted.length === 0) {
        statsContainer.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-sub); font-weight:600;">データがありません。楽曲を再生するとここにランキングが形成されます。</div>';
        return;
      }

      sorted.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = "stats-item";
        row.innerHTML = `
          <div class="si-info">
            <div class="si-rank">${idx + 1}</div>
            <div class="si-title">${item[0]}</div>
          </div>
          <div class="si-count">${item[1]} 回再生</div>
        `;
        statsContainer.appendChild(row);
      });
    }

    // 🕵️ フェイクストリーミングタイマー実装
    function startFkTimer() {
      stopFkTimer();
      const sp = playSpeeds[curSpeedIdx];
      fkTimerId = setInterval(() => {
        fkCur += (0.1 * sp);
        if(fkCur >= fkDuration) {
          fkCur = fkDuration;
          stopFkTimer();
          isPlaying = false;
          setPlayingState(false);
          // 曲が終了した時のリピート・シャッフル判定
          if (repeatMode === 2) {
            loadTrack(curIdx, true);
          } else if (repeatMode === 1) {
            nextTrack();
          } else {
            if (isShuffle) {
              let sIdx = shuffledIndices.indexOf(curIdx);
              if (sIdx === shuffledIndices.length - 1) {
                setPlayingState(false);
              } else {
                nextTrack();
              }
            } else {
              if (curIdx === songs.length - 1) {
                setPlayingState(false);
              } else {
                nextTrack();
              }
            }
          }
        }
        if(!progressSlider.matches(':active')) {
          progressSlider.value = fkCur;
          timeCurrent.textContent = formatTime(fkCur);
        }
        syncLyrics(fkCur);
      }, 100);
    }

    function stopFkTimer() { if(fkTimerId) { clearInterval(fkTimerId); fkTimerId = null; } }

    // 設定管理
    btnUpdatePass.onclick = () => {
      const np = newPassInput.value.trim();
      if(np.length < 4) { alert("パスワードは4文字以上で入力してください。"); return; }
      safeSet(`sd_pass_${userSession}`, np);
      passMsg.style.display = "block";
      passMsg.textContent = "パスワードを更新しました。";
      newPassInput.value = "";
      setTimeout(() => passMsg.style.display="none", 3000);
    };

    btnLogout.onclick = () => {
      safeRemove('sd_session_user'); audio.pause(); stopFkTimer(); setPlayingState(false);
      appWrap.style.display = 'none'; authModal.style.display = 'flex';
      authId.value = ""; authPass.value = "";
    };

    btnResetData.onclick = () => {
      if(confirm('これまでの再生回数ランキングやカスタムパスワードがすべて削除されます。初期化しますか？')) {
        safeRemove(`sd_stats_${userSession}`); safeRemove(`sd_pass_${userSession}`);
        alert('データを初期化しました。一度ログアウトします。'); btnLogout.click();
      }
    };

    // iOS/iPadOS用リモコン連動
    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => playTrack());
      navigator.mediaSession.setActionHandler('pause', () => pauseTrack());
      navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
      navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
    }
  </script>
</body>
</html>
