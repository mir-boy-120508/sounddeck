<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SoundDeck v3.0</title>

  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" href="logo.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Firebase (Authentication + Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg-main: #e2e8f0;
      --panel-bg: rgba(255, 255, 255, 0.75);
      --panel-border: rgba(255, 255, 255, 0.8);
      --bar-glass-bg: rgba(255, 255, 255, 0.45);
      --bar-glass-border: rgba(255, 255, 255, 0.6);
      --accent-color: #ff2d55;
      --text-main: #000000;
      --text-sub: #8e8e93;
      --btn-main-bg: #1c1c1e;
      --btn-main-text: white;
      --item-hover: rgba(0, 0, 0, 0.04);
      --item-active: rgba(255, 45, 85, 0.08);
      --lyrics-dim: rgba(0, 0, 0, 0.25);
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      --glass-blur: blur(40px);
      --hotbar-height: 100px;
      --header-height: 80px;
    }

    html[data-theme="dark"] {
      --bg-main: #030712;
      --panel-bg: rgba(28, 28, 30, 0.65);
      --panel-border: rgba(255, 255, 255, 0.1);
      --bar-glass-bg: rgba(20, 20, 25, 0.4);
      --bar-glass-border: rgba(255, 255, 255, 0.08);
      --accent-color: #ff2d55;
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --btn-main-bg: #ffffff;
      --btn-main-text: #000000;
      --item-hover: rgba(255, 255, 255, 0.06);
      --item-active: rgba(255, 45, 85, 0.15);
      --lyrics-dim: rgba(255, 255, 255, 0.3);
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-main) !important;
      background-image: none !important;
      color: var(--text-main);
      height: 100vh; overflow: hidden; display: flex; flex-direction: column;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* 背景アニメーション（画像ではなく元の綺麗なグラデーション） */
    .bg-animate {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;
      background: radial-gradient(circle at 80% 20%, rgba(255, 45, 85, 0.15), transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(0, 122, 255, 0.12), transparent 50%) !important;
    }

    #appWrap { display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; position: relative; z-index: 1; }

    header {
      height: var(--header-height); padding: 0 40px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .brand-container { display: flex; align-items: center; gap: 12px; }
    
    /* ロゴ画像のサイズを限定し画面全体に広がらないようガード */
    .brand-logo { 
      width: 36px !important; 
      height: 36px !important; 
      max-width: 36px !important;
      max-height: 36px !important;
      border-radius: 8px; 
      object-fit: contain; 
      flex-shrink: 0;
      display: block;
    }
    
    .brand-title { font-size: 1.4rem; font-weight: 800; }
    
    .btn-theme-circle {
      width: 50px; height: 50px; border-radius: 50%; background: var(--panel-bg);
      border: 1px solid var(--panel-border); color: var(--text-main); font-size: 1.35rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    main { flex: 1; padding: 0 40px 140px 40px; display: flex; flex-direction: column; overflow: hidden; }
    
    .view-tab { display: none; width: 100%; height: 100%; flex-direction: column; overflow: hidden; }
    .view-tab.active { display: flex; }
    #tab-home, #tab-search, #tab-settings { overflow-y: auto; padding-bottom: 40px; }

    .section-title { font-size: 1.8rem; font-weight: 800; margin: 10px 0 24px 0; }

    .search-bar-container { position: relative; max-width: 600px; margin-bottom: 30px; display: flex; gap: 10px; }
    .search-input { flex: 1; padding: 18px 20px 18px 50px; font-size: 1.1rem; border-radius: 20px; border: 1px solid var(--panel-border); background: var(--panel-bg); color: var(--text-main); backdrop-filter: var(--glass-blur); box-shadow: var(--shadow); outline: none; }
    .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-sub); font-size: 1.2rem; }
    .btn-search { padding: 0 24px; border-radius: 20px; border: none; background: var(--accent-color); color: white; font-weight: 700; cursor: pointer; }

    /* カードレイアウト */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 20px; padding: 18px; display: flex; align-items: flex-start; gap: 16px; cursor: pointer; transition: transform 0.2s; height: auto; min-height: 100px; position: relative; }
    .card:hover { transform: translateY(-4px); }
    .card-img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
    .card-info { flex: 1; min-width: 0; }
    .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 6px; white-space: normal; word-break: break-word; line-height: 1.35; }
    .card-desc { font-size: 0.85rem; color: var(--text-sub); white-space: normal; word-break: break-word; line-height: 1.3; }

    .playlist-layout-v06 { display: grid; grid-template-columns: 1.2fr 1.3fr 1fr; gap: 30px; height: 100%; width: 100%; }
    .pl-panel {
      background: var(--panel-bg); backdrop-filter: var(--glass-blur);
      border: 1px solid var(--panel-border); border-radius: 28px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; overflow: hidden; padding: 30px; position: relative;
    }

    /* YouTubeプレイヤー埋め込みコンテナ */
    .yt-player-wrapper {
      width: 100%; aspect-ratio: 16/9; border-radius: 20px; overflow: hidden;
      background: #000; box-shadow: 0 10px 25px rgba(0,0,0,0.2); margin-bottom: 20px;
    }
    #ytPlayer { width: 100%; height: 100%; }

    .art-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; word-break: break-word; }
    .art-artist { font-size: 1rem; color: var(--accent-color); font-weight: 600; word-break: break-word; }

    /* AI歌詞ヘッダー＆ボタン */
    .lyrics-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .btn-ai-lyrics {
      background: linear-gradient(135deg, #ff2d55, #7000ff); color: white; border: none;
      padding: 6px 14px; border-radius: 100px; font-size: 0.8rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: 6px; transition: opacity 0.2s;
    }
    .btn-ai-lyrics:hover { opacity: 0.9; }

    .lyrics-box {
      flex: 1;
      overflow-y: auto;
      padding: 35% 8%;
      text-align: center;
      scroll-behavior: smooth;
      mask-image: linear-gradient(to bottom, transparent, black 18%, black 82%, transparent);
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 18%, black 82%, transparent);
    }
    .l-line {
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.6;
      color: var(--lyrics-dim);
      margin-bottom: 22px;
      cursor: pointer;
      transition: color 0.4s ease, transform 0.4s ease, filter 0.4s ease;
      word-break: break-word;
    }
    .l-line:hover { color: var(--text-main); }
    .l-line.active {
      color: var(--accent-color);
      transform: scale(1.08);
    }

    .track-list { list-style: none; overflow-y: auto; flex: 1; margin-top: 15px; }
    .track-row { display: flex; align-items: center; padding: 12px 16px; border-radius: 16px; cursor: pointer; margin-bottom: 6px; position: relative; }
    .track-row:hover { background: var(--item-hover); }
    .track-row.active { background: var(--item-active); }
    .t-title { font-weight: 700; word-break: break-word; }
    .t-artist { font-size: 0.85rem; color: var(--text-sub); word-break: break-word; }

    /* 削除ボタン */
    .btn-del-track {
      margin-left: auto; background: none; border: none; color: var(--text-sub);
      font-size: 1rem; cursor: pointer; padding: 6px 10px; border-radius: 8px;
      transition: all 0.2s; flex-shrink: 0;
    }
    .btn-del-track:hover { color: var(--accent-color); background: rgba(255, 45, 85, 0.1); }

    /* ボトムホットバー */
    .hotbar {
      position: fixed; 
      bottom: 16px; 
      left: 50%; 
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 1240px; 
      border-radius: 24px;
      border: 1px solid var(--bar-glass-border); 
      height: var(--hotbar-height); 
      background: var(--bar-glass-bg);
      backdrop-filter: var(--glass-blur); 
      display: flex; 
      align-items: center; 
      padding: 0 24px; 
      justify-content: space-between; 
      z-index: 900;
      gap: 12px;
      box-sizing: border-box;
    }
    .hb-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; max-width: 260px; }
    .hb-art { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
    .hb-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.95rem; }
    .hb-artist { font-size: 0.8rem; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .hb-center { flex: 2; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .hb-controls { display: flex; align-items: center; gap: 12px; }
    .ctrl-btn { background: none; border: none; color: var(--text-main); font-size: 1.3rem; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    .ctrl-btn.btn-play { font-size: 2.8rem; width: 50px; height: 50px; }
    .hb-progress { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 0.8rem; }
    .slider { -webkit-appearance: none; appearance: none; width: 100%; height: 5px; border-radius: 3px; background: rgba(125,125,125,0.2); outline: none; cursor: pointer; }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--text-main); }

    .hb-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
    .nav-tabs { background: rgba(125,125,125,0.08); padding: 3px; border-radius: 100px; display: flex; gap: 4px; }
    .nav-tab { background: none; border: none; color: var(--text-sub); width: 40px; height: 36px; border-radius: 100px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: all 0.2s; }
    .nav-tab.active { background: var(--panel-bg); color: var(--accent-color); width: 52px; }

    @media (max-width: 900px) {
      main { padding: 0 20px 140px 20px; }
      header { padding: 0 20px; }
      .playlist-layout-v06 {
        grid-template-columns: 1fr;
        overflow-y: auto;
        padding-bottom: 20px;
      }
    }

    @media (max-width: 768px) {
      :root {
        --hotbar-height: 84px;
      }
      .hotbar {
        padding: 0 12px;
        bottom: 12px;
        width: calc(100% - 20px);
      }
      .hb-art { width: 42px; height: 42px; }
      .hb-title { font-size: 0.85rem; }
      .hb-artist { font-size: 0.75rem; }
      .hb-right { display: flex; }
      .nav-tab { width: 34px; height: 32px; font-size: 0.95rem; }
      .nav-tab.active { width: 42px; }
      #timeCurrent, #timeDuration { font-size: 0.7rem; }
    }

    @media (max-width: 480px) {
      .hb-left { max-width: 120px; }
      .hb-artist { display: none; }
      .hb-progress span { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

  <div class="bg-animate"></div>

  <div id="appWrap">
    <header>
      <div class="brand-container">
        <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        <span class="brand-title">SoundDeck</span>
      </div>
      <button id="btnTheme" class="btn-theme-circle"><i class="fa-solid fa-moon"></i></button>
    </header>

    <main>
      <div id="tab-home" class="view-tab active">
        <h2 class="section-title">Home</h2>
        
        <div id="aiRecommendationSection" style="margin-bottom: 30px;">
          <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-wand-magic-sparkles" style="color: var(--accent-color);"></i>
            <span id="aiRecTitle">AIのおすすめ</span>
          </h3>
          <div class="card-grid" id="aiRecGrid"></div>
        </div>

        <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 12px;">マイプレイリスト</h3>
        <div class="card-grid" id="homeQuickGrid"></div>
      </div>

      <div id="tab-search" class="view-tab">
        <h2 class="section-title">曲を探す</h2>
        <div class="search-bar-container">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="曲名、アーティスト名...">
          <button id="btnSearch" class="btn-search">検索</button>
        </div>
        <div class="card-grid" id="searchResultGrid"></div>

        <div id="searchRecSection" style="margin-top:20px;">
          <button id="btnSearchRec" class="btn-search" style="background:transparent;border:1px solid var(--accent-color);color:var(--accent-color);">
            <i class="fa-solid fa-wand-magic-sparkles"></i> この検索に関連するAIおすすめを見る
          </button>
          <div class="card-grid" id="searchRecGrid" style="margin-top:16px;"></div>
        </div>
      </div>

      <div id="tab-playlist" class="view-tab">
        <div class="playlist-layout-v06">
          <div class="pl-panel">
            <div class="yt-player-wrapper">
              <div id="ytPlayer"></div>
            </div>
            <div class="art-info">
              <div class="art-title" id="panelTitle">曲を選択してください</div>
              <div class="art-artist" id="panelArtist">---</div>
            </div>
          </div>

          <div class="pl-panel" id="lyricsPanel">
            <div class="lyrics-header">
              <span style="font-size:0.85rem; font-weight:700; color:var(--text-sub);">LYRICS SYNC</span>
              <button class="btn-ai-lyrics" id="btnAiLyrics"><i class="fa-solid fa-wand-magic-sparkles"></i> AIで歌詞を取得</button>
            </div>
            <div class="lyrics-box" id="lyricsBox"></div>
          </div>

          <div class="pl-panel">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:0.85rem; font-weight:700; color:var(--text-sub);">PLAYLIST TRACKS</span>
              <button onclick="clearPlaylist()" style="background:none; border:none; color:var(--text-sub); font-size:0.75rem; cursor:pointer;"><i class="fa-solid fa-trash"></i> 全削除</button>
            </div>
            <div class="track-list" id="trackList"></div>
          </div>
        </div>
      </div>

      <div id="tab-settings" class="view-tab">
        <h2 class="section-title">Settings</h2>
        <p>SoundDeck v3.0</p><p style="color:var(--text-sub);font-size:.85rem;margin-top:8px;">サーバーAPI: <input id="serverApi" value="http://localhost:3000" style="padding:8px 10px;border-radius:10px;border:1px solid var(--panel-border);background:var(--panel-bg);color:var(--text-main);width:min(420px,100%);"></p>

        <div style="margin-top:28px;padding:20px;border:1px solid var(--panel-border);border-radius:16px;max-width:420px;">
          <h3 style="font-size:1.05rem;font-weight:700;margin-bottom:6px;">アカウント</h3>
          <p style="color:var(--text-sub);font-size:.8rem;margin-bottom:16px;">
            ログインすると、プレイリスト・お気に入り・オフライン保存・イコライザーなどの機能が使え、
            どの曲をライブラリに入れたかが端末間で同期されます。ログインしなくても検索・再生は可能です。
          </p>

          <div id="authLoggedOut">
            <input id="authEmail" type="email" placeholder="メールアドレス" style="width:100%;padding:10px 12px;margin-bottom:8px;border-radius:10px;border:1px solid var(--panel-border);background:var(--panel-bg);color:var(--text-main);">
            <input id="authPassword" type="password" placeholder="パスワード(6文字以上)" style="width:100%;padding:10px 12px;margin-bottom:12px;border-radius:10px;border:1px solid var(--panel-border);background:var(--panel-bg);color:var(--text-main);">
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button id="btnLogin" class="btn-search" style="flex:1;">ログイン</button>
              <button id="btnSignup" class="btn-search" style="flex:1;background:transparent;border:1px solid var(--accent-color);color:var(--accent-color);">新規登録</button>
            </div>
            <p id="authError" style="color:var(--accent-color);font-size:.78rem;margin-top:10px;"></p>
          </div>

          <div id="authLoggedIn" style="display:none;">
            <p style="font-size:.9rem;margin-bottom:12px;">ログイン中: <b id="authUserEmail">-</b></p>
            <button id="btnLogout" class="btn-search" style="background:transparent;border:1px solid var(--panel-border);color:var(--text-main);">ログアウト</button>
          </div>
        </div>

        <div style="margin-top:20px;padding:20px;border:1px solid var(--panel-border);border-radius:16px;max-width:420px;">
          <h3 style="font-size:1.05rem;font-weight:700;margin-bottom:6px;">イコライザー</h3>
          <p style="color:var(--text-sub);font-size:.8rem;margin-bottom:16px;">ログイン中のみ調整できます。</p>

          <div style="margin-bottom:14px;">
            <label style="font-size:.8rem;display:flex;justify-content:space-between;">低音(Bass) <span id="eqBassVal">0dB</span></label>
            <input type="range" id="eqBass" min="-15" max="15" value="0" step="1" style="width:100%;">
          </div>
          <div style="margin-bottom:14px;">
            <label style="font-size:.8rem;display:flex;justify-content:space-between;">中音(Mid) <span id="eqMidVal">0dB</span></label>
            <input type="range" id="eqMid" min="-15" max="15" value="0" step="1" style="width:100%;">
          </div>
          <div>
            <label style="font-size:.8rem;display:flex;justify-content:space-between;">高音(Treble) <span id="eqTrebleVal">0dB</span></label>
            <input type="range" id="eqTreble" min="-15" max="15" value="0" step="1" style="width:100%;">
          </div>
        </div>
      </div>
    </main>

    <div class="hotbar">
      <div class="hb-left">
        <img src="https://picsum.photos/id/145/200/200" id="barCover" class="hb-art">
        <div style="min-width:0;">
          <div class="hb-title" id="barTitle">---</div>
          <div class="hb-artist" id="barArtist">---</div>
        </div>
      </div>

      <div class="hb-center">
        <div class="hb-controls">
          <button class="ctrl-btn" id="btnShuffle" title="シャッフル"><i class="fa-solid fa-shuffle"></i></button>
          <button class="ctrl-btn" id="btnPrev"><i class="fa-solid fa-backward-step"></i></button>
          <button class="ctrl-btn btn-play" id="btnPlay"><i class="fa-solid fa-circle-play"></i></button>
          <button class="ctrl-btn" id="btnNext"><i class="fa-solid fa-forward-step"></i></button>
          <button class="ctrl-btn" id="btnRepeat" title="リピート"><i class="fa-solid fa-repeat"></i></button>
        </div>
        <div class="hb-progress">
          <span id="timeCurrent">0:00</span>
          <input type="range" id="progressSlider" class="slider" min="0" value="0" step="0.1">
          <span id="timeDuration">0:00</span>
        </div>
      </div>

      <div class="hb-right">
        <div class="nav-tabs">
          <button class="nav-tab active" data-tab="home"><i class="fa-solid fa-house"></i></button>
          <button class="nav-tab" data-tab="search"><i class="fa-solid fa-magnifying-glass"></i></button>
          <button class="nav-tab" data-tab="playlist"><i class="fa-solid fa-music"></i></button>
          <button class="nav-tab" data-tab="settings"><i class="fa-solid fa-gear"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /*
      SoundDeck v3
      - 元のUI/CSSは変更しません。
      - 検索: 公開されているPiped API系ミラーへ直接問い合わせる方式（solOS版と同じ方式）
      - 音源: 検索結果から選んだ曲は、SoundDeckサーバー(apiBase())の /api/stream/:id を
              serverUrlとして組み立て、これまで通りサーバー経由（yt-dlpキャッシュ）で再生する
      - オフライン: IndexedDB に音源Blobを保存
      - Firebaseは後からAuthentication/Firestoreを接続できます。
    */

    let songs = JSON.parse(localStorage.getItem('sounddeck_playlist') || '[]');
    let currentTrackIndex = -1;
    let audio = new Audio();

    // ---- イコライザー(Web Audio API) ----
    let audioCtx = null;
    let eqBassFilter, eqMidFilter, eqTrebleFilter;

    function setupAudioGraph() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      eqBassFilter = audioCtx.createBiquadFilter();

      eqBassFilter.frequency.value = 200;

      eqMidFilter = audioCtx.createBiquadFilter();
      eqMidFilter.type = 'peaking';
      eqMidFilter.frequency.value = 1000;
      eqMidFilter.Q.value = 1;

      eqTrebleFilter = audioCtx.createBiquadFilter();
      eqTrebleFilter.type = 'highshelf';
      eqTrebleFilter.frequency.value = 3000;

      source.connect(eqBassFilter);
      eqBassFilter.connect(eqMidFilter);
      eqMidFilter.connect(eqTrebleFilter);
      eqTrebleFilter.connect(audioCtx.destination);
    }

    function formatTime(secs) {

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(STORE)) {
            req.result.createObjectStore(STORE, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getLocalTrack(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction(STORE, 'readonly').objectStore(STORE).get(id);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function getAllLocalTracks() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction(STORE, 'readonly').objectStore(STORE).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveLocalTrack(track, blob) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put({
          id: track.id,
          title: track.title,
          artist: track.artist,
          cover: track.cover,
          blob,
          savedAt: Date.now()
        });
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getLocalBytes() {
      const tracks = await getAllLocalTracks();
      return tracks.reduce((sum, t) => sum + (t.blob?.size || 0), 0);
    }

    async function removeLocalTrack(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

      const status = document.getElementById('searchResultGrid');

        const res = await fetch(track.serverUrl);
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const blob = await res.blob();
        const used = await getLocalBytes();

        if (used + blob.size > LOCAL_LIMIT) {
          alert('端末側の500MB無料保存容量を超えるため保存できません。');
          renderSearchResults(window._searchResults || []);
          return;

        await saveLocalTrack(track, blob);
        updateLocalStorageFlag(track.id, true);
        renderTrackList();
        renderHomeGrid();
        renderSearchResults(window._searchResults || []);
        alert('この端末に保存しました。オフライン再生できます。');

    async function searchServer(query) {
      const grid = document.getElementById('searchResultGrid');
      grid.innerHTML = '<p style="padding:20px;">YouTubeから曲を検索中...</p>';

      // solOS版と同じ方式: 公開されているPiped APIミラーへ直接問い合わせる。
      // 複数のミラーを順番に試し、最初に成功したものを使う。
      const apiEndpoints = [
        `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query)}&filter=music_songs`,
        `https://api.piped.private.coffee/search?q=${encodeURIComponent(query)}&filter=music_songs`
      ];

      let success = false;

      for (const endpoint of apiEndpoints) {
        try {
          const res = await fetch(endpoint);
          if (!res.ok) continue;

          const data = await res.json();
          const items = data.items || data;
          if (!items || items.length === 0) continue;

          const videos = items.filter(item => item.type === 'stream' || item.url);
          if (videos.length === 0) continue;

          // 検索結果を、これまで通りSoundDeckサーバー経由で再生・保存できる形に変換する。
          // 実際の音源取得・キャッシュは変わらずサーバー(apiBase())の /api/stream/:id が担当する。
          window._searchResults = videos.slice(0, 20).map(item => {
            const videoId = item.url ? item.url.replace('/watch?v=', '') : item.id;
            return {
              id: videoId,
              title: item.title || 'Unknown Title',
              artist: item.uploaderName || item.artist || 'Unknown Artist',
              cover: item.thumbnail || `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`,
              serverUrl: `${apiBase()}/api/stream/${videoId}`
            };
          });

          renderSearchResults(window._searchResults);
          success = true;
          break;
        } catch (err) {
          console.warn('Search API Error:', err);
        }
      }

      if (!success) {
        grid.innerHTML = '<p style="padding:20px;">検索結果を取得できませんでした。別のキーワードでお試しください。</p>';
      }
    }

    /**
     * 検索履歴をもとに、SoundDeckサーバー(apiBase())の /api/recommend にAIおすすめをリクエストする。
     * AIが返してきた「曲名・アーティスト名」は、そのままでは再生できないので、
     * solOS方式のPiped検索に1件ずつかけて、実際に再生可能な動画IDに変換してからカード表示する。
     */
    async function loadAiRecommendations() {
      const grid = document.getElementById('aiRecGrid');
      const titleEl = document.getElementById('aiRecTitle');
      if (!grid) return;

      if (!searchHistory.length) {
        titleEl.innerText = 'AIのおすすめ';
        grid.innerHTML = '<p style="color:var(--text-sub); grid-column: 1/-1;">曲を1回以上検索すると、AIが検索履歴からおすすめ曲を提案します。</p>';
        return;
      }

      titleEl.innerText = 'AIのおすすめ';
      grid.innerHTML = '<p style="color:var(--text-sub); grid-column: 1/-1;">✨ AIがおすすめを考え中...</p>';

      try {
        const res = await fetch(`${apiBase()}/api/recommend`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history: searchHistory.slice(0, 10) })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        const picks = Array.isArray(data.recommendations) ? data.recommendations : [];

        if (!picks.length) {
          grid.innerHTML = '<p style="color:var(--text-sub); grid-column: 1/-1;">おすすめを取得できませんでした。</p>';
          return;
        }

        const found = await Promise.all(
          picks.map(pick => findOneTrack(`${pick.title} ${pick.artist || ''}`.trim()))
        );
        window._aiRecResults = found.filter(Boolean);

        if (!window._aiRecResults.length) {
          grid.innerHTML = '<p style="color:var(--text-sub); grid-column: 1/-1;">おすすめ曲の音源が見つかりませんでした。</p>';
          return;
        }

        grid.innerHTML = window._aiRecResults.map((item, idx) => `
          <div class="card">
            <img src="${escapeText(item.cover || '')}" class="card-img">
            <div class="card-info">
              <div class="card-title">${escapeText(item.title)}</div>
              <div class="card-desc">${escapeText(item.artist || 'Unknown Artist')}</div>
            </div>
            <button class="btn-search" onclick="addAiRecTrack(${idx})">追加</button>
          </div>
        `).join('');
      } catch (err) {
        console.warn('AI recommend error:', err);
        grid.innerHTML = '<p style="color:var(--text-sub); grid-column: 1/-1;">AIのおすすめを取得できませんでした（サーバーへの接続かAPIキーをご確認ください）。</p>';
      }
    }

    // AIが提案した「曲名 アーティスト名」を、solOS方式のPiped検索で1件だけ実際の動画に変換する
    async function findOneTrack(query) {
      const apiEndpoints = [
        `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query)}&filter=music_songs`,
        `https://api.piped.private.coffee/search?q=${encodeURIComponent(query)}&filter=music_songs`
      ];

      for (const endpoint of apiEndpoints) {
        try {
          const res = await fetch(endpoint);
          if (!res.ok) continue;
          const data = await res.json();
          const items = data.items || data;
          if (!items || !items.length) continue;

          const item = items.find(it => it.type === 'stream' || it.url);
          if (!item) continue;

          const videoId = item.url ? item.url.replace('/watch?v=', '') : item.id;
          if (!videoId) continue;

          return {
            id: videoId,
            title: item.title || query,
            artist: item.uploaderName || item.artist || 'Unknown Artist',
            cover: item.thumbnail || `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`,
            serverUrl: `${apiBase()}/api/stream/${videoId}`
          };
        } catch (err) {
          console.warn('findOneTrack error:', err);
        }
      }
      return null;
    }

    // AIおすすめカードの「追加」ボタン用。addServerTrackと同じ流れで再生キューに入れる。
    async function addAiRecTrack(index) {
      const item = window._aiRecResults?.[index];
      if (!item) return;

      const track = {
        id: String(item.id),
        title: item.title,
        artist: item.artist,
        cover: item.cover,
        serverUrl: item.serverUrl,
        local: false
      };

      const existingIndex = songs.findIndex(s => String(s.id) === track.id);
      if (existingIndex >= 0) {
        await loadTrack(existingIndex);
        document.querySelector('.nav-tab[data-tab="playlist"]').click();
        return;
      }

      songs.push(track);
      saveSongsToStorage();
      renderTrackList();
      renderHomeGrid();

      await loadTrack(songs.length - 1);
      document.querySelector('.nav-tab[data-tab="playlist"]').click();
    }

    /**
     * 検索タブの「関連するAIおすすめを見る」ボタン用。
     * 1日あたりのAI呼び出し回数が少ないため、検索するたびに自動では呼ばず、
     * ボタンを押した時だけ問い合わせる。
     */
    async function loadSearchRecommendations() {
      const query = document.getElementById('searchInput').value.trim();
      const grid = document.getElementById('searchRecGrid');
      if (!query || !grid) return;

      grid.innerHTML = '<p style="color:var(--text-sub); grid-column: 1/-1;">✨ AIが関連曲を考え中...</p>';

      try {
        const res = await fetch(`${apiBase()}/api/recommend`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history: [query] })
        });

        if (res.status === 429) {
          const errData = await res.json().catch(() => ({}));
          grid.innerHTML = `<p style="color:var(--text-sub); grid-column: 1/-1;">${escapeText(errData.error || '本日のAI利用回数の上限に達しました。')}</p>`;
          return;
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        const picks = Array.isArray(data.recommendations) ? data.recommendations : [];

        if (!picks.length) {
          grid.innerHTML = '<p style="color:var(--text-sub); grid-column: 1/-1;">おすすめを取得できませんでした。</p>';
          return;
        }

        const found = await Promise.all(
          picks.map(pick => findOneTrack(`${pick.title} ${pick.artist || ''}`.trim()))
        );
        window._searchRecResults = found.filter(Boolean);

        if (!window._searchRecResults.length) {
          grid.innerHTML = '<p style="color:var(--text-sub); grid-column: 1/-1;">関連曲の音源が見つかりませんでした。</p>';
          return;
        }

        grid.innerHTML = window._searchRecResults.map((item, idx) => `
          <div class="card">
            <img src="${escapeText(item.cover || '')}" class="card-img">
            <div class="card-info">
              <div class="card-title">${escapeText(item.title)}</div>
              <div class="card-desc">${escapeText(item.artist || 'Unknown Artist')}</div>
            </div>
            <button class="btn-search" onclick="addSearchRecTrack(${idx})">追加</button>
          </div>
        `).join('');
      } catch (err) {
        console.warn('search recommend error:', err);
        grid.innerHTML = '<p style="color:var(--text-sub); grid-column: 1/-1;">AIのおすすめを取得できませんでした。</p>';
      }
    }

    async function addSearchRecTrack(index) {
      const item = window._searchRecResults?.[index];
      if (!item) return;

      const track = {
        id: String(item.id),
        title: item.title,
        artist: item.artist,
        cover: item.cover,
        serverUrl: item.serverUrl,
        local: false
      };

      const existingIndex = songs.findIndex(s => String(s.id) === track.id);
      if (existingIndex >= 0) {
        await loadTrack(existingIndex);
        document.querySelector('.nav-tab[data-tab="playlist"]').click();
        return;
      }

      songs.push(track);
      saveSongsToStorage();
      renderTrackList();
      renderHomeGrid();

      await loadTrack(songs.length - 1);
      document.querySelector('.nav-tab[data-tab="playlist"]').click();
    }

    document.getElementById('btnSearchRec')?.addEventListener('click', loadSearchRecommendations);
    async function loadAiLyrics() {
      const box = document.getElementById('lyricsBox');
      if (!box) return;

      const track = songs[currentTrackIndex];
      if (!track) {
        box.innerHTML = '<p style="padding:20px;color:var(--text-sub);">曲を再生してから試してください。</p>';
        return;
      }

      box.innerHTML = '<p style="padding:20px;color:var(--text-sub);">✨ AIが歌詞を聞き取り中...(初回は数十秒かかることがあります)</p>';

      try {
        const res = await fetch(`${apiBase()}/api/lyrics/${encodeURIComponent(track.id)}`);
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${res.status}`);
        }

        const data = await res.json();
        const lines = Array.isArray(data.lyrics) ? data.lyrics : [];

        if (!lines.length) {
          box.innerHTML = '<p style="padding:20px;color:var(--text-sub);">歌詞を聞き取れませんでした(インストゥルメンタル曲の可能性があります)。</p>';
          return;
        }

        box.innerHTML = lines.map(line => `
          <div class="l-line" data-time="${line.time}">${escapeText(line.text)}</div>
        `).join('');

        box.querySelectorAll('.l-line').forEach(el => {
          el.addEventListener('click', () => {
            const t = Number(el.dataset.time) || 0;
            audio.currentTime = t;
            if (audio.paused) audio.play();
          });
        });

        updateLyricsHighlight();
      } catch (err) {
        console.warn('AI lyrics error:', err);
        box.innerHTML = `<p style="padding:20px;color:var(--text-sub);">歌詞を取得できませんでした。(${escapeText(err.message || '')})</p>`;
      }
    }

    // 再生位置に合わせて、今のフレーズの歌詞行をハイライトし、自動スクロールする
    function updateLyricsHighlight() {
      const box = document.getElementById('lyricsBox');
      if (!box) return;

      const lines = box.querySelectorAll('.l-line');
      if (!lines.length) return;

      const current = audio.currentTime || 0;
      let activeIndex = -1;

      lines.forEach((el, i) => {
        const t = Number(el.dataset.time) || 0;
        if (t <= current) activeIndex = i;
      });

      lines.forEach((el, i) => {
        el.classList.toggle('active', i === activeIndex);
      });

      if (activeIndex >= 0) {
        lines[activeIndex].scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }

    document.getElementById('btnAiLyrics')?.addEventListener('click', loadAiLyrics);

    async function addServerTrack(index) {
      const item = window._searchResults?.[index];
      if (!item) return;

      const track = {
        id: String(item.id || item.videoId || crypto.randomUUID()),
        title: item.title || 'Unknown Title',
        artist: item.artist || item.uploader || 'Unknown Artist',
        cover: item.cover || item.thumbnail || '',
        serverUrl: item.serverUrl || '',
        local: false
      };

      const existingIndex = songs.findIndex(s => String(s.id) === track.id);

      if (existingIndex >= 0) {
        await loadTrack(existingIndex);
        document.querySelector('.nav-tab[data-tab="playlist"]').click();
        return;
      }

      if (!track.serverUrl) {
        alert('検索結果に serverUrl がありません。サーバーAPIが返す必要があります。');
        return;
      }

      songs.push(track);
      saveSongsToStorage();
      renderTrackList();
      renderHomeGrid();

      await loadTrack(songs.length - 1);
      document.querySelector('.nav-tab[data-tab="playlist"]').click();
    }

    function deleteTrack(event, index) {
      event.stopPropagation();
      const id = songs[index]?.id;
      songs.splice(index, 1);
      saveSongsToStorage();

      if (currentTrackIndex === index) {
        audio.pause();
        audio.removeAttribute('src');
        currentTrackIndex = -1;
        resetPlayerUI();
      } else if (currentTrackIndex > index) {
        currentTrackIndex--;
      }

      if (id) removeLocalTrack(id).catch(() => {});
      renderTrackList();
      renderHomeGrid();
    }

    function clearPlaylist() {
      if (!songs.length) return;
      if (!confirm('マイプレイリストの全楽曲を削除しますか？')) return;

      songs.forEach(s => removeLocalTrack(s.id).catch(() => {}));
      songs = [];
      currentTrackIndex = -1;
      audio.pause();
      audio.removeAttribute('src');
      saveSongsToStorage();
      resetPlayerUI();
      renderTrackList();
      renderHomeGrid();
    }

    function selectTrack(i) {
      loadTrack(i);
      document.querySelector('.nav-tab[data-tab="playlist"]').click();
    }

    async function renderOfflinePanel() {
      const local = await getAllLocalTracks();
      const grid = document.getElementById('searchResultGrid');

      if (!local.length) {
        grid.innerHTML = '<p style="padding:20px;">この端末に保存された曲はありません。</p>';
        return;
      }

      grid.innerHTML = local.map((s, i) => `
        <div class="card" onclick="playLocalById('${encodeURIComponent(s.id)}')">
          <img src="${escapeText(s.cover || '')}" class="card-img">
          <div class="card-info">
            <div class="card-title">${escapeText(s.title)}</div>
            <div class="card-desc">${escapeText(s.artist)}</div>
          </div>
          <button class="btn-del-track" onclick="event.stopPropagation();deleteOffline('${encodeURIComponent(s.id)}')">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      `).join('');
    }

    async function playLocalById(encoded) {
      const id = decodeURIComponent(encoded);
      const local = await getLocalTrack(id);
      if (!local) return;

      audio.src = URL.createObjectURL(local.blob);
      audio.play();
      document.getElementById('barTitle').innerText = local.title;
      document.getElementById('barArtist').innerText = local.artist;
      document.getElementById('barCover').src = local.cover || '';
    }

    async function deleteOffline(encoded) {
      const id = decodeURIComponent(encoded);
      await removeLocalTrack(id);
      updateLocalStorageFlag(id, false);
      renderTrackList();
      renderHomeGrid();
      renderOfflinePanel();
    }

    audio.addEventListener('play', updatePlayButton);
    audio.addEventListener('pause', updatePlayButton);
    audio.addEventListener('ended', () => {
      if (repeatMode === 'one') {
        audio.currentTime = 0;
        audio.play();
        return;
      }
      if (repeatMode === 'off' && !shuffleOn && currentTrackIndex === songs.length - 1) {
        // リピートoffで最後の曲まで再生し終えたら、そこで止まる
        updatePlayButton();
        return;
      }
      nextTrack();
    });
    audio.addEventListener('loadedmetadata', () => {
      document.getElementById('timeDuration').innerText = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      const current = audio.currentTime || 0;
      const duration = audio.duration || 0;
      document.getElementById('timeCurrent').innerText = formatTime(current);
      document.getElementById('timeDuration').innerText = formatTime(duration);
      document.getElementById('progressSlider').value = duration ? (current / duration) * 100 : 0;
      updateLyricsHighlight();
    });

    document.getElementById('btnPlay').addEventListener('click', togglePlay);
    document.getElementById('btnNext').addEventListener('click', nextTrack);
    document.getElementById('btnPrev').addEventListener('click', prevTrack);

    document.getElementById('btnShuffle')?.addEventListener('click', () => {
      shuffleOn = !shuffleOn;
      updatePlaybackModeUI();
    });

    document.getElementById('btnRepeat')?.addEventListener('click', () => {
      repeatMode = repeatMode === 'off' ? 'all' : (repeatMode === 'all' ? 'one' : 'off');
      updatePlaybackModeUI();
    });

    ['eqBass', 'eqMid', 'eqTreble'].forEach(id => {
      document.getElementById(id)?.addEventListener('input', (e) => {
        if (!currentUser) return; // disabled属性で基本弾かれるが念のため
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        applyEqFromSliders();
        const label = document.getElementById(id + 'Val');
        if (label) label.innerText = `${e.target.value}dB`;
      });
    });

    document.getElementById('progressSlider').addEventListener('input', e => {
      if (audio.duration) audio.currentTime = (Number(e.target.value) / 100) * audio.duration;
    });

    document.getElementById('btnSearch').addEventListener('click', () => {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      searchHistory = [q, ...searchHistory.filter(x => x !== q)].slice(0, 10);
      localStorage.setItem('sounddeck_search_history', JSON.stringify(searchHistory));
      searchServer(q);
      loadAiRecommendations();
    });

    document.getElementById('searchInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') document.getElementById('btnSearch').click();
    });

    document.getElementById('serverApi')?.addEventListener('change', e => {
      localStorage.setItem('sounddeck_api', e.target.value.trim());
    });

    document.querySelectorAll('.nav-tab').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.view-tab').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        document.getElementById(`tab-${b.dataset.tab}`).classList.add('active');

        if (b.dataset.tab === 'playlist') renderTrackList();
        if (b.dataset.tab === 'home') renderHomeGrid();
        if (b.dataset.tab === 'search') {}
      });
    });

    document.getElementById('btnTheme').addEventListener('click', () => {
      const dark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (dark) document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', 'dark');
    });

    window.addEventListener('DOMContentLoaded', () => {
      const savedApi = localStorage.getItem('sounddeck_api');
      if (savedApi) document.getElementById('serverApi').value = savedApi;
      renderTrackList();
      renderHomeGrid();
      loadAiRecommendations();
      updatePlaybackModeUI();
    });
  </script>
</body>
</html>
